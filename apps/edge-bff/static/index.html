  --card-foreground: oklch(14.5% 0 0);

  --primary-foreground: oklch(100% 0 0);
  --secondary: oklch(95% .0058 264.53);
  --secondary-foreground: #030213;
  --muted: #ececf0;
  --muted-foreground: #717182;
  --accent: #e9ebef;
  --accent-foreground: #030213;
  --destructive: #d4183d;
  --destructive-foreground: #fff;
  --border: #0000001a;
  --input: transparent;
  --input-background: #f3f3f5;
  --switch-background: #cbced4;
  --ring: oklch(70.8% 0 0);
  --chart-1: oklch(64.6% .222 41.116);
  --chart-2: oklch(60% .118 184.704);
  --chart-3: oklch(39.8% .07 227.392);
  --chart-4: oklch(82.8% .189 84.429);
  --chart-5: oklch(76.9% .188 70.08);

  --sidebar-foreground: oklch(14.5% 0 0);
  --sidebar-primary: #030213;
  --sidebar-primary-foreground: oklch(98.5% 0 0);
  --sidebar-accent: oklch(97% 0 0);
  --sidebar-accent-foreground: oklch(20.5% 0 0);
  --sidebar-border: oklch(92.2% 0 0);
  --sidebar-ring: oklch(70.8% 0 0);
  --bg: var(--background);
  --bg-deep: var(--background);
  --surface: var(--sidebar);
  --surface-2: var(--secondary);
  --surface-3: var(--accent);
  --hover: var(--accent);
  --border-soft: var(--border);
  --text: var(--foreground);
  --text-2: var(--muted-foreground);
  --accent-strong: var(--primary);
  --accent-soft: var(--accent);
  --violet: var(--chart-4);

  color: var(--text);

* {
  box-sizing: border-box;
}
html, body, #root {
  min-height: 100%;
  margin: 0;
  background: var(--bg);
}
body {
  overflow-x: hidden;
  font-size: 1rem;
  line-height: 1.5;
}
button, input, textarea {
  font: inherit;
}
button {
  color: inherit;
}
button, input, textarea, .conversation, .source-row, .generated-row, .watch-row, .market-table tr {
  transition: color .15s cubic-bezier(.4,0,.2,1), background-color .15s cubic-bezier(.4,0,.2,1), border-color .15s cubic-bezier(.4,0,.2,1), box-shadow .15s cubic-bezier(.4,0,.2,1);
}
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
  outline: none;
  border-color: var(--ring);
  box-shadow: 0 0 0 3px var(--ring);
  @supports (color: color-mix(in lab, red, red)) {
    box-shadow: 0 0 0 3px color-mix(in oklch,var(--ring) 50%,transparent);
  }
}
button:disabled {
  opacity: .5;
  cursor: not-allowed;
  pointer-events: none;
}
.app {
  min-height: 100vh;
  background: var(--bg);
}
.topbar {
  height: var(--topbar);
  display: flex;
  align-items: center;
  padding: 0 18px;
  border-bottom: 1px solid var(--border);
  background: var(--background);
  position: sticky;
  top: 0;
  z-index: 30;
  gap: 24px;
}
.brand {
  border: 0;
  background: transparent;
  color: inherit;
  text-decoration: none;
  display: flex;
  gap: 10px;
  align-items: center;
  letter-spacing: .14em;
  cursor: pointer;
}
.brand-mark {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  background: var(--primary);
  color: var(--primary-foreground);
  border-radius: var(--radius-sm);
  font-weight: 600;
  letter-spacing: 0;
}
.topbar nav {
  display: flex;
  align-self: stretch;
}
.topbar nav button {
  border: 0;
  background: transparent;
  color: var(--text-2);
  padding: 0 13px;
  position: relative;
  cursor: pointer;
}
.topbar nav button:hover {
  color: var(--text);
  background: var(--accent);
}
.topbar nav button.active {
  color: var(--text);
  background: transparent;
}
.topbar nav button.active:hover {
  background: transparent;
}
.topbar nav button.active:after {
  content: "";
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: -1px;
  height: 2px;
  background: var(--primary);
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-left: auto;
  position: relative;
}
.top-actions .search {
  width: 210px;
}
.avatar {
  border: 1px solid var(--border);
  border-radius: 50%;
  width: 32px;
  height: 32px;
  background: var(--secondary);
  font-size: .75rem;
  color: var(--secondary-foreground);
  cursor: pointer;
  margin-left: 4px;
}
.avatar:hover,.avatar.open {
  background: var(--accent);
  color: var(--accent-foreground);
}
.icon {
  flex: none;
}
.btn, .icon-btn, .tabs button, .mini-tabs button {
  border: 1px solid var(--control-border);
  background: var(--control-background);
  color: var(--foreground);
  min-height: 36px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 16px;
  cursor: pointer;
  white-space: nowrap;
  font-size: .875rem;
  font-weight: 500;
}
.btn-label {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn.has-end-icon {
  justify-content: space-between;
}
.btn-end-icon {
  display: inline-flex;
  transition: transform .15s cubic-bezier(.4,0,.2,1);
}
.btn:hover .btn-end-icon {
  transform: translateX(3px);
}
.btn:hover, .icon-btn:hover {
  color: var(--accent-foreground);
  background: var(--accent);
  border-color: var(--control-border);
}
.btn:active, .icon-btn:active {
  background: var(--accent);
}
.btn.primary {
  color: var(--primary-foreground);
  background: var(--primary);
  border-color: var(--primary);
  font-weight: 500;
}
.btn.primary:hover {
  background: var(--primary);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklch,var(--primary) 90%,transparent);
  }
}
.btn.ghost {
  border-color: transparent;
  background: transparent;
}
.btn.ghost:hover {
  color: var(--accent-foreground);
  background: var(--accent);
}
.icon-btn {
  width: 36px;
  padding: 0;
}
.icon-btn.selected {
  color: var(--accent-foreground);
  background: var(--accent);
  border-color: var(--input);
}
.search {
  height: 36px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--field-background);
  border: 1px solid var(--field-border);
  border-radius: var(--radius-sm);
  padding: 0 12px;
  color: var(--muted-foreground);
}
.search:focus-within {
  border-color: var(--ring);
  box-shadow: 0 0 0 3px var(--ring);
  @supports (color: color-mix(in lab, red, red)) {
    box-shadow: 0 0 0 3px color-mix(in oklch,var(--ring) 50%,transparent);
  }
}
.search input {
  border: 0;
  outline: 0;
  min-width: 0;
  width: 100%;
  color: var(--text);
  background: transparent;
}
.search input::placeholder, textarea::placeholder {
  color: var(--muted-foreground);
}
kbd {
  font-family:Inter,"Segoe UI",sans-serif;
  font-size: .75rem;
  padding: 2px 5px;
  border: 1px solid var(--border);
  border-radius: calc(var(--radius-sm) - .125rem);
  color: var(--muted-foreground);
}
.monitor-layout {
  height: calc(100vh - var(--topbar));
  display: grid;
  grid-template-columns: 210px minmax(590px,1fr) 320px;
  overflow: hidden;
}
.conversation-panel, .details-panel {
  background: var(--surface);
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.conversation-panel {
  border-right: 1px solid var(--border);
  padding: 14px 12px 10px;
  gap: 12px;
}
.panel-head, .details-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.panel-head>div {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.eyebrow {
  color: var(--muted-foreground);
  text-transform: uppercase;
  letter-spacing: .1em;
  font-size: .75rem;
  font-weight: 500;
}
.mini-tabs {
  display: flex;
  gap: 3px;
  background: var(--secondary);
  padding: 3px;
  border-radius: var(--radius-sm);
}
.mini-tabs button {
  background: transparent;
  border: 0;
  min-height: 28px;
  flex: 1;
}
.mini-tabs button.active {
  background: var(--surface-3);
  color: var(--text);
}
.conversation-list {
  overflow: auto;
  margin: 0 -4px;
  padding: 0 4px;
}
.conversation-group>span {
  display: block;
  font-size: .75rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--muted-foreground);
  margin: 14px 6px 7px;
}
.conversation {
  width: 100%;
  display: flex;
  text-align: left;
  align-items: center;
  gap: 7px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--text-2);
  padding: 9px 8px;
  cursor: pointer;
}
.conversation span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.conversation .icon {
  width: 13px;
  margin-left: auto;
  color: var(--muted-foreground);
}
.conversation:hover {
  background: var(--hover);
  color: var(--text);
}
.conversation.active {
  background: var(--sidebar-accent);
  color: var(--sidebar-accent-foreground);
  border-color: var(--sidebar-border);
  font-weight: 500;
}
.sidebar-foot {
  margin-top: auto;
  border-top: 1px solid var(--border-soft);
  padding: 12px 4px 0;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-2);
  font-size: .75rem;
}
.sidebar-foot small {
  color: var(--muted-foreground);
  margin-left: auto;
}
.sidebar-foot span:not(.status-dot), .sidebar-foot small {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.status-dot, .live-dot {
  width: 7px;
  height: 7px;
  display: inline-block;
  border-radius: 50%;
  background: var(--positive);
}
.research-workspace {
  min-width: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
.workspace-tools {
  height: 48px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-soft);
  flex: none;
}
.workspace-tools>div {
  display: flex;
  gap: 8px;
  align-items: center;
  color: var(--text-2);
}
.share-anchor {
  position: relative;
}
.share-popover {
  position: absolute;
  top: 42px;
  right: 0;
  width: 348px;
  z-index: 85;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--popover);
  color: var(--popover-foreground);
  box-shadow: 0 14px 28px -12px var(--foreground);
  @supports (color: color-mix(in lab, red, red)) {
    box-shadow: 0 14px 28px -12px color-mix(in oklch,var(--foreground) 32%,transparent);
  }
}
.share-popover-head {
  padding: 14px 15px 12px;
  border-bottom: 1px solid var(--border);
}
.share-popover-head strong {
  font-size: .875rem;
  font-weight: 600;
}
.share-popover-head p {
  margin: 3px 0 0;
  color: var(--muted-foreground);
  font-size: .75rem;
}
.share-access {
  padding: 11px 8px;
}
.share-access>span {
  display: block;
  padding: 0 7px 7px;
  color: var(--muted-foreground);
  font-size: .7rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.share-access>button {
  width: 100%;
  min-height: 54px;
  display: grid;
  grid-template-columns: 18px minmax(0,1fr);

html:has(.watchlist-page),html:has(.monitor-layout),html:has(.chart-app) {
  --background: oklch(96.4% .006 250);
  --foreground: oklch(22% .018 258);
  --card: oklch(99.4% .002 250);
  --card-foreground: oklch(22% .018 258);
  --popover: oklch(99.6% .002 250);
  --secondary: oklch(97.2% .005 250);
  --muted: oklch(95.4% .006 250);
  --muted-foreground: oklch(51% .018 256);
  --accent: oklch(94.6% .011 252);
  --accent-foreground: oklch(22% .018 258);
  --border: oklch(89.6% .009 252);
  --border-soft: oklch(93.6% .006 252);
  --surface: var(--card);
  --text-2: oklch(38% .018 258);
  --sidebar: var(--card);
  --sidebar-accent: var(--accent);
  --sidebar-accent-foreground: var(--foreground);
  --sidebar-border: var(--border);
  --chart-1: oklch(52% .11 252);
  --positive: oklch(50% .095 158);
  --negative: oklch(52% .13 24);
  --wl-selected: oklch(94% .014 252);
  --wl-selected-rule: oklch(50% .08 252);
  --wl-header: oklch(97.2% .005 250);
  --wl-zebra: oklch(98.2% .003 250);
  --tooltip-background: oklch(24% .014 256);
  --tooltip-foreground: oklch(97% .004 250);
}
html.dark:has(.watchlist-page),html.dark:has(.monitor-layout),html.dark:has(.chart-app) {
  --background: oklch(16.8% .012 256);
  --foreground: oklch(93% .007 250);
  --card: oklch(19.8% .013 256);
  --card-foreground: oklch(93% .007 250);
  --popover: oklch(21.5% .014 256);
  --secondary: oklch(22.4% .014 256);
  --muted: oklch(23.5% .014 256);
  --muted-foreground: oklch(66% .016 252);
  --accent: oklch(25% .018 256);
  --accent-foreground: oklch(93% .007 250);
  --border: oklch(27.5% .016 256);
  --border-soft: oklch(23.6% .013 256);
  --input: oklch(28% .016 256);
  --input-background: oklch(22% .014 256);
  --text-2: oklch(80% .01 250);
  --sidebar: var(--card);
  --sidebar-accent: var(--accent);
  --sidebar-accent-foreground: var(--foreground);
  --sidebar-border: var(--border);
  --chart-1: oklch(68% .1 250);
  --positive: oklch(70% .1 158);
  --negative: oklch(66% .12 22);
  --wl-selected: oklch(26% .03 256);
  --wl-selected-rule: oklch(68% .08 250);
  --wl-header: oklch(21.8% .014 256);
  --wl-zebra: oklch(20.8% .013 256);

  --tooltip-foreground: oklch(95% .006 250);
}

.mode-anchor,.table-action-anchor {

.mode-menu {

  left: 0;
  bottom: 40px;
  z-index: 40;
  width: 310px;
  padding: 7px;

  border: 1px solid var(--border);
  border-radius: var(--radius);

.mode-menu>strong {

.mode-menu>button {

}
.mode-menu>button:not(:disabled):hover {

}
.mode-menu>button>i {
  width: 14px;
  height: 14px;

  place-items: center;
  margin-top: 2px;

}
.mode-menu>button>i>span {

  height: 6px;

.mode-menu>button>span {

  flex-direction: column;
  gap: 2px;
}
.mode-menu>button strong {

.mode-menu>button small {

.table-download-menu {

  padding: 0 7px;

  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--foreground);
  font-size: .75rem;
  cursor: pointer;
}
.table-download-menu button:hover:not(:disabled) {

}
.table-download-menu button:disabled {
  color: var(--muted-foreground);
  cursor: not-allowed;
}
.table-download-menu small {
  font-size: .58rem;
  text-transform: uppercase;
}
.research-table-dialog {

}
.research-table-dialog-body {
  max-height: calc(100vh - 190px);
  overflow: auto;
  padding: 16px 18px;
}
.research-table-dialog-body section {
  margin-top: 15px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.research-table-dialog-body section strong {
  font-size: .75rem;
  text-transform: uppercase;
  letter-spacing: .08em;
}
.research-table-dialog-body section p {
  color: var(--muted-foreground);
  font-size: .8125rem;
}
.research-table-dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 10px 18px;

}
.source-section-head {

}
.source-section-head[aria-expanded="false"] {

}
.source-section-head .icon {
  width: 12px;

}
.source-section-head[aria-expanded="true"] .icon {
  transform: rotate(180deg);
}
.source-row {

}
.source-row>.provider+.icon {
  margin-left: 0;
}
.source-detail>small {
  display: block;
  color: var(--muted-foreground);
  font-size: .75rem;
}
.source-detail>.btn {

}
.flow-step {
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--foreground);
  text-align: left;
  cursor: default;
}
.flow-step:hover {
  color: var(--foreground);
}
.flow-step>div {
  min-width: 0;
  flex: 1;
}
.flow-step>div p {
  margin: 7px 0 0;
  padding: 7px;
  border: 1px solid var(--border);

  line-height: 1.45;
}
.flow-step>.icon {

  color: var(--muted-foreground);
}
.flow-step.failed .flow-node {

}
.monitor-layout {
  background: var(--background);
}
.conversation-panel,.details-panel {
  height: 100%;
  overflow: hidden;
  background: var(--card);
}
.conversation-list,.details-content,.flow,.source-detail {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}
.research-workspace {
  height: 100%;
  overflow: hidden;
  background: var(--background);
}
.research-scroll {
  scroll-padding-top: 24px;
  padding-bottom: 32px;
}
.composer {
  box-shadow: 0 6px 14px -12px oklch(0% 0 0 / .45);
}
.result-metadata {
  display: flex;
  flex-wrap: wrap;
  gap: 3px 12px;
  margin: -10px 0 12px;
  color: var(--muted-foreground);
  font-size: .68rem;
  font-variant-numeric: tabular-nums;
}
.result-metadata small {
  width: 100%;
  font-size: inherit;
}
.research-section-row {
  position: relative;
  padding-left: 12px;
}
.research-section-row.selected {
  background: var(--accent);
  box-shadow: inset 2px 0 0 var(--muted-foreground);
  color: var(--foreground);
  font-weight: 500;
}
.research-section-row:hover {
  background: var(--accent);
}
.distribution-chart {
  position: relative;
  padding-top: 18px;
}
.distribution-chart .bars {
  height: 112px;
  gap: 6px;
  padding: 8px 6px 0;
  border-left: 1px solid var(--border-soft);
  border-bottom: 1px solid var(--border);
}
.distribution-chart .bars>i {
  min-height: 7px;
  flex: 1;
  background: var(--chart-1);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklch,var(--chart-1) 46%,transparent);
  }
  border-top: 2px solid var(--chart-1);
  border-radius: 2px 2px 0 0;
  transition: opacity .12s ease,background-color .12s ease;
}
.distribution-chart .bars>i.hovered {
  background: var(--chart-1);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklch,var(--chart-1) 72%,transparent);
  }
}
.distribution-chart .bars>i.deemphasized {
  opacity: .34;
}
.distribution-y {
  position: absolute;
  top: 0;
  left: 0;
  color: var(--muted-foreground);
  font-size: .65rem;
  letter-spacing: .06em;
}
.distribution-axis {
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
  color: var(--muted-foreground);
  font-size: .65rem;
  font-variant-numeric: tabular-nums;
}
.distribution-chart>small {
  display: block;
  margin-top: 2px;
  color: var(--muted-foreground);
  font-size: .65rem;
  text-align: right;
}
.edge-chart-tooltip {
  position: absolute;
  z-index: 20;
  top: 4px;
  min-width: 158px;
  padding: 8px 9px;
  transform: translateX(-50%);
  border: 1px solid var(--tooltip-foreground);
  @supports (color: color-mix(in lab, red, red)) {
    border: 1px solid color-mix(in oklch,var(--tooltip-foreground) 18%,transparent);
  }
  border-radius: var(--radius-sm);
  background: var(--tooltip-background);
  color: var(--tooltip-foreground);
  box-shadow: 0 8px 18px -14px oklch(0% 0 0 / .6);
  font-size: .7rem;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.edge-chart-tooltip>strong {
  display: block;
  margin-bottom: 5px;
  font-size: .67rem;
  letter-spacing: .07em;
  text-transform: uppercase;
}
.edge-chart-tooltip>div {
  display: flex;
  justify-content: space-between;
  gap: 16px;
}
.edge-chart-tooltip span {
  color: var(--tooltip-foreground);
  @supports (color: color-mix(in lab, red, red)) {
    color: color-mix(in oklch,var(--tooltip-foreground) 70%,transparent);
  }
}
.edge-chart-tooltip b {
  font-weight: 600;
}
.watchlist-page {
  background: var(--background);
}
.watch-main,.watch-view-tabs,.watch-preview {
  background: var(--card);
}
.watch-preview {
  border-left-color: var(--border-soft);
}
.watch-mini-chart {
  position: relative;
}
.watch-mini-chart .chart-hover-line {
  stroke: var(--muted-foreground);
  stroke-dasharray: 2 3;
  opacity: .6;
}
.watch-mini-chart .chart-hover-point {
  fill: var(--card);
  stroke: var(--chart-1);
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
}
.watch-mini-chart .edge-chart-tooltip {
  top: 7px;
}
.watch-table,.watch-facts {
  font-variant-numeric: tabular-nums;
}
.watch-table tbody tr.selected {
  background: var(--accent);
  box-shadow: inset 2px 0 0 var(--muted-foreground);
}

/* Selected designs: composer 01, search reference outline, conversation filters 05, export 02. */

/* Search conversation: thin neutral outline from the supplied visual references. */

  --conversation-search-border: #9aa3b1;

.conversation-panel > .search:focus-within,
.conversation-panel > .search:has(input:not(:placeholder-shown)) {

  box-shadow: none;
}
.conversation-panel > .search input {

}

  height: 26px;
  padding: 0 0 0 9px;
  margin-left: 2px;

.conversation-panel .mini-tabs button.active {

/* Monitor light palette copied from the supplied EDGE v2 reference. */
html:not(.dark):has(.monitor-layout), .app:not(.dark):has(.monitor-layout) {
  --background: #fff;
  --foreground: oklch(14.5% 0 0);
  --card: #fff;
  --card-foreground: oklch(14.5% 0 0);
  --popover: oklch(100% 0 0);
  --popover-foreground: oklch(14.5% 0 0);
  --primary: #030213;
  --primary-foreground: oklch(100% 0 0);
  --secondary: oklch(95% .0058 264.53);
  --secondary-foreground: #030213;
  --muted: #ececf0;
  --muted-foreground: #717182;
  --accent: #e9ebef;
  --accent-foreground: #030213;
  --destructive: #d4183d;
  --destructive-foreground: #fff;
  --border: #0000001a;
  --input: transparent;
  --input-background: #f3f3f5;
  --switch-background: #cbced4;
  --ring: oklch(70.8% 0 0);
  --chart-1: oklch(64.6% .222 41.116);
  --chart-2: oklch(60% .118 184.704);
  --chart-3: oklch(39.8% .07 227.392);
  --chart-4: oklch(82.8% .189 84.429);
  --chart-5: oklch(76.9% .188 70.08);
  --sidebar: oklch(98.5% 0 0);
  --sidebar-foreground: oklch(14.5% 0 0);
  --sidebar-primary: #030213;
  --sidebar-primary-foreground: oklch(98.5% 0 0);
  --sidebar-accent: oklch(97% 0 0);
  --sidebar-accent-foreground: oklch(20.5% 0 0);
  --sidebar-border: oklch(92.2% 0 0);
  --sidebar-ring: oklch(70.8% 0 0);
  --bg: var(--background);
  --bg-deep: var(--background);
  --surface: var(--sidebar);
  --surface-2: var(--secondary);
  --surface-3: var(--accent);
  --hover: var(--accent);
  --border-soft: var(--border);
  --text: var(--foreground);
  --text-2: var(--muted-foreground);
  --accent-strong: var(--primary);
  --accent-soft: var(--accent);
  --violet: var(--chart-4);
  --positive: var(--chart-2);
  --negative: var(--chart-5);
  --warning: var(--chart-3);
  --compare-1: oklch(56% .16 250);
  --compare-2: oklch(62% .14 310);
  --compare-3: oklch(58% .12 185);
  --compare-4: oklch(64% .13 65);
  --control-background: var(--background);
  --control-border: var(--border);
  --field-background: var(--input-background);
  --field-border: var(--input);
}

/* Approved message/Enter option 1; bright user-message palette. */
.monitor-layout .user-message {
  max-width:90%; margin-left:auto; margin-bottom:20px;
  background:#E8EEF5; border:1px solid #CBD6E3;
  border-radius:9px 9px 2px 9px; padding:12px 16px;

.monitor-layout .user-message .message-label {display:block; color:#64758B; font-family:Inter,"Segoe UI",sans-serif; font-size:10px; line-height:1.2; letter-spacing:.6px; font-weight:600;}

.monitor-layout .research-center {position:relative;}
.monitor-layout .research-scroll {padding-right:max(170px,6vw);}
.edge-scroll-marker {position:absolute;right:20px;z-index:6;max-width:145px;padding:9px 12px;transform:translateY(-50%);border:0;border-radius:6px;background:var(--card);color:var(--foreground);box-shadow:0 2px 10px #00000018;font:500 11px/1.4 Inter,"Segoe UI",sans-serif;cursor:grab;touch-action:none;user-select:none;}
.edge-scroll-marker:after {content:"";position:absolute;right:-4px;top:50%;width:8px;height:8px;background:var(--card);transform:translateY(-50%) rotate(45deg);}
.edge-scroll-marker:focus-visible,.edge-scroll-marker.dragging {outline:none;border:0;box-shadow:0 4px 16px #00000025;}
.edge-scroll-marker.dragging {cursor:grabbing;}
.research-scroll.edge-dragging {scroll-behavior:auto;}
.edge-scroll-marker[hidden] {display:none;}
@media print {.edge-scroll-marker {display:none!important;}}


.monitor-layout .user-message {box-shadow:0 3px 12px #00000014;}
.edge-model-anchor {position:relative;display:inline-flex;min-width:0;}
.edge-model-trigger {display:inline-flex;align-items:center;gap:7px;padding:7px 9px;border:0;border-radius:5px;background:transparent;color:var(--foreground);font:500 .78rem Inter,"Segoe UI",sans-serif;cursor:pointer;}
.edge-model-trigger:hover,.edge-model-trigger[aria-expanded="true"] {background:var(--accent);}
.edge-model-trigger img {width:17px;height:17px;object-fit:contain;}
.edge-model-trigger .icon {width:13px;height:13px;}
.edge-model-menu {position:absolute;bottom:calc(100% + 12px);left:0;width:min(420px,calc(100vw - 48px));padding:8px;background:var(--popover);color:var(--popover-foreground);border:0;border-radius:9px;box-shadow:0 6px 28px #00000026;z-index:30;}
.edge-model-head {display:flex;justify-content:space-between;align-items:center;padding:7px 8px 12px;font-size:12px;}
.edge-model-head small {font-size:10px;color:var(--muted-foreground);}
.edge-model-option {display:block;width:100%;text-align:left;padding:12px;border:0;border-radius:6px;background:transparent;color:inherit;cursor:pointer;font-family:Inter,"Segoe UI",sans-serif;}
.edge-model-option:hover {background:var(--accent);}
/* EXEC-UI-1015 U5: a card is the model button plus, when chosen, its settings in the right-hand space ("kotak A") */
.edge-model-card {display:grid;grid-template-columns:minmax(0,1fr);align-items:stretch;border-radius:6px;}
.edge-model-card.chosen {grid-template-columns:minmax(0,1fr) minmax(128px,42%);background:var(--secondary);box-shadow:0 2px 9px #00000012;}
.edge-model-card.chosen>.edge-model-option:hover {background:transparent;}
.edge-model-controls {display:flex;flex-direction:column;justify-content:center;gap:8px;padding:10px 10px 10px 0;min-width:0;}
.edge-model-controls .edge-model-levels {padding:0;gap:4px;}
.edge-model-controls .edge-model-levels small {font-size:9px;}
.edge-model-controls .edge-model-levels button {padding:5px 9px;font-size:11px;background:var(--background);}
.edge-model-controls .edge-model-levels button[aria-checked="true"] {background:var(--primary);color:var(--primary-foreground);}
.edge-model-brand {display:flex;align-items:center;gap:9px;}
.edge-model-brand img {width:27px;height:27px;object-fit:contain;}
.edge-model-brand small {display:block;color:var(--muted-foreground);font-size:10px;margin-bottom:3px;}
.edge-model-brand strong {font-size:12px;font-weight:600;}
.edge-model-stats {display:flex;gap:24px;margin-top:11px;}
.edge-model-stats small {display:block;color:var(--muted-foreground);font-size:9px;margin-bottom:3px;}
.edge-model-stats b {font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;}
.edge-model-id {display:block;margin-top:8px;font-size:10px;color:var(--muted-foreground);overflow-wrap:anywhere;}
.edge-model-options {max-height:min(444px,calc(100dvh - 220px));overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;}
.edge-model-options>.edge-model-card {min-height:148px;}
.edge-model-initial {display:inline-grid;place-items:center;flex:none;width:27px;height:27px;border-radius:5px;background:var(--secondary);color:var(--foreground);font:600 13px Inter,"Segoe UI",sans-serif;}
.edge-model-trigger>.edge-model-initial {width:18px;height:18px;font-size:10px;}
.edge-model-logo {display:inline-block;flex:none;width:27px;height:27px;object-fit:contain;}
.edge-model-logo.mono {background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;}
.edge-model-trigger>.edge-model-logo {width:18px;height:18px;}
.edge-run-model {display:inline-flex;align-items:center;gap:6px;}
.edge-run-model>.edge-model-logo,.edge-run-model>.edge-model-initial {width:16px;height:16px;font-size:9px;}
.result-action .edge-file-icon {width:16px;height:16px;flex:none;}
.edge-model-level {color:var(--muted-foreground);font-weight:400;}
.edge-model-levels {display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:12px 8px 4px;}
.edge-model-levels small {width:100%;font-size:10px;color:var(--muted-foreground);}
.edge-model-levels button {padding:6px 11px;border:0;border-radius:999px;background:var(--secondary);color:var(--foreground);font:500 12px Inter,"Segoe UI",sans-serif;cursor:pointer;}
.edge-model-levels button[aria-checked="true"] {background:var(--primary);color:var(--primary-foreground);}
/* EXEC-CHOICES: the "Response choices" design (v4 with a labelled separator), in the page's colours */
.edge-response-choices {position:relative;margin-top:30px;padding-top:26px;border-top:1px solid var(--border);}
.edge-response-choices.no-boundary {border-top:0;margin-top:18px;padding-top:0;}
.edge-boundary-label {position:absolute;top:-9px;left:0;padding-right:14px;background:var(--edge-result-bg,var(--background));font:600 10px/16px Inter,"Segoe UI",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-foreground);}
.edge-choices-title {font-weight:650;font-size:14px;margin-bottom:10px;}
.edge-choices-prompt {font-size:13px;line-height:1.65;margin:0 0 4px;}
.edge-choices-prompt p {margin:0 0 8px;}
.edge-choice-area {margin-top:14px;padding:16px;background:var(--card);border-radius:12px;box-shadow:0 5px 18px #0000000b;}
.edge-choices {display:flex;flex-wrap:wrap;gap:9px;}
.edge-choice {flex:1 1 200px;display:flex;align-items:center;gap:10px;padding:14px;border:0;border-radius:9px;background:var(--secondary);color:var(--foreground);text-align:left;cursor:pointer;font-family:Inter,"Segoe UI",sans-serif;transition:background .15s,box-shadow .15s,transform .15s;}
.edge-choice:hover:not(:disabled) {box-shadow:0 4px 14px #00000012;transform:translateY(-1px);}
.edge-choice:focus-visible {outline:none;box-shadow:0 3px 12px #17203335;}
.edge-choice.primary,.edge-choice.sent {background:var(--primary);color:var(--primary-foreground);}
.edge-choice-icon {display:inline-flex;flex:none;width:18px;height:18px;opacity:.85;}
.edge-choice-copy {flex:1;min-width:0;}
.edge-choice-copy strong {display:block;font-size:13px;font-weight:600;}
.edge-choice-copy small {display:block;margin-top:5px;font-size:11px;opacity:.7;}
.edge-choice-tail {font-size:11px;opacity:.7;}
.edge-choice:disabled {cursor:default;opacity:.6;box-shadow:none;transform:none;}
.edge-choice.primary:disabled:not(.sent) {background:var(--secondary);color:var(--muted-foreground);}
.edge-choice.sent:disabled {opacity:1;}
.edge-choices-help {margin:14px 0 0;font-size:11px;line-height:1.6;color:var(--muted-foreground);}
@media(max-width:600px) {.edge-choices {flex-direction:column;} .edge-choice {flex:1 1 auto;width:100%;} .edge-choice-area {padding:12px;}}



.user-sent-at {text-align:right;margin:7px 16px 19px;color:var(--muted-foreground);font:11px/1.4 Inter,"Segoe UI",sans-serif;}
.monitor-layout .user-message {margin-bottom:0;}
.result-actions {display:flex;gap:5px;align-items:center;position:relative;margin-top:16px;}
.result-action {display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted-foreground);padding:7px 8px;border-radius:5px;font:12px Inter,"Segoe UI",sans-serif;cursor:pointer;}
.result-action:hover {background:var(--accent);color:var(--foreground);}
.result-pin-action[aria-pressed="true"] {color:var(--foreground);}
.result-pin-action[aria-pressed="true"] .icon {fill:currentColor;}
.result-action .icon {width:15px;height:15px;}
.result-actions .share-popover {bottom:calc(100% + 8px);top:auto;left:0;right:auto;}
.edge-details-upper {flex:1;min-height:0;overflow:auto;scrollbar-width:thin;}
.edge-flow-list {padding:10px 14px;}
.edge-flow-accordion {border-bottom:1px solid var(--border);padding:9px 0;}
.edge-flow-accordion>summary {list-style:none;cursor:pointer;display:flex;gap:8px;align-items:flex-start;}
.edge-disclosure-chevron {width:14px;height:14px;flex:none;color:var(--muted-foreground);transition:transform 180ms ease;}
.edge-flow-accordion>summary>.edge-disclosure-chevron {margin-left:auto;}
.edge-flow-accordion[open]>summary>.edge-disclosure-chevron,.edge-pin-top button[aria-expanded="true"]>.edge-disclosure-chevron {transform:rotate(180deg);}
@media (prefers-reduced-motion:reduce) {.edge-disclosure-chevron {transition:none;}}
.edge-flow-accordion>summary strong {font-size:12px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5;}
.edge-flow-accordion>summary small {display:block;font-size:10px;color:var(--muted-foreground);margin-top:5px;line-height:1.5;}
.edge-flow-accordion .flow {padding:16px 0 0;}
.edge-pins {flex:0 0 34%;height:34%;max-height:none;min-height:150px;overflow:auto;padding:15px 14px;border-bottom:1px solid var(--border);scrollbar-width:thin;}
.edge-pins-head {display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;font-size:12px;font-weight:600;}
.edge-pins-head small {font-size:10px;font-weight:400;color:var(--muted-foreground);}
.edge-pin-card {padding:11px;margin:0 0 10px;border:0;border-radius:6px;box-shadow:0 2px 10px #00000014;background:var(--card);}
.edge-pin-top {display:flex;align-items:center;gap:6px;}
.edge-pin-top>.icon {width:14px;height:14px;color:var(--muted-foreground);flex:none;}
.edge-pin-title {flex:1;min-width:0;padding:0;text-align:left;border:0;background:transparent;color:var(--foreground);font:500 11px/1.5 Inter,"Segoe UI",sans-serif;cursor:pointer;}
.edge-pin-top button.small {display:inline-flex;align-items:center;justify-content:center;flex:none;width:24px;height:24px;border:0;border-radius:4px;background:transparent;color:var(--muted-foreground);font-size:15px;cursor:pointer;padding:0;}
.edge-pin-top button.small:hover {background:var(--accent);}
.edge-pin-top button.small:focus-visible {outline:none;box-shadow:0 2px 9px #00000015;}
.edge-pin-body {margin:10px 0 0 20px;font-size:11px;line-height:1.6;color:var(--muted-foreground);}
.edge-pin-body button {border:0;background:transparent;padding:8px 0 0;color:var(--foreground);font:11px Inter,"Segoe UI",sans-serif;cursor:pointer;}
.edge-pins-empty {font-size:11px;color:var(--muted-foreground);}
/* EXEC-SHARE-UI: the share card, drawn off screen in light colours whatever the theme; printed alone for the PDF */
.edge-share-stage {position:fixed;left:-10000px;top:0;width:760px;pointer-events:none;}
.edge-share-card {width:760px;box-sizing:border-box;padding:28px 34px 20px;background:#fff;color:oklch(14.5% 0 0);font:14px/1.6 Inter,"Segoe UI",sans-serif;}
.edge-share-head {display:flex;align-items:center;gap:9px;margin-bottom:14px;}
.edge-share-head img,.edge-share-head svg {height:30px;width:auto;}
.edge-share-meta {display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 0 14px;font-size:11.5px;color:#717182;}
.edge-share-meta>span {display:inline-flex;align-items:center;gap:6px;}
.edge-share-meta img {width:16px;height:16px;}
.edge-share-head span {margin-left:auto;font-size:12px;color:#717182;}
.edge-share-question {margin:0 0 14px;padding:9px 12px;border-radius:8px;background:#030213;color:#fff;}
.edge-share-question span {display:block;font-size:11px;color:#b5b5bd;}
.edge-share-question p {margin:2px 0 0;font-size:13px;}
.edge-share-body {display:block;margin:0;padding:0;border:0;background:none;}
.edge-share-body h1 {font-size:20px;line-height:1.3;margin:0 0 10px;}
.edge-share-body .edge-md-table {overflow:visible;max-width:none;}
.edge-share-body table {width:100%;font-size:11.5px;border-collapse:collapse;}
.edge-share-body th,.edge-share-body td {padding:4px 6px;}
.edge-share-body details>summary {list-style:none;}
.edge-share-body .edge-evidence-line {display:flex;align-items:center;gap:6px;margin:0 0 14px;}
.edge-share-body .edge-evidence-line>.edge-badge,.edge-share-body .edge-evidence-line>.edge-evidence-text {padding:0;border:0;background:none;color:#030213;font-size:12px;font-weight:500;}
.edge-share-body .edge-badge::before {display:none;}
.edge-share-foot {margin-top:16px;padding-top:9px;border-top:1px solid #0000001a;display:flex;flex-direction:column;gap:1px;font-size:11px;color:#717182;}
.edge-share-anchor {position:relative;display:inline-flex;align-items:center;gap:6px;}
.edge-share-menu {position:absolute;bottom:calc(100% + 6px);left:0;z-index:30;display:flex;flex-direction:column;min-width:150px;padding:4px;border:1px solid var(--border);border-radius:8px;background:var(--popover,#fff);box-shadow:0 8px 24px #0000001f;}
.edge-share-menu button {border:0;background:transparent;color:var(--foreground);text-align:left;padding:8px 10px;border-radius:5px;font:13px Inter,"Segoe UI",sans-serif;cursor:pointer;}
.edge-share-menu button:hover,.edge-share-menu button:focus-visible {background:var(--accent);}
@media print {body.edge-share-printing>*:not(.edge-share-stage){display:none!important;}body.edge-share-printing .edge-share-stage{position:static;left:auto;width:auto;}body.edge-share-printing .edge-share-card{width:auto;padding:0;}body.edge-share-printing .edge-share-card tr{break-inside:avoid;}}
@media print {.result-actions,.edge-pins,.user-sent-at {display:none!important;}body.edge-export-print .research-exchange:not(:has(.edge-export-print-target)){display:none!important;}body.edge-export-print .user-message,body.edge-export-print .edge-inline-progress{display:none!important;}}


.edge-flow-accordion>summary {border:0;border-radius:5px;padding:4px 0;outline:none;}
.edge-flow-accordion>summary:focus,.edge-flow-accordion>summary:focus-visible {outline:none;border:0;box-shadow:0 2px 9px #00000015;}
.edge-flow-accordion>summary {padding:8px;transition:background 120ms ease,box-shadow 120ms ease;}
.edge-flow-accordion>summary:hover {background:var(--card);box-shadow:0 2px 9px #00000015;}
.edge-flow-accordion[open]>summary {background:var(--card);border:0;box-shadow:0 2px 9px #00000015;}
.edge-pin-title,.edge-pin-title:hover,.edge-pin-title:focus,.edge-pin-title:active {color:var(--foreground);text-decoration:none;}
.edge-pin-card:hover {box-shadow:0 3px 12px #0000001c;}
.edge-history-head {display:flex;align-items:center;justify-content:space-between;padding:5px 0 11px;font-size:12px;font-weight:600;}
.edge-history-head small {font-size:10px;font-weight:400;color:var(--muted-foreground);}
.details-panel {position:relative;}
.edge-details-resizer {position:absolute;left:0;top:0;bottom:0;width:8px;z-index:20;cursor:col-resize;touch-action:none;outline:none;}
.edge-details-resizer:after {content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;transition:background 120ms ease;}
.edge-details-resizer:hover:after,.edge-details-resizer:focus-visible:after {background:var(--muted-foreground);}

.edge-pins {overscroll-behavior:contain;}
/* EXEC-DETAILS: collapsible section titles and the drag line between the two sections */
.edge-section-toggle {all:unset;box-sizing:border-box;touch-action:manipulation;display:flex;align-items:center;gap:6px;width:100%;cursor:pointer;font:inherit;color:inherit;}
.edge-section-toggle>.edge-disclosure-chevron {margin-left:auto;transition:transform 120ms ease;}
.edge-section-toggle[aria-expanded="true"]>.edge-disclosure-chevron {transform:rotate(180deg);}
.edge-section-toggle:focus-visible {outline:2px solid var(--ring, currentColor);outline-offset:2px;border-radius:4px;}
.details-panel.pins-collapsed .edge-pins {flex:none!important;height:auto!important;min-height:0;overflow:hidden;}
.details-panel.pins-collapsed .edge-pins-head {margin-bottom:0;}
.details-panel.flow-collapsed .edge-details-upper {flex:none;}
.details-panel.flow-collapsed:not(.pins-collapsed) .edge-pins {flex:1 1 auto!important;height:auto!important;}
.edge-pins-resizer {position:relative;flex:none;height:12px;margin:-6px 0;z-index:5;cursor:row-resize;touch-action:none;outline:none;}
.edge-pins-resizer:after {content:"";position:absolute;left:50%;top:50%;width:36px;height:4px;margin:-2px 0 0 -18px;border-radius:2px;background:var(--border);transition:background 120ms ease;}
.edge-pins-resizer:hover:after,.edge-pins-resizer:focus-visible:after,.edge-pins-resizer.dragging:after {background:var(--muted-foreground);}
.edge-details-upper {overscroll-behavior:contain;}

.market-search-anchor {position:relative;display:inline-flex;}
.market-search-inactive {font:inherit;text-align:left;cursor:pointer;}
.market-search-placeholder {flex:1;min-width:0;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.market-search-inactive:is(.active,:focus,:focus-visible) {outline:none;border-color:transparent;background:var(--card);color:var(--foreground);box-shadow:0 3px 13px #17203325;}
.market-search-inactive:is(.active,:focus) .market-search-placeholder {color:inherit;}
.market-search-ribbon {position:absolute;top:calc(100% + 11px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 10px;border:0;border-radius:6px;background:#20242c;color:#fff;box-shadow:0 5px 20px #17203312;font:500 12px/1.4 Inter,"Segoe UI",sans-serif;white-space:nowrap;z-index:120;}
.market-search-ribbon:before {content:"";position:absolute;top:-4px;left:calc(50% - 4px);width:8px;height:8px;background:#20242c;transform:rotate(45deg);}
.market-search-ribbon-close {display:grid;place-items:center;flex:none;width:22px;height:22px;padding:0;border:0;border-radius:4px;background:transparent;color:#c3c7ce;cursor:pointer;}
.market-search-ribbon-close:hover {background:#ffffff18;color:white;}
.market-search-ribbon-close:focus-visible {outline:1px solid #c3c7ce;outline-offset:2px;}
.market-search-ribbon-close>.icon {width:13px;height:13px;}

/* Approved conversation alignment option 5: aligned surfaces and dedicated ribbon gutter. */
.monitor-layout .research-workspace {--conversation-left:24px;--conversation-right:24px;--conversation-inset:18px;position:relative;}
.monitor-layout .research-scroll {padding-left:var(--conversation-left);padding-right:var(--conversation-right);}
.monitor-layout .composer {margin-left:var(--conversation-left);margin-right:var(--conversation-right);padding:14px var(--conversation-inset);background:#fafbfc;}
.monitor-layout .composer textarea {padding:0;}
.monitor-layout .composer>div:last-child {gap:8px;flex-wrap:wrap;}
.monitor-layout .composer>div:last-child>div {flex-wrap:wrap;gap:4px;min-width:0;}
.monitor-layout .result {padding:18px var(--conversation-inset);border-radius:9px;background:#fafbfc;}
.monitor-layout .user-message {max-width:90%;}
.monitor-layout .edge-scroll-marker {right:20px;max-width:112px;background:#f5f6f8;box-shadow:none;}
.monitor-layout .edge-scroll-marker:after {background:#f5f6f8;}
.monitor-layout .edge-scroll-marker:hover,.monitor-layout .edge-scroll-marker:focus-visible,.monitor-layout .edge-scroll-marker.dragging {box-shadow:0 3px 12px #00000018;}
html.dark .monitor-layout .result,html.dark .monitor-layout .composer {background:var(--card);}
html.dark .monitor-layout .edge-scroll-marker,html.dark .monitor-layout .edge-scroll-marker:after {background:var(--accent);}
@media(max-width:760px) {
 .monitor-layout .research-workspace {--conversation-left:18px;--conversation-right:112px;}
 .monitor-layout .edge-scroll-marker {right:16px;max-width:80px;font-size:10px;}
}


/* Ribbon removed for now; only DeepSeek and email sign-in are available. */
.monitor-layout .research-workspace {--conversation-right:32px;}
@media(max-width:760px) {.monitor-layout .research-workspace {--conversation-right:18px;}}
.edge-model-option:disabled {opacity:.45;cursor:not-allowed;filter:grayscale(1);background:transparent;box-shadow:none;}
.edge-model-option:disabled:hover {background:transparent;}
.monitor-layout .composer .icon-btn:disabled {opacity:.5;cursor:not-allowed;background:transparent;box-shadow:none;}


/* Error focus uses one consistent red boundary; password input never draws its own border. */
.auth-field .auth-password>input,.auth-field .auth-password>input[aria-invalid="true"],.auth-field .auth-password>input:focus-visible {border:0;outline:none;box-shadow:none;}
.auth-field>input[aria-invalid="true"],.auth-password:has(input[aria-invalid="true"]) {border-color:var(--destructive);outline:none;box-shadow:none;}
.auth-field>input[aria-invalid="true"]:focus-visible,.auth-password:has(input[aria-invalid="true"]):focus-within {border-color:var(--destructive);outline:none;box-shadow:0 0 0 1px var(--destructive);}


/* Stronger AI reply surfaces in both themes. */
html:not(.dark) .monitor-layout .result {background:#f0f2f5;--edge-result-bg:#f0f2f5;}
html.dark .monitor-layout .result {background:#20242b;--edge-result-bg:#20242b;}

/* Approved rotating-ring Flow and completion badges. Status follows the run. */
.flow-step .edge-flow-title{display:flex;align-items:center;gap:8px;}
.edge-flow-done{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:#16834b;color:#fff;flex:none;}
.edge-flow-done .icon{width:12px;height:12px;stroke:#fff;stroke-width:2.5;}
html.dark .edge-flow-done{background:#1e9a59;}
.edge-flow-spinner{display:block;width:19px;height:19px;border:2px solid var(--border);border-top-color:var(--foreground);border-right-color:var(--muted-foreground);border-radius:50%;animation:edge-flow-rotate 1s linear infinite;}
