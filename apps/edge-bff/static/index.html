* {
  box-sizing: border-box;
}
html, body, #root {
  min-height: 100%;
  margin: 0;
  background: var(--bg);
}
body {
  overflow-x: hidden;
  font-size: 1rem;
  line-height: 1.5;
}
button, input, textarea {
  font: inherit;
}
button {
  color: inherit;
}
button, input, textarea, .conversation, .source-row, .generated-row, .watch-row, .market-table tr {
  transition: color .15s cubic-bezier(.4,0,.2,1), background-color .15s cubic-bezier(.4,0,.2,1), border-color .15s cubic-bezier(.4,0,.2,1), box-shadow .15s cubic-bezier(.4,0,.2,1);
}
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
  outline: none;
  border-color: var(--ring);
  box-shadow: 0 0 0 3px var(--ring);
  @supports (color: color-mix(in lab, red, red)) {
    box-shadow: 0 0 0 3px color-mix(in oklch,var(--ring) 50%,transparent);
  }
}
button:disabled {
  opacity: .5;
  cursor: not-allowed;
  pointer-events: none;
}
.app {
  min-height: 100vh;
  background: var(--bg);
}
.topbar {
  height: var(--topbar);
  display: flex;
  align-items: center;
  padding: 0 18px;
  border-bottom: 1px solid var(--border);
  background: var(--background);
  position: sticky;
  top: 0;
  z-index: 30;
  gap: 24px;
}
.brand {
  border: 0;
  background: transparent;
  color: inherit;
  text-decoration: none;
  display: flex;
  gap: 10px;
  align-items: center;
  letter-spacing: .14em;
  cursor: pointer;
}
.brand-mark {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  background: var(--primary);
  color: var(--primary-foreground);
  border-radius: var(--radius-sm);
  font-weight: 600;
  letter-spacing: 0;
}
.topbar nav {
  display: flex;
  align-self: stretch;
}
.topbar nav button {
  border: 0;
  background: transparent;
  color: var(--text-2);
  padding: 0 13px;
  position: relative;
  cursor: pointer;
}
.topbar nav button:hover {
  color: var(--text);
  background: var(--accent);
}
.topbar nav button.active {
  color: var(--text);
  background: transparent;
}
.topbar nav button.active:hover {
  background: transparent;
}
.topbar nav button.active:after {
  content: "";
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: -1px;
  height: 2px;
  background: var(--primary);
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-left: auto;
  position: relative;
}
.top-actions .search {
  width: 210px;
}
.avatar {
  border: 1px solid var(--border);
  border-radius: 50%;
  width: 32px;
  height: 32px;
  background: var(--secondary);
  font-size: .75rem;
  color: var(--secondary-foreground);
  cursor: pointer;
  margin-left: 4px;
}
.avatar:hover,.avatar.open {
  background: var(--accent);
  color: var(--accent-foreground);
}
.icon {
  flex: none;
}
.btn, .icon-btn, .tabs button, .mini-tabs button {
  border: 1px solid var(--control-border);
  background: var(--control-background);
  color: var(--foreground);
  min-height: 36px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 16px;
  cursor: pointer;
  white-space: nowrap;
  font-size: .875rem;
  font-weight: 500;
}
.btn-label {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn.has-end-icon {
  justify-content: space-between;
}
.btn-end-icon {
  display: inline-flex;
  transition: transform .15s cubic-bezier(.4,0,.2,1);
}
.btn:hover .btn-end-icon {
  transform: translateX(3px);
}
.btn:hover, .icon-btn:hover {
  color: var(--accent-foreground);
  background: var(--accent);
  border-color: var(--control-border);
}
.btn:active, .icon-btn:active {
  background: var(--accent);
}
.btn.primary {
  color: var(--primary-foreground);
  background: var(--primary);
  border-color: var(--primary);
  font-weight: 500;
}
.btn.primary:hover {
  background: var(--primary);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklch,var(--primary) 90%,transparent);
  }
}
.btn.ghost {
  border-color: transparent;
  background: transparent;
}
.btn.ghost:hover {
  color: var(--accent-foreground);
  background: var(--accent);
}
.icon-btn {
  width: 36px;
  padding: 0;
}
.icon-btn.selected {
  color: var(--accent-foreground);
  background: var(--accent);
  border-color: var(--input);
}
.search {
  height: 36px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--field-background);
  border: 1px solid var(--field-border);
  border-radius: var(--radius-sm);
  padding: 0 12px;
  color: var(--muted-foreground);
}
.search:focus-within {
  border-color: var(--ring);
  box-shadow: 0 0 0 3px var(--ring);
  @supports (color: color-mix(in lab, red, red)) {
    box-shadow: 0 0 0 3px color-mix(in oklch,var(--ring) 50%,transparent);
  }
}
.search input {
  border: 0;
  outline: 0;
  min-width: 0;
  width: 100%;
  color: var(--text);
  background: transparent;
}
.search input::placeholder, textarea::placeholder {
  color: var(--muted-foreground);
}
kbd {
  font-family:Inter,"Segoe UI",sans-serif;
  font-size: .75rem;
  padding: 2px 5px;
  border: 1px solid var(--border);
  border-radius: calc(var(--radius-sm) - .125rem);
  color: var(--muted-foreground);
}
.monitor-layout {
  height: calc(100vh - var(--topbar));
  display: grid;
  grid-template-columns: 210px minmax(590px,1fr) 320px;
  overflow: hidden;
}
.conversation-panel, .details-panel {
  background: var(--surface);
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.conversation-panel {
  border-right: 1px solid var(--border);
  padding: 14px 12px 10px;
  gap: 12px;
}
.panel-head, .details-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.panel-head>div {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.eyebrow {
  color: var(--muted-foreground);
  text-transform: uppercase;
  letter-spacing: .1em;
  font-size: .75rem;
  font-weight: 500;
}
.mini-tabs {
  display: flex;
  gap: 3px;
  background: var(--secondary);
  padding: 3px;
  border-radius: var(--radius-sm);
}
.mini-tabs button {
  background: transparent;
  border: 0;
  min-height: 28px;
  flex: 1;
}
.mini-tabs button.active {
  background: var(--surface-3);
  color: var(--text);
}
.conversation-list {
  overflow: auto;
  margin: 0 -4px;
  padding: 0 4px;
}
.conversation-group>span {
  display: block;
  font-size: .75rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--muted-foreground);
  margin: 14px 6px 7px;
}
.conversation {
  width: 100%;
  display: flex;
  text-align: left;
  align-items: center;
  gap: 7px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--text-2);
  padding: 9px 8px;
  cursor: pointer;
}
.conversation span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.conversation .icon {
  width: 13px;
  margin-left: auto;
  color: var(--muted-foreground);
}
.conversation:hover {
  background: var(--hover);
  color: var(--text);
}
.conversation.active {
  background: var(--sidebar-accent);
  color: var(--sidebar-accent-foreground);
  border-color: var(--sidebar-border);
  font-weight: 500;
}
.sidebar-foot {
  margin-top: auto;
  border-top: 1px solid var(--border-soft);
  padding: 12px 4px 0;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-2);
  font-size: .75rem;
}
.sidebar-foot small {
  color: var(--muted-foreground);
  margin-left: auto;
}
.status-dot, .live-dot {
  width: 7px;
  height: 7px;
  display: inline-block;
  border-radius: 50%;
  background: var(--positive);
}
.research-workspace {
  min-width: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
.workspace-tools {
  height: 48px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-soft);
  flex: none;
}
.workspace-tools>div {
  display: flex;
  gap: 8px;
  align-items: center;
  color: var(--text-2);
}
.share-anchor {
  position: relative;
}
.share-popover {
  position: absolute;
  top: 42px;
  right: 0;
  width: 348px;
  z-index: 85;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--popover);
  color: var(--popover-foreground);
  box-shadow: 0 14px 28px -12px var(--foreground);
  @supports (color: color-mix(in lab, red, red)) {
    box-shadow: 0 14px 28px -12px color-mix(in oklch,var(--foreground) 32%,transparent);
  }
}
.share-popover-head {
  padding: 14px 15px 12px;
  border-bottom: 1px solid var(--border);
}
.share-popover-head strong {
  font-size: .875rem;
  font-weight: 600;
}
.share-popover-head p {
  margin: 3px 0 0;
  color: var(--muted-foreground);
  font-size: .75rem;
}
.share-access {
  padding: 11px 8px;
}
.share-access>span {
  display: block;
  padding: 0 7px 7px;
  color: var(--muted-foreground);
  font-size: .7rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.share-access>button {
  width: 100%;
  min-height: 54px;
  display: grid;
  grid-template-columns: 18px minmax(0,1fr);
  align-items: start;
  gap: 9px;
  padding: 8px 7px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  text-align: left;
  cursor: pointer;
}
.share-access>button:hover {
  background: var(--accent);
}
.share-access>button>i {
  width: 15px;
  height: 15px;
  margin-top: 2px;
  display: grid;
  place-items: center;
  border: 1px solid var(--muted-foreground);
  border-radius: 50%;

.auth-footer {
  min-height: 56px;

  overflow: auto;
  padding: 16px 18px;
}
.research-table-dialog-body section {
  margin-top: 15px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.research-table-dialog-body section strong {
  font-size: .75rem;
  text-transform: uppercase;
  letter-spacing: .08em;
}
.research-table-dialog-body section p {
  color: var(--muted-foreground);
  font-size: .8125rem;
}
.research-table-dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 10px 18px;
  border-top: 1px solid var(--border);
}
.source-section-head {
  width: 100%;
  border: 0;
  color: var(--foreground);
  cursor: pointer;
}
.source-section-head[aria-expanded="false"] {
  border-bottom: 0;
}
.source-section-head .icon {
  width: 12px;
  transition: transform .15s ease;
}
.source-section-head[aria-expanded="true"] .icon {
  transform: rotate(180deg);
}
.source-row {
  grid-template-columns: auto minmax(0,1fr) auto auto;
}
.source-row>.provider+.icon {
  margin-left: 0;
}
.source-detail>small {
  display: block;
  color: var(--muted-foreground);
  font-size: .75rem;
}
.source-detail>.btn {
  margin-top: 14px;
}
.flow-step {
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--foreground);
  text-align: left;
  cursor: default;
}
.flow-step:hover {
  color: var(--foreground);
}
.flow-step>div {
  min-width: 0;
  flex: 1;
}
.flow-step>div p {
  margin: 7px 0 0;
  padding: 7px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--secondary);
  color: var(--muted-foreground);
  font-size: .7rem;
  line-height: 1.45;
}
.flow-step>.icon {
  width: 12px;
  color: var(--muted-foreground);
}
.flow-step.failed .flow-node {
  color: var(--destructive);
}
.monitor-layout {
  background: var(--background);
}
.conversation-panel,.details-panel {
  height: 100%;
  overflow: hidden;
  background: var(--card);
}
.conversation-list,.details-content,.flow,.source-detail {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}
.research-workspace {
  height: 100%;
  overflow: hidden;
  background: var(--background);
}
.research-scroll {
  scroll-padding-top: 24px;
  padding-bottom: 32px;
}
.composer {
  box-shadow: 0 6px 14px -12px oklch(0% 0 0 / .45);
}
.result-metadata {
  display: flex;
  flex-wrap: wrap;
  gap: 3px 12px;
  margin: -10px 0 12px;
  color: var(--muted-foreground);
  font-size: .68rem;
  font-variant-numeric: tabular-nums;
}
.result-metadata small {
  width: 100%;
  font-size: inherit;
}
.research-section-row {
  position: relative;
  padding-left: 12px;
}
.research-section-row.selected {
  background: var(--accent);
  box-shadow: inset 2px 0 0 var(--muted-foreground);
  color: var(--foreground);
  font-weight: 500;
}
.research-section-row:hover {
  background: var(--accent);
}
.distribution-chart {
  position: relative;
  padding-top: 18px;
}
.distribution-chart .bars {
  height: 112px;
  gap: 6px;
  padding: 8px 6px 0;
  border-left: 1px solid var(--border-soft);
  border-bottom: 1px solid var(--border);
}
.distribution-chart .bars>i {
  min-height: 7px;
  flex: 1;
  background: var(--chart-1);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklch,var(--chart-1) 46%,transparent);
  }
  border-top: 2px solid var(--chart-1);
  border-radius: 2px 2px 0 0;
  transition: opacity .12s ease,background-color .12s ease;
}
.distribution-chart .bars>i.hovered {
  background: var(--chart-1);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklch,var(--chart-1) 72%,transparent);
  }
}
.distribution-chart .bars>i.deemphasized {
  opacity: .34;
}
.distribution-y {
  position: absolute;
  top: 0;
  left: 0;
  color: var(--muted-foreground);
  font-size: .65rem;
  letter-spacing: .06em;
}
.distribution-axis {
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
  color: var(--muted-foreground);
  font-size: .65rem;
  font-variant-numeric: tabular-nums;
}
.distribution-chart>small {
  display: block;
  margin-top: 2px;
  color: var(--muted-foreground);
  font-size: .65rem;
  text-align: right;
}
.edge-chart-tooltip {
  position: absolute;
  z-index: 20;
  top: 4px;
  min-width: 158px;
  padding: 8px 9px;
  transform: translateX(-50%);
  border: 1px solid var(--tooltip-foreground);
  @supports (color: color-mix(in lab, red, red)) {
    border: 1px solid color-mix(in oklch,var(--tooltip-foreground) 18%,transparent);
  }
  border-radius: var(--radius-sm);
  background: var(--tooltip-background);
  color: var(--tooltip-foreground);
  box-shadow: 0 8px 18px -14px oklch(0% 0 0 / .6);
  font-size: .7rem;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.edge-chart-tooltip>strong {
  display: block;
  margin-bottom: 5px;
  font-size: .67rem;
  letter-spacing: .07em;
  text-transform: uppercase;
}
.edge-chart-tooltip>div {
  display: flex;
  justify-content: space-between;
  gap: 16px;
}
.edge-chart-tooltip span {
  color: var(--tooltip-foreground);
  @supports (color: color-mix(in lab, red, red)) {
    color: color-mix(in oklch,var(--tooltip-foreground) 70%,transparent);
  }
}
.edge-chart-tooltip b {
  font-weight: 600;
}
.watchlist-page {
  background: var(--background);
}
.watch-main,.watch-view-tabs,.watch-preview {
  background: var(--card);
}
.watch-preview {
  border-left-color: var(--border-soft);
}
.watch-mini-chart {
  position: relative;
}
.watch-mini-chart .chart-hover-line {
  stroke: var(--muted-foreground);
  stroke-dasharray: 2 3;
  opacity: .6;
}
.watch-mini-chart .chart-hover-point {
  fill: var(--card);
  stroke: var(--chart-1);
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
}
.watch-mini-chart .edge-chart-tooltip {
  top: 7px;
}
.watch-table,.watch-facts {
  font-variant-numeric: tabular-nums;
}
.watch-table tbody tr.selected {
  background: var(--accent);
  box-shadow: inset 2px 0 0 var(--muted-foreground);
}
@media (max-width:1279px) {
  .screener-search {
    width: 190px;
  }
}
@media (max-width:1050px) {
  .monitor-layout {
    grid-template-columns: 52px minmax(0,1fr) !important;
  }
  .details-panel {
    display: none;
  }
  .chart-main {
    grid-template-columns: 42px minmax(0,1fr) !important;
  }
  .chart-intelligence,.chart-side {
    display: none;
  }
}

  .topbar, .conversation-panel, .details-panel, .composer, .share-popover, .research-composer, .monitor-sidebar, .monitor-details, .jump-latest { display: none !important; }

  .monitor-layout { display: block !important; }
}

/* Selected designs: composer 01, search reference outline, conversation filters 05, export 02. */
.app { --selection-outline: #505969; }
.app.dark { --selection-outline: #b5b5bd; }
/* Search conversation: thin neutral outline from the supplied visual references. */
.conversation-panel > .search {
  --conversation-search-border: #9aa3b1;
  --conversation-search-surface: #ffffff;
  background: var(--conversation-search-surface);
  border: 1px solid var(--conversation-search-border);
  border-radius: 8px;
  padding: 0 12px;
  box-shadow: none;
}
.dark .conversation-panel > .search {
  --conversation-search-border: #64646b;
  --conversation-search-surface: #0e0e0e;
}
.conversation-panel > .search:focus-within,
.conversation-panel > .search:has(input:not(:placeholder-shown)) {
  background: var(--conversation-search-surface);
  border-color: var(--conversation-search-border);
  box-shadow: none;
}
.conversation-panel > .search input {
  color: var(--text);
}
.conversation-panel > .search input::placeholder {
  color: var(--muted-foreground);
  opacity: 1;
}
.conversation-panel > .search input:focus-visible {
  outline: none;
  border: 0;
  box-shadow: none;
}
.conversation-panel > .search kbd {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  flex-shrink: 0;
  align-self: center;
  min-width: 20px;
  height: 26px;
  padding: 0 0 0 9px;
  margin-left: 2px;
  border: 0;
  border-left: 1px solid var(--border);
  border-radius: 0;
  background: transparent;
  color: var(--muted-foreground);
  font-size: 8px;
  line-height: 1.1;
}
.conversation-panel .mini-tabs button { position: relative; }
.conversation-panel .mini-tabs button.active {
  background: transparent;
  color: var(--text);
  box-shadow: none;
}
.conversation-panel .mini-tabs button.active::after {
  content: "";
  position: absolute;
  bottom: 4px;
  left: 20px;
  right: 20px;
  height: 2px;
  border-radius: 2px;
  background: var(--selection-outline);
  pointer-events: none;
}
.composer:focus-within, .composer.has-text {
  border-color: var(--selection-outline);
  box-shadow: none;
}
.composer textarea:focus-visible {
  outline: none;
  border: 0;
  box-shadow: none;
}
.share-popover.export-format-cards .share-popover-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  padding: 20px 20px 0;
  border-bottom: 0;
}
.share-popover.export-format-cards .share-popover-head p {
  margin: 8px 0 0;
  font-size: 12px;
  line-height: 1.65;
}
.export-format-cards .export-close {
  display: grid;
  place-items: center;
  padding: 3px;
  min-height: 22px;
  width: 22px;
  flex-shrink: 0;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--muted-foreground);
  cursor: pointer;
}
.export-format-cards .export-close:hover {
  background: var(--accent);
  color: var(--text);
}
.export-format-cards .export-card-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  padding: 20px;
}
.export-format-cards .export-format-card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 14px;
  min-height: 95px;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--secondary);
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.export-format-cards .export-format-card:hover { border-color: var(--selection-outline); }
.export-format-cards .export-format-card .icon { width: 22px; height: 22px; }


/* Monitor light palette copied from the supplied EDGE v2 reference. */
html:not(.dark):has(.monitor-layout), .app:not(.dark):has(.monitor-layout) {
  --background: #fff;
  --foreground: oklch(14.5% 0 0);
  --card: #fff;
  --card-foreground: oklch(14.5% 0 0);
  --popover: oklch(100% 0 0);
  --popover-foreground: oklch(14.5% 0 0);
  --primary: #030213;
  --primary-foreground: oklch(100% 0 0);
  --secondary: oklch(95% .0058 264.53);
  --secondary-foreground: #030213;
  --muted: #ececf0;
  --muted-foreground: #717182;
  --accent: #e9ebef;
  --accent-foreground: #030213;
  --destructive: #d4183d;
  --destructive-foreground: #fff;
  --border: #0000001a;
  --input: transparent;
  --input-background: #f3f3f5;
  --switch-background: #cbced4;
  --ring: oklch(70.8% 0 0);
  --chart-1: oklch(64.6% .222 41.116);
  --chart-2: oklch(60% .118 184.704);
  --chart-3: oklch(39.8% .07 227.392);
  --chart-4: oklch(82.8% .189 84.429);
  --chart-5: oklch(76.9% .188 70.08);
  --sidebar: oklch(98.5% 0 0);
  --sidebar-foreground: oklch(14.5% 0 0);
  --sidebar-primary: #030213;
  --sidebar-primary-foreground: oklch(98.5% 0 0);
  --sidebar-accent: oklch(97% 0 0);
  --sidebar-accent-foreground: oklch(20.5% 0 0);
  --sidebar-border: oklch(92.2% 0 0);
  --sidebar-ring: oklch(70.8% 0 0);
  --bg: var(--background);
  --bg-deep: var(--background);
  --surface: var(--sidebar);
  --surface-2: var(--secondary);
  --surface-3: var(--accent);
  --hover: var(--accent);
  --border-soft: var(--border);
  --text: var(--foreground);
  --text-2: var(--muted-foreground);
  --accent-strong: var(--primary);
  --accent-soft: var(--accent);
  --violet: var(--chart-4);
  --positive: var(--chart-2);
  --negative: var(--chart-5);
  --warning: var(--chart-3);
  --compare-1: oklch(56% .16 250);
  --compare-2: oklch(62% .14 310);
  --compare-3: oklch(58% .12 185);
  --compare-4: oklch(64% .13 65);
  --control-background: var(--background);
  --control-border: var(--border);
  --field-background: var(--input-background);
  --field-border: var(--input);
}

.app:not(.dark) .monitor-layout,
.app:not(.dark) .research-workspace,
.app:not(.dark) .workspace-tools { background: var(--background); }
.app:not(.dark) .conversation-panel,
.app:not(.dark) .details-panel { background: var(--surface); }
.app:not(.dark) .user-message,
.app:not(.dark) .composer,
.app:not(.dark) .source-section,
.app:not(.dark) .data-table { background: var(--card); }
.app:not(.dark) .data-table th,
.app:not(.dark) .source-section-head { background: var(--secondary); }
.app:not(.dark) .research-workspace .status-dot { background: var(--positive); }
/* Existing GLD percentage cells use the same teal treatment as the source. */
.app:not(.dark) [id="run-gld-1-statistics"] .data-table tbody tr:not(:nth-child(3)) td:nth-child(2) {
  color: var(--positive);
}


/* Approved message/Enter option 1; bright user-message palette. */
.monitor-layout .user-message {
  max-width:90%; margin-left:auto; margin-bottom:20px;
  background:#E8EEF5; border:1px solid #CBD6E3;
  border-radius:9px 9px 2px 9px; padding:12px 16px;
  font-family:Inter,"Segoe UI",sans-serif; text-align:left;
  color:#24364B; animation:edge-user-send .24s ease-out both;
}
.monitor-layout .user-message p {color:#24364B; margin:6px 0 0; font-family:Inter,"Segoe UI",sans-serif; font-size:13px; font-weight:400; line-height:1.5; letter-spacing:normal; word-spacing:normal;}
.monitor-layout .user-message .message-label {display:block; color:#64758B; font-family:Inter,"Segoe UI",sans-serif; font-size:10px; line-height:1.2; letter-spacing:.6px; font-weight:600;}
.monitor-layout .user-message .message-attachments span {color:#24364B; border-color:#CBD6E3;}
.monitor-layout .result {background:transparent; animation:edge-ai-arrival .3s ease-out both;}
.monitor-layout .edge-inline-progress {display:flex;align-items:center;gap:8px;margin:0 0 15px;min-height:35px;color:var(--muted-foreground);font-size:11px;}
.edge-response-dots {display:inline-flex;align-items:center;gap:4px;}
.edge-response-dots i {width:4px;height:4px;border-radius:50%;background:currentColor;animation:edge-response-pulse 1.2s infinite;}
.edge-response-dots i:nth-child(2) {animation-delay:.15s;}
.edge-response-dots i:nth-child(3) {animation-delay:.3s;}
@keyframes edge-response-pulse {0%,80%,100% {opacity:.35;}40% {opacity:1;}}
@keyframes edge-user-send {from {opacity:0;transform:translateY(6px);}to {opacity:1;transform:translateY(0);}}
@keyframes edge-ai-arrival {from {opacity:0;}to {opacity:1;}}
@media(prefers-reduced-motion:reduce) {.monitor-layout .user-message,.monitor-layout .result,.edge-response-dots i {animation:none;}}


/* Sign-in focus and centered action; light-theme user message. */
.auth-field>input:focus-visible,.auth-password:focus-within {
  outline:none; border-color:var(--foreground); box-shadow:0 0 0 1px var(--foreground);
}
.auth-password>input:focus-visible {outline:none;border:0;box-shadow:none;}
.auth-password>button:focus-visible {outline:1px solid var(--foreground);outline-offset:-4px;box-shadow:none;}
.auth-form-wrap form>.btn.primary.has-end-icon {position:relative;justify-content:center;padding:0 44px;}
.auth-form-wrap form>.btn.primary.has-end-icon .btn-end-icon {position:absolute;right:16px;}
html:not(.dark) .monitor-layout .user-message {background:#111111;border-color:#111111;color:#FFFFFF;}
html:not(.dark) .monitor-layout .user-message p {color:#FFFFFF;}
html:not(.dark) .monitor-layout .user-message .message-label {color:#C5C5C5;}
html:not(.dark) .monitor-layout .user-message .message-attachments span {color:#FFFFFF;border-color:#444444;background:#252525;}


/* Approved draggable section marker, option 1. */
.monitor-layout .research-center {position:relative;}
.monitor-layout .research-scroll {padding-right:max(170px,6vw);}
.edge-scroll-marker {position:absolute;right:20px;z-index:6;max-width:145px;padding:9px 12px;transform:translateY(-50%);border:0;border-radius:6px;background:var(--card);color:var(--foreground);box-shadow:0 2px 10px #00000018;font:500 11px/1.4 Inter,"Segoe UI",sans-serif;cursor:grab;touch-action:none;user-select:none;}
.edge-scroll-marker:after {content:"";position:absolute;right:-4px;top:50%;width:8px;height:8px;background:var(--card);transform:translateY(-50%) rotate(45deg);}
.edge-scroll-marker:focus-visible,.edge-scroll-marker.dragging {outline:none;border:0;box-shadow:0 4px 16px #00000025;}
.edge-scroll-marker.dragging {cursor:grabbing;}
.research-scroll.edge-dragging {scroll-behavior:auto;}
.edge-scroll-marker[hidden] {display:none;}
@media print {.edge-scroll-marker {display:none!important;}}


.monitor-layout .user-message {box-shadow:0 3px 12px #00000014;}
.edge-model-anchor {position:relative;display:inline-flex;min-width:0;}
.edge-model-trigger {display:inline-flex;align-items:center;gap:7px;padding:7px 9px;border:0;border-radius:5px;background:transparent;color:var(--foreground);font:500 .78rem Inter,"Segoe UI",sans-serif;cursor:pointer;}
.edge-model-trigger:hover,.edge-model-trigger[aria-expanded="true"] {background:var(--accent);}
.edge-model-trigger img {width:17px;height:17px;object-fit:contain;}
.edge-model-trigger .icon {width:13px;height:13px;}
.edge-model-menu {position:absolute;bottom:calc(100% + 12px);left:0;width:min(380px,calc(100vw - 48px));padding:8px;background:var(--popover);color:var(--popover-foreground);border:0;border-radius:9px;box-shadow:0 6px 28px #00000026;z-index:30;}
.edge-model-head {display:flex;justify-content:space-between;align-items:center;padding:7px 8px 12px;font-size:12px;}
.edge-model-head small {font-size:10px;color:var(--muted-foreground);}
.edge-model-option {display:block;width:100%;text-align:left;padding:12px;border:0;border-radius:6px;background:transparent;color:inherit;cursor:pointer;font-family:Inter,"Segoe UI",sans-serif;}
.edge-model-option:hover {background:var(--accent);}
.edge-model-option[aria-pressed="true"] {background:var(--secondary);box-shadow:0 2px 9px #00000012;}
.edge-model-brand {display:flex;align-items:center;gap:9px;}
.edge-model-brand img {width:27px;height:27px;object-fit:contain;}
.edge-model-brand small {display:block;color:var(--muted-foreground);font-size:10px;margin-bottom:3px;}
.edge-model-brand strong {font-size:12px;font-weight:600;}
.edge-model-stats {display:flex;gap:24px;margin-top:11px;}

/* Approved rotating-ring Flow and completion badges. Status follows the run. */
.flow-step .edge-flow-title{display:flex;align-items:center;gap:8px;}

/* EXEC-X (M124): the answer view (markdown, plan and finding cards, choices, pause). Existing tokens only. */
.edge-md {color:var(--text);line-height:1.62;font-size:.95rem;}

.edge-md-table .data-table .num {text-align:right;white-space:nowrap;}

.edge-claim {text-decoration:underline dotted var(--warning);text-underline-offset:3px;cursor:help;}

.edge-badge {display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:600;white-space:nowrap;border:1px solid var(--border);color:var(--text-2);background:var(--secondary);}

.edge-data-card {border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;}

.edge-finding {border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:10px;display:flex;flex-direction:column;gap:12px;background:var(--card);}
.edge-finding-head {display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.edge-finding-head strong {line-height:1.45;}
.edge-finding-part {display:flex;flex-direction:column;gap:3px;}
.edge-finding-part .edge-md p:last-child {margin-bottom:0;}
.edge-metrics {display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;}
.edge-metrics>div {background:var(--secondary);border-radius:var(--radius-sm);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;}
.edge-metrics span {font-size:.72rem;color:var(--muted-foreground);}
.edge-metrics strong {font-variant-numeric:tabular-nums;overflow-wrap:anywhere;}
.edge-source {border-top:1px solid var(--border-soft);padding:10px 0;display:flex;flex-direction:column;gap:8px;}
.edge-source:first-of-type {border-top:0;}
.edge-source-head {display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.edge-source-head code {font:.8rem Inter,"Segoe UI",sans-serif;overflow-wrap:anywhere;}
.sources .edge-data-row {grid-template-columns:minmax(80px,38%) 1fr;font-size:.82rem;}
.edge-pin-body .edge-md {font-size:.85rem;}
@media (max-width:640px) {
  .edge-plan,.edge-finding {padding:14px;}
  .edge-facts {grid-template-columns:1fr;}
  .edge-data-row {grid-template-columns:1fr;gap:2px;}
  .edge-choices .btn {flex:1 1 100%;justify-content:flex-start;}
  .edge-finding-head,.edge-plan-item-head {flex-direction:column;gap:6px;}
}

.monitor-layout .edge-facts dt.edge-fact-label,.monitor-layout .edge-plan-notes>div>.edge-eyebrow{display:inline-flex;align-items:center;width:fit-content;padding:3px 7px;margin-bottom:7px;background:var(--secondary);color:var(--text);border-radius:3px;border:1px solid var(--border);font-size:11px;line-height:1.4;font-weight:600;letter-spacing:0;text-transform:none;}
.monitor-layout .edge-plan-item-head .edge-step{border:0;background:#252b34;color:#f8fafc;padding:5px 9px;border-radius:3px;font-size:11px;font-weight:700;line-height:1.4;letter-spacing:0;text-transform:none;white-space:nowrap;}

.monitor-layout .edge-badge,.monitor-layout .edge-badge:is(.positive,.warning,.negative){border:0;border-radius:0;padding:0;background:transparent;color:var(--text-2);font-size:12px;line-height:1.5;font-weight:500;white-space:normal;}
.monitor-layout .edge-badge::before{display:none;}
.monitor-layout .edge-finding-head>.edge-badge{flex-shrink:0;border-left:0;padding-left:12px;max-width:40%;text-align:right;}
.monitor-layout .edge-tags{margin:4px 0 16px;}
.monitor-layout .edge-tags>.edge-badge{font-size:12px;color:var(--muted-foreground);}
.monitor-layout .edge-callout.pause{border:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);border-radius:0;background:transparent;box-shadow:none;padding:18px 0;margin:24px 0;}
.monitor-layout .edge-callout.pause .edge-callout-head>.icon{display:none;}

.monitor-layout .result-metadata{align-items:center;gap:6px 14px;line-height:1.5;}

 --foreground:#f1f4f8;--text:#f1f4f8;--text-2:#d1d7e0;--muted-foreground:#b5becb;

 --accent:#394453;--accent-foreground:#f1f4f8;--border:#46515f;--border-soft:#394453;
 --control-background:#303844;--control-border:#46515f;
 background:#20242b;color:#f1f4f8;
