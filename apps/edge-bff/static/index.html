.edge-sort:focus-visible {outline:2px solid var(--ring, currentColor);outline-offset:-2px;}
.edge-sort-icon {display:inline-flex;opacity:0;flex:none;}
.edge-sort-icon .icon {margin:0;}
th.edge-sortable:hover .edge-sort-icon,.edge-sort:focus-visible .edge-sort-icon,th.edge-sortable.sorted .edge-sort-icon {opacity:1;}
.edge-claim {text-decoration:underline dotted var(--warning);text-underline-offset:3px;cursor:help;}
.edge-claim:focus-visible {outline:2px solid var(--ring);outline-offset:2px;border-radius:2px;}
.edge-muted {color:var(--muted-foreground);}
.edge-eyebrow {font-size:.7rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-foreground);}
.edge-dot {width:7px;height:7px;border-radius:50%;background:var(--muted-foreground);display:inline-block;}
.edge-dot.positive {background:var(--positive);}
.edge-dot.warning {background:var(--warning);}
.edge-dot.negative {background:var(--negative);}
.edge-badge {display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:600;white-space:nowrap;border:1px solid var(--border);color:var(--text-2);background:var(--secondary);}
.edge-badge::before {content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9;}
.edge-badge.positive {color:var(--positive);border-color:color-mix(in oklch,var(--positive) 35%,transparent);background:color-mix(in oklch,var(--positive) 10%,transparent);}
.edge-badge.warning {color:var(--warning);border-color:color-mix(in oklch,var(--warning) 35%,transparent);background:color-mix(in oklch,var(--warning) 10%,transparent);}
.edge-badge.negative {color:var(--negative);border-color:color-mix(in oklch,var(--negative) 35%,transparent);background:color-mix(in oklch,var(--negative) 10%,transparent);}
.edge-tags {display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px;}
.edge-block .section-title {margin-bottom:6px;}
.edge-choices {display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.edge-choices .btn {white-space:normal;text-align:left;min-height:38px;line-height:1.3;padding:7px 14px;}
.edge-choice-panel>p,.edge-choice-panel>.edge-md {margin:0;}
.edge-callout {border:1px solid var(--border);border-left:3px solid var(--warning);background:color-mix(in oklch,var(--warning) 6%,var(--card));border-radius:var(--radius);padding:14px 16px;margin:4px 0 18px;}
.edge-callout-head {display:flex;align-items:center;gap:8px;color:var(--text);}
.edge-callout-head .icon {color:var(--warning);}
.edge-callout p {margin:6px 0 0;color:var(--text-2);line-height:1.5;}
.edge-callout>small {display:block;margin-top:10px;}
.edge-plan {border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:18px;margin:6px 0 18px;display:flex;flex-direction:column;gap:14px;}
.edge-plan-head {display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.edge-plan-objective {margin:0;font-size:1.02rem;font-weight:600;line-height:1.45;color:var(--text);}
.edge-plan-question {margin:0;color:var(--text-2);line-height:1.5;}
.edge-facts {display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;margin:0;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;}
.edge-facts>div {background:var(--card);padding:9px 12px;min-width:0;}
.edge-facts dt {font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:3px;}
.edge-facts dd {margin:0;color:var(--text);line-height:1.45;overflow-wrap:anywhere;}
.edge-facts dd small {display:block;color:var(--muted-foreground);font-size:.75rem;margin-top:2px;}
.edge-plan-summary {grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.edge-plan-item {border-top:1px solid var(--border);padding-top:14px;display:flex;flex-direction:column;gap:10px;}
.edge-plan-item-head {display:flex;align-items:baseline;gap:10px;}
.edge-plan-item-head strong {line-height:1.45;}
.edge-step {flex:none;font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);border:1px solid var(--border);border-radius:999px;padding:1px 8px;}
.edge-plan .edge-choice-panel {border-top:1px solid var(--border);padding-top:14px;}
.edge-plan-notes {display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 20px;border-top:1px solid var(--border);padding-top:14px;font-size:.88rem;color:var(--text-2);}
.edge-plan-notes .edge-list {margin:4px 0 0;}
.edge-plan .edge-choice-panel>p {color:var(--text-2);line-height:1.5;}
.edge-more,.edge-technical {font-size:.85rem;color:var(--text-2);}
.edge-more>summary,.edge-technical>summary {cursor:pointer;color:var(--muted-foreground);font-size:.78rem;font-weight:500;width:max-content;max-width:100%;}
.edge-more>summary:hover,.edge-technical>summary:hover {color:var(--text);}
.edge-more[open]>summary,.edge-technical[open]>summary {margin-bottom:8px;}
.edge-technical pre {white-space:pre-wrap;overflow-wrap:anywhere;font:.75rem/1.45 Inter,"Segoe UI",sans-serif;background:var(--secondary);border-radius:var(--radius-sm);padding:10px;max-height:320px;overflow:auto;margin:0;}
.edge-data-rows {margin:0;display:flex;flex-direction:column;gap:6px;}
.edge-data-row {display:grid;grid-template-columns:minmax(110px,34%) 1fr;gap:10px;}
.edge-data-row dt {color:var(--muted-foreground);font-size:.8rem;}
.edge-data-row dd {margin:0;color:var(--text);overflow-wrap:anywhere;min-width:0;}
.edge-data-row dd .edge-list {margin:0;}
.edge-data-cards {display:flex;flex-direction:column;gap:8px;}
.edge-data-card {border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;}
.edge-text {white-space:pre-wrap;}
.edge-finding {border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:10px;display:flex;flex-direction:column;gap:12px;background:var(--card);}
.edge-finding-head {display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.edge-finding-head strong {line-height:1.45;}
.edge-finding-part {display:flex;flex-direction:column;gap:3px;}
.edge-finding-part .edge-md p:last-child {margin-bottom:0;}
.edge-metrics {display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;}
.edge-metrics>div {background:var(--secondary);border-radius:var(--radius-sm);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;}
.edge-metrics span {font-size:.72rem;color:var(--muted-foreground);}
.edge-metrics strong {font-variant-numeric:tabular-nums;overflow-wrap:anywhere;}
.edge-source {border-top:1px solid var(--border-soft);padding:10px 0;display:flex;flex-direction:column;gap:8px;}
.edge-source:first-of-type {border-top:0;}
.edge-source-head {display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.edge-source-head code {font:.8rem Inter,"Segoe UI",sans-serif;overflow-wrap:anywhere;}
/* EXEC-IMPL-1016 Fase 4.1 (EDGE-CTX B): a released table's address, its export request, and the folded figure references */
.edge-source-ref {align-self:flex-start;font:.72rem Inter,"Segoe UI",sans-serif;color:var(--muted-foreground);}
.edge-source-action {align-self:flex-start;padding:6px 10px;border:1px solid var(--border);border-radius:7px;background:var(--secondary);color:var(--foreground);font:500 .78rem Inter,"Segoe UI",sans-serif;cursor:pointer;}
.edge-source-action:hover {background:var(--accent,var(--secondary));}
/* EXEC-IMPL-1017 Fase 3: what was attached to a question, and an attached figure recomputed exactly */
.edge-attached-line,.edge-reproduced {display:flex;align-items:center;gap:6px;margin:4px 0 8px;color:var(--muted-foreground);font-size:.8rem;}
.edge-reproduced {color:var(--positive, #1f9d55);}
/* EXEC-IMPL-1017 Fase 3: the menu on selected text (right click) and its floating form on a touch screen */
.edge-selection-menu {position:fixed;z-index:300;display:flex;flex-direction:column;min-width:220px;padding:4px;border:1px solid var(--border);border-radius:10px;background:var(--card);box-shadow:0 8px 24px #0000002b;font:500 13px Inter,"Segoe UI",sans-serif;}
.edge-selection-menu button {all:unset;box-sizing:border-box;padding:8px 12px;border-radius:7px;color:var(--foreground);cursor:pointer;white-space:nowrap;}
.edge-selection-menu button:hover,.edge-selection-menu button:focus-visible {background:var(--secondary);}
.edge-selection-menu.floating {flex-direction:row;min-width:0;border-radius:999px;}
.edge-selection-menu.floating button {padding:8px 14px;border-radius:999px;}
/* EXEC-IMPL-1016 Fase 4.2 (EDGE-CTX A): rows of a built answer table picked and attached to the next question */
.edge-row-pickable {cursor:pointer;}
.edge-row-picked td {background:color-mix(in srgb, var(--primary, #4f7cff) 16%, transparent);}
.edge-table-attach {display:flex;align-items:center;gap:8px;margin:0 0 6px;}
.edge-table-attach-button {padding:4px 9px;border:1px solid var(--border);border-radius:7px;background:var(--secondary);color:var(--foreground);font:500 .76rem Inter,"Segoe UI",sans-serif;cursor:pointer;}
.edge-table-attach small {font-size:.72rem;color:var(--muted-foreground);}
/* EXEC-UI-1025: an attachment as a quote with its note (benchmark: ChatGPT/Claude quote in the message box); no side
   accent bar (user 2026-10-24: "Buat tanpa side bar accent") */
.composer .edge-attached-chip {display:flex;flex-direction:column;gap:2px;margin:0 0 8px;padding:7px 8px 6px 11px;border-radius:8px;background:var(--muted);}
.edge-attached-quote {display:flex;align-items:flex-start;gap:8px;}
.edge-attached-text {flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted-foreground);font-size:.8rem;line-height:1.45;font-style:italic;}
.edge-attached-meta {flex:none;color:var(--muted-foreground);font-size:.7rem;line-height:1.7;white-space:nowrap;}
.composer .edge-attached-remove {flex:none;display:grid;place-items:center;width:20px;height:20px;margin:-1px -2px 0 0;border:0;border-radius:6px;background:none;color:var(--muted-foreground);cursor:pointer;}
.composer .edge-attached-remove:hover {background:var(--accent);color:var(--foreground);}
.composer textarea.edge-attached-comment {display:block;width:100%;min-height:0;max-height:96px;margin:0;padding:2px 0;border:0;outline:none;box-shadow:none;background:transparent;color:var(--foreground);font:inherit;font-size:.85rem;line-height:1.45;resize:none;overflow-y:auto;}
.composer textarea.edge-attached-comment::placeholder {color:var(--muted-foreground);opacity:.8;}
/* EXEC-UI-1024 2a: the passages attached to the question, marked in their answer (CSS Custom Highlight; no DOM change) */
::highlight(edge-attached) {background-color:rgb(250 204 21 / .45);color:inherit;}
/* EXEC-ASK-BRANCH: the divider before a branch's own questions, the side chat panel (above the top bar 120 and the
   phone's menu buttons 125, below dialogs 200) and its frame's compact view */
.edge-branch-divider {display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--muted-foreground);font-size:.75rem;}
.edge-branch-divider:before,.edge-branch-divider:after {content:"";flex:1;border-top:1px dashed var(--border);}
.edge-branch-divider button {display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:2px 4px;}
.edge-branch-divider button:hover {color:var(--foreground);text-decoration:underline;}
.research-exchange.inherited {opacity:.92;}
.edge-side-empty {margin:6px 0 0;text-align:center;color:var(--muted-foreground);font-size:.8rem;}
.edge-side-chat {position:fixed;top:56px;right:0;bottom:0;width:min(460px,42vw);z-index:130;display:flex;flex-direction:column;background:var(--background);border-left:1px solid var(--border);box-shadow:-12px 0 28px -18px rgb(0 0 0 / .45);}
.edge-side-head {display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border);font-size:.85rem;}
.edge-side-frame {flex:1;width:100%;border:0;background:var(--background);}
@media (max-width:720px) {.edge-side-chat {top:0;width:100%;border-left:0;}}
.edge-side-view .topbar,.edge-side-view .conversation-panel,.edge-side-view .details-panel,.edge-side-view .workspace-tools,.edge-side-view .edge-panel-backdrop {display:none !important;}
.edge-side-view .monitor-layout {grid-template-columns:minmax(0,1fr) !important;}
.edge-side-view .monitor-layout .composer {margin-left:10px;margin-right:10px;}

/* EXEC-IMPL-1016 Fase 4.3 (UI-1015B): the steps of a running answer */
.edge-run-progress {margin:6px 0 0 30px;display:flex;flex-direction:column;gap:4px;font:.8rem Inter,"Segoe UI",sans-serif;color:var(--muted-foreground);}
.edge-run-progress-now {display:flex;gap:8px;align-items:baseline;}
.edge-run-progress-time {font-variant-numeric:tabular-nums;color:var(--foreground);}
/* E12: each new second fades in briefly (two identical animations, so the change of name restarts it) */
.edge-run-clock {display:inline-block;}
.edge-run-clock.odd {animation:edge-tick-odd .2s ease-out;}
.edge-run-clock.even {animation:edge-tick-even .2s ease-out;}
@keyframes edge-tick-odd {from {opacity:.45;transform:translateY(-2px);} to {opacity:1;transform:none;}}
@keyframes edge-tick-even {from {opacity:.45;transform:translateY(-2px);} to {opacity:1;transform:none;}}
@media (prefers-reduced-motion: reduce) {.edge-run-clock.odd, .edge-run-clock.even {animation:none;}}
.edge-run-progress-done > summary {cursor:pointer;}
.edge-run-progress-done ol {margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:2px;}
.edge-run-progress-done li {display:flex;gap:6px;align-items:baseline;}
.edge-run-progress-done em {font-style:normal;color:var(--warning,var(--muted-foreground));}
.edge-run-progress-done small {margin-left:auto;font-variant-numeric:tabular-nums;}
.edge-source-folded > summary {cursor:pointer;font:600 .8rem Inter,"Segoe UI",sans-serif;color:var(--muted-foreground);padding:4px 0;}
.sources .edge-data-row {grid-template-columns:minmax(80px,38%) 1fr;font-size:.82rem;}
.edge-pin-body .edge-md {font-size:.85rem;}
@media (max-width:640px) {
  .edge-plan,.edge-finding {padding:14px;}
  .edge-facts {grid-template-columns:1fr;}
  .edge-data-row {grid-template-columns:1fr;gap:2px;}
  .edge-choices .btn {flex:1 1 100%;justify-content:flex-start;}
  .edge-finding-head,.edge-plan-item-head {flex-direction:column;gap:6px;}
}

/* Requested emphasis: cost, fact labels, experiment index, neutral status. */
.monitor-layout .edge-cost-badge{display:inline-flex;align-items:center;padding:4px 9px;border-radius:4px;background:#252b34;color:#f8fafc;font-size:11px;font-weight:600;line-height:1.5;white-space:nowrap;font-variant-numeric:tabular-nums;}
html.dark .monitor-layout .edge-cost-badge{background:#303945;color:#f8fafc;}
.monitor-layout .edge-facts dt.edge-fact-label,.monitor-layout .edge-plan-notes>div>.edge-eyebrow{display:inline-flex;align-items:center;width:fit-content;padding:3px 7px;margin-bottom:7px;background:var(--secondary);color:var(--text);border-radius:3px;border:1px solid var(--border);font-size:11px;line-height:1.4;font-weight:600;letter-spacing:0;text-transform:none;}
.monitor-layout .edge-plan-item-head .edge-step{border:0;background:#252b34;color:#f8fafc;padding:5px 9px;border-radius:3px;font-size:11px;font-weight:700;line-height:1.4;letter-spacing:0;text-transform:none;white-space:nowrap;}
html.dark .monitor-layout .edge-plan-item-head .edge-step{background:#303945;color:#f8fafc;}
.monitor-layout .edge-badge,.monitor-layout .edge-badge:is(.positive,.warning,.negative){border:0;border-radius:0;padding:0;background:transparent;color:var(--text-2);font-size:12px;line-height:1.5;font-weight:500;white-space:normal;}
.monitor-layout .edge-badge::before{display:none;}
.monitor-layout .edge-finding-head>.edge-badge{flex-shrink:0;border-left:0;padding-left:12px;max-width:40%;text-align:right;}
.monitor-layout .edge-tags{margin:4px 0 16px;}
.monitor-layout .edge-tags>.edge-badge{font-size:12px;color:var(--muted-foreground);}
.monitor-layout .edge-callout.pause{border:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);border-radius:0;background:transparent;box-shadow:none;padding:18px 0;margin:24px 0;}
.monitor-layout .edge-callout.pause .edge-callout-head>.icon{display:none;}
.monitor-layout .edge-callout.pause .edge-callout-head{font-size:14px;font-weight:600;}
.monitor-layout .edge-callout.pause .edge-choices .btn{border-radius:4px;box-shadow:none;}
.monitor-layout .edge-callout.pause .edge-choices .btn.primary{background:#252b34;color:#f8fafc;}
@media(max-width:640px){.monitor-layout .edge-finding-head>.edge-badge{padding-left:0;max-width:100%;text-align:left;}}

/* Align metadata and emphasize every label within the plan's fact boxes. */
.monitor-layout .result-metadata{align-items:center;gap:6px 14px;line-height:1.5;}
.monitor-layout .result-metadata>span{display:inline-flex;align-items:center;min-height:26px;}
.monitor-layout .result-metadata>.edge-cost{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}
.monitor-layout .edge-cost-label{font-size:inherit;font-weight:400;color:var(--muted-foreground);}
.monitor-layout .edge-cost-badge{padding:3px 8px;line-height:1.5;border-radius:999px;background:var(--muted-foreground);color:var(--background);font-weight:500;font-size:11px;}
html.dark .monitor-layout .edge-cost-badge{background:var(--secondary);color:var(--foreground);}
.monitor-layout .edge-facts dt,.monitor-layout .edge-facts dt.edge-fact-label{display:inline-flex;align-items:center;width:fit-content;min-height:26px;padding:3px 7px;margin-bottom:7px;background:var(--secondary);color:var(--text);border-radius:3px;border:1px solid var(--border);font-size:11px;line-height:1.4;font-weight:600;letter-spacing:0;text-transform:none;}

/* Header actions and subordinate lifecycle typography. */
.monitor-layout .conversation-bookmark-anchor{display:inline-flex;align-items:center;gap:8px;}
.monitor-layout .flow-step .edge-flow-title{font-family:Inter,"Segoe UI",sans-serif;font-size:12px;font-weight:700;line-height:19.5px;letter-spacing:0;}
.monitor-layout .flow-step small{font-family:Inter,"Segoe UI",sans-serif;font-size:11px;font-weight:400;line-height:18px;}

/* Conversation filter: approved option 03, Compact pill. Keep the tray footprint. */
.monitor-layout .conversation-panel .mini-tabs{border-radius:22px;background:#eceef2;gap:4px;}
.monitor-layout .conversation-panel .mini-tabs button{border-radius:22px;color:#6b7280;font-weight:500;}
.monitor-layout .conversation-panel .mini-tabs button:hover{background:#e5e8ee;color:#171b23;}
.monitor-layout .conversation-panel .mini-tabs button.active{background:#fff;color:#171b23;box-shadow:0 2px 7px #18223018,0 1px 2px #1822300d;}
.monitor-layout .conversation-panel .mini-tabs button.active::after{display:none;}
html.dark .monitor-layout .conversation-panel .mini-tabs{background:#171b22;}
html.dark .monitor-layout .conversation-panel .mini-tabs button{color:#a1a8b4;}
html.dark .monitor-layout .conversation-panel .mini-tabs button:hover{background:#303742;color:#edf0f4;}
html.dark .monitor-layout .conversation-panel .mini-tabs button.active{background:#20242b;color:#edf0f4;box-shadow:0 3px 10px #0005,0 1px 3px #0003;}

/* Header settings icon and compact account menu. */
.top-actions>.icon-btn[aria-label="Settings"]>.icon{display:block;margin:0;width:16px;height:16px;}
.top-actions .account-menu{width:220px;padding:8px;border-radius:8px;}
.top-actions .account-menu>.account-summary{padding:8px 10px 12px;margin-bottom:4px;border-bottom:1px solid var(--border);}
.top-actions .account-menu>.account-summary>strong{font-size:12px;font-weight:500;line-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top-actions .account-menu>button.sign-out{display:flex;align-items:center;justify-content:flex-start;min-height:36px;padding:8px 10px;white-space:nowrap;font-size:12px;line-height:18px;border-radius:5px;}

/* Single-action account menu: use the background, without a focus border. */
.top-actions .account-menu>button.sign-out:is(:focus,:focus-visible,:active){outline:none;border:0;box-shadow:none;}

/* Dark response palette: explicit surface/text pairs, scoped to AI replies. */
html.dark .monitor-layout .result{
 --foreground:#f1f4f8;--text:#f1f4f8;--text-2:#d1d7e0;--muted-foreground:#b5becb;
 --card:#252c35;--card-foreground:#f1f4f8;--secondary:#303844;--secondary-foreground:#f1f4f8;
 --accent:#394453;--accent-foreground:#f1f4f8;--border:#46515f;--border-soft:#394453;
 --control-background:#303844;--control-border:#46515f;
 background:#20242b;color:#f1f4f8;
}
html.dark .monitor-layout .result .result-kicker,
html.dark .monitor-layout .result .result-metadata{color:var(--muted-foreground);}
html.dark .monitor-layout .result .data-table{background:#252c35;color:var(--text);border-color:var(--border);}
html.dark .monitor-layout .result .data-table th{background:#303844;color:var(--text-2);}
html.dark .monitor-layout .result .data-table td{color:var(--text);border-color:var(--border);}
html.dark .monitor-layout .result .data-table tbody tr:hover{background:#303844;}
html.dark .monitor-layout .result .edge-choices .btn{background:#303844;color:var(--text);border-color:var(--border);}
html.dark .monitor-layout .result .edge-choices .btn.primary{background:#dbe3ee;color:#1c2530;}
html.dark .monitor-layout .result .edge-choices .btn:not(:disabled):hover{background:#394453;color:#f1f4f8;}
html.dark .monitor-layout .result .edge-choices .btn.primary:not(:disabled):hover{background:#eef2f8;color:#1c2530;}
html.dark .monitor-layout .result .edge-cost-badge{background:#394453;color:#f1f4f8;}

/* Details tabs: approved option 03, Compact pill. */
/* Option 01: compact underline tabs for the Details panel. */
.monitor-layout .details-panel>.tabs{align-self:flex-start;flex:none;width:max-content;max-width:calc(100% - 24px);height:46px;margin:0 12px;padding:0;gap:16px;align-items:center;border:0;background:transparent;}
.monitor-layout .details-panel>.tabs button{position:relative;flex:0 0 auto;min-width:38px;height:32px;min-height:32px;padding:0 3px;border:0;border-radius:3px;background:transparent;color:#626d7c;font-size:12px;font-weight:500;box-shadow:none;transition:background .12s,color .12s;}
.monitor-layout .details-panel>.tabs button::after{content:"";position:absolute;height:2px;bottom:0;left:3px;right:3px;border-radius:2px;background:transparent;}
.monitor-layout .details-panel>.tabs button:hover{background:#e2e7ed;color:#18202b;}
.monitor-layout .details-panel>.tabs button.active{background:transparent;color:#18202b;box-shadow:none;}
.monitor-layout .details-panel>.tabs button.active::after{background:#263447;}
.monitor-layout .details-panel>.tabs button:focus-visible{outline:2px solid #557499;outline-offset:3px;}
html.dark .monitor-layout .details-panel>.tabs button{color:#aab4c2;}
html.dark .monitor-layout .details-panel>.tabs button:hover{background:#323d4c;color:#eef2f7;}
html.dark .monitor-layout .details-panel>.tabs button.active{background:transparent;color:#eef2f7;box-shadow:none;}
html.dark .monitor-layout .details-panel>.tabs button.active::after{background:#d9e2ee;}
html.dark .monitor-layout .details-panel>.tabs button:focus-visible{outline-color:#9dbbe1;}


/* Compact trailing space after the final saved lifecycle step. */
.monitor-layout .edge-flow-accordion .flow-step:last-child{padding-bottom:4px;}

/* Compact Sources sections with one separator and a shared metadata grid. */
.monitor-layout .details-panel .sources>.content-block{padding:12px 0 0;margin:12px 0 0;border-top:1px solid var(--border);}
.monitor-layout .details-panel .sources>.content-block:first-child{padding-top:0;margin-top:0;border-top:0;}
.monitor-layout .details-panel .sources .section-title{min-height:20px;margin:0 0 8px;align-items:flex-start;font-size:12px;font-weight:600;line-height:20px;}
.monitor-layout .details-panel .sources .section-title+.edge-source{border-top:0;padding-top:0;}
.monitor-layout .details-panel .sources .edge-source{padding:8px 0 0;gap:8px;}
.monitor-layout .details-panel .sources .edge-source-head{margin:0;align-items:flex-start;}
.monitor-layout .details-panel .sources .edge-source-head>strong{font-size:12px;font-weight:600;line-height:18px;}
.edge-source-head>:first-child{min-width:0;}
.edge-source-head>.edge-badge,.monitor-layout .edge-source-head>.edge-badge{flex-shrink:0;white-space:nowrap;overflow-wrap:normal;}
.monitor-layout .details-panel .sources .edge-data-rows{gap:6px;}
.monitor-layout .details-panel .sources .edge-data-row{grid-template-columns:minmax(80px,34%) minmax(0,1fr);gap:12px;align-items:start;font-size:11.5px;line-height:18px;}
.monitor-layout .details-panel .sources .edge-data-row>dt,
.monitor-layout .details-panel .sources .edge-data-row>dd{margin:0;padding:0;font-size:inherit;line-height:inherit;}

.monitor-layout .user-message-footer{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:7px 0 19px;min-height:30px;}
.monitor-layout .user-message-footer .user-sent-at{margin:0;}
.monitor-layout .message-clipboard-actions{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap;}
.monitor-layout .clipboard-action{width:30px;height:30px;padding:0;justify-content:center;}
.monitor-layout .clipboard-action.with-label{width:auto;padding:0 10px;gap:6px;}
.monitor-layout .clipboard-action .icon{width:16px;height:16px;}
.monitor-layout .clipboard-status{font-size:10px;color:var(--muted-foreground);max-width:240px;}
.monitor-layout .result-pin-action[aria-pressed="true"] .icon{fill:none;}
@media print{.message-clipboard-actions{display:none!important;}}
/* Mobile only (user 2026-10-08: "hanya berlaku untuk mobile, bukan desktop. jangan ubah desktop"). The composer is one
   compact row like a phone chat app: the text on top, then the mode chip and the attachment button on the left and a
   round send button on the right; controls that cannot be used on a phone yet (the fixed server model, Data Scope) are
   not shown, and "Jump to latest" is hidden. Nothing here applies above 720px. */
/* EXEC-Y Fase 2: follow-up questions and insight ideas read as a list of questions */
.edge-next .edge-choices {flex-direction:column;align-items:stretch;}
.edge-next .edge-choices .btn {justify-content:flex-start;text-align:left;white-space:normal;height:auto;min-height:36px;padding:8px 12px;line-height:1.4;}
.edge-next .edge-choice {flex:0 0 auto;padding:12px 14px;}  /* EXEC-CHOICES: a suggestion is one line in a column */
.edge-next-group {margin-top:6px;}
.edge-next-group>.edge-choices {margin-top:8px;}
.edge-next-group .edge-choice-copy strong {font-weight:400;}  /* EXEC-IMPL-1017 Fase 2: suggestions are not bold */
@media (max-width:720px) {
 /* V4 (user 2026-10-14, red box): the space between the last message (or "AI request running") and the composer */
 .monitor-layout .research-scroll {padding-bottom:8px;}
 .monitor-layout .research-exchange:last-of-type {margin-bottom:0;}
 .monitor-layout .research-exchange:last-of-type .edge-inline-progress {margin-bottom:0;}
 .monitor-layout .jump-latest {display:none!important;}
 .composer {margin:6px 10px calc(8px + env(safe-area-inset-bottom));padding:8px 8px 8px 14px;border-radius:22px;}
 .composer textarea {min-height:24px;max-height:120px;padding:6px 2px 4px;font-size:14px;line-height:1.5;}
 .composer textarea::placeholder {font-size:14px;}
 .composer>div:last-child {gap:8px;margin-top:2px;}
 .composer>div:last-child>div {gap:4px;min-width:0;flex-wrap:nowrap;}
 .composer [title="Data Scope is not available yet"] {display:none;}
 /* user 2026-10-21 (screenshot): the phone shows the model's name and reasoning level beside its logo, as the desktop
    does; a long name is cut with an ellipsis, the level always stays */
 .composer .edge-model-trigger>.icon {display:none;}
 .composer .edge-model-trigger {padding:7px 9px;min-width:0;max-width:100%;overflow:hidden;}
 .composer .edge-model-name {min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
 .composer .edge-model-level {flex:none;white-space:nowrap;}
 /* V5 (user 2026-10-14, iPhone: the menu ran off the top and under the left rail) and EXEC-UI-1015 U5 (user 2026-10-15,
    area "1"): a panel in the empty conversation space right above the composer, as wide as the composer, scrolling inside
    itself, never over the header or under the left rail */
 .composer .edge-model-menu {position:fixed;left:var(--edge-composer-left,10px);width:var(--edge-composer-width,calc(100vw - 20px));right:auto;
   bottom:calc(var(--edge-composer-height,98px) + 14px + env(safe-area-inset-bottom));top:auto;box-sizing:border-box;
   max-height:calc(100dvh - var(--edge-composer-height,98px) - var(--edge-topbar-height,56px) - 28px - env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain;
   border-radius:16px;padding:10px 12px;z-index:260;box-shadow:0 8px 32px #00000033;}
 .composer .edge-model-options {max-height:none;overflow:visible;}
 .composer .mode-anchor>.btn {height:32px;padding:0 10px;border-radius:999px;background:var(--secondary);font-size:13px;}
 .composer>div:last-child>div>.icon-btn {width:32px;height:32px;min-width:32px;border-radius:999px;order:-1;}
 .composer>div:last-child>.btn.primary {width:36px;height:36px;min-width:36px;padding:0;border-radius:999px;justify-content:center;flex:none;}
 .composer>div:last-child>.btn.primary .btn-label {position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
 .composer .mode-menu {position:fixed;left:12px;right:12px;bottom:calc(var(--edge-composer-height,98px) + 16px + env(safe-area-inset-bottom));width:auto;max-width:none;}
}
/* EXEC-UI-1019: border resizing works with mouse, touch and keyboard; keep room for the conversation. */
.monitor-layout .composer {position:relative;left:auto;right:auto;--composer-pad-top:20px;padding-top:var(--composer-pad-top);}
/* EXEC-UI-1024 1B ("middle align"): the running status row starts at the box's top border, whatever the box's top
   padding, so its text has the same room above and below */
.composer > .composer-running {margin-top:calc(-1 * var(--composer-pad-top, 10px));}
.monitor-layout .composer textarea {max-height:min(50dvh,var(--edge-composer-text-max,50dvh));}
.edge-composer-resizer {position:absolute;left:calc(50% - 44px);top:-12px;width:88px;height:32px;z-index:6;cursor:row-resize;touch-action:none;border-radius:8px;outline:none;}
.edge-composer-resizer:after {content:"";position:absolute;left:26px;right:26px;top:11px;height:4px;border-radius:2px;background:var(--border);}
.edge-composer-resizer:is(:hover,:focus-visible,.dragging):after {background:var(--muted-foreground);}
.edge-composer-resizer:focus-visible {box-shadow:0 0 0 2px var(--muted-foreground);}
/* Each header belongs to its own scroll area; opaque backgrounds cover the scrolling rows. */
.edge-pins-head,.edge-history-head {position:sticky;z-index:4;background:var(--background);}
.edge-pins-head {top:0;margin-top:-15px;padding-top:15px;padding-bottom:11px;margin-bottom:0;}
.edge-history-head {top:0;margin-top:-10px;padding-top:15px;}
/* Cover the scroll container's top padding too, so rows cannot peek above the frozen title. */
.edge-pins-head:before,.edge-history-head:before {content:"";position:absolute;left:0;right:0;bottom:100%;height:15px;background:inherit;pointer-events:none;}
/* EXEC-UI-1019B (user 2026-10-19, "Konfirmasi apabila kamu paham"; go 2026-10-20). 1: one gap between every part of an
   answer (it was 29 px between blocks and 6 px between the follow-up lists). 2: a column title longer than 14
   characters wraps at 14ch ("label width >X maka teks di wrapped"; it was 28). 3: tables in the middle of the answer.
   5: the frozen panel titles take the panel's own background, with no empty band above "Pinned responses".
   9: "Monitor" in weight 500 and the full text colour. */
:root {--edge-section-gap:24px;}
.monitor-layout .result>.content-block {margin-top:var(--edge-section-gap);}
.edge-next-group {margin-top:0;}
.edge-next-group+.edge-next-group {margin-top:var(--edge-section-gap);}
.edge-md-table .data-table {margin-inline:auto;}
.edge-md-table .data-table th.edge-title-long .edge-sort-label {white-space:normal;max-width:14ch;}
.details-panel {--edge-panel-bg:var(--background);}
.app:not(.dark) .details-panel {--edge-panel-bg:var(--surface);}
.edge-pins-head,.edge-history-head {background:var(--edge-panel-bg);}
.edge-pins {padding-top:8px;}
.edge-pins-head {margin-top:-8px;padding-top:8px;}
.edge-pins-head:before,.edge-history-head:before {height:8px;}
.topbar nav button.nav-monitor {font-weight:500;color:var(--text);}
/* EXEC-UI-1020C (user 2026-10-20 screenshots; go "Jalankan exec"). GLM/MiMo: a one-colour logo in the run label is drawn
   in the main text colour, as in the model picker, not in the grey metadata colour. */
.result-metadata .edge-run-model .edge-model-logo.mono {color:var(--foreground);}
/* 6: the pinned title is sticky inside a scroll area with an 8 px top padding; top:0 pushed it 8 px down onto the
   first row ("No pinned responses"); it now sticks where it stands */
.edge-pins-head {top:-8px;}
/* 7: the open or hovered response card stands one step above the panel in dark mode too (the dark panel and --card
   are the same colour, so the card disappeared) */
.details-panel {--edge-raised-bg:var(--card);}
.app.dark .details-panel {--edge-raised-bg:oklch(21% 0 0);}
.edge-flow-accordion[open]>summary,.edge-flow-accordion>summary:hover,.edge-pin-card {background:var(--edge-raised-bg);}
.app.dark .edge-flow-accordion[open]>summary,.app.dark .edge-flow-accordion>summary:hover,.app.dark .edge-pin-card {box-shadow:0 0 0 1px oklch(100% 0 0 / 7%),0 2px 9px #00000040;}
/* 8: one thin scrollbar in the Details panel, the conversation list and the model menu, coloured by the theme */
.details-panel *,.conversation-list,.edge-model-options {scrollbar-width:thin;scrollbar-color:color-mix(in oklch,var(--muted-foreground) 45%,transparent) transparent;}
.details-panel ::-webkit-scrollbar,.conversation-list::-webkit-scrollbar,.edge-model-options::-webkit-scrollbar {width:6px;height:6px;}
.details-panel ::-webkit-scrollbar-thumb,.conversation-list::-webkit-scrollbar-thumb,.edge-model-options::-webkit-scrollbar-thumb {background:color-mix(in oklch,var(--muted-foreground) 45%,transparent);border-radius:3px;}
.details-panel ::-webkit-scrollbar-track,.conversation-list::-webkit-scrollbar-track,.edge-model-options::-webkit-scrollbar-track {background:transparent;}
/* EXEC 2026-10-20 (user screenshots 2-5) */
/* the bookmark and delete buttons of a conversation show their hover on every row: plain, hovered or selected */
.conversation .conversation-bookmark:hover:not(:disabled){background:color-mix(in oklch,var(--foreground) 14%,transparent);color:var(--foreground);}
/* "Data Scope" in the type of the model picker beside it */
.composer [title="Data Scope is not available yet"]{font:500 .78rem Inter,"Segoe UI",sans-serif;}
.composer [title="Data Scope is not available yet"] .icon{width:13px;height:13px;}
/* the message box in use: a soft shadow instead of a darker border */
.composer:focus-within,.composer.has-text,.monitor-layout .composer:focus-within,.monitor-layout .composer.has-text{border-color:var(--border);box-shadow:0 6px 20px -6px rgb(0 0 0 / .18),0 2px 6px -2px rgb(0 0 0 / .10);}
html.dark .composer:focus-within,html.dark .composer.has-text{box-shadow:0 6px 22px -6px rgb(0 0 0 / .6),0 2px 6px -2px rgb(0 0 0 / .4);}
/* a running answer's progress sits close under the question */
.monitor-layout .user-message-footer:has(+ .edge-inline-progress-wrap){margin-bottom:6px;}
.monitor-layout .edge-inline-progress-wrap>.edge-inline-progress{min-height:24px;}
/* =====================================================================================================================
   MONITOR-REVAMP (user 2026-10-29, PLAN.md "MONITOR-REVAMP"): the Monitor page and the shared top bar take the look of
   the user's AI_revamp.html (EDGE / Market Lab Design Spec v1): its tokens, light and dark, and its components mapped
   onto this page's own markup. Behaviour stays; the phone layout (max-width 1050px) keeps its own arrangement and takes
   the colours and type. Rules here come last and carry the selectors of the rules they replace.
   ===================================================================================================================== */
/* ---- 1. Design Spec tokens on the app (every tab's top bar and the Monitor page); the older names follow them (the
   second selector outranks the older Monitor light palette, ".app:not(.dark):has(.monitor-layout)") ---- */
.app,.app:not(.dark):has(.monitor-layout){
  --bg:#fafafa;--surface:#ffffff;--surface-2:#f7f7f7;--hover:#f3f3f3;--sel:#efefef;--border:#eaeaea;--border-2:#dcdcdc;
  --text:#171717;--text-2:#666666;--text-3:#8f8f8f;
  --green:#087f5b;--green-bg:rgba(8,153,129,.10);--red:#d62839;--red-bg:rgba(242,54,69,.09);--up:#089981;--down:#f23645;
  --blue:#0070f3;--blue-bg:rgba(0,112,243,.08);--amber:#b45309;--amber-bg:rgba(245,166,35,.14);--navy:#17348c;
  --b-green:var(--green);--b-red:var(--red);--b-amber:#f5b041;--b-blue:#17348c;--b-neutral:var(--text-2);
  --sans:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  --fs-2xs:10.5px;--fs-xs:11px;--fs-sm:11.5px;--fs-12:12px;--fs-md:12.5px;--fs-base:13px;--fs-lg:14px;--fs-xl:15px;
  --t-meta:var(--fs-2xs);--t-ctl:var(--fs-xs);--t-num:var(--fs-sm);--t-body:var(--fs-12);--t-section:var(--fs-md);
  --t-title:var(--fs-base);--t-symbol:var(--fs-lg);--t-stat:var(--fs-xl);--lh-read:1.5;--lh-tight:1.35;
  --s-1:2px;--s-2:4px;--s-3:6px;--s-4:8px;--s-5:10px;--s-6:12px;--s-7:14px;--s-8:16px;--s-9:20px;--s-10:24px;
  --r-xs:4px;--r-sm:6px;--r-md:8px;--r-lg:10px;--r-xl:12px;--r-2xl:14px;--r-pill:999px;
  --h-sm:28px;--h-md:32px;--h-top:52px;--topbar:52px;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 20px -8px rgba(0,0,0,.22);
  --shadow-lg:0 12px 40px -12px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.06);
  --ds-ring:0 0 0 3px var(--blue-bg);
  --background:var(--surface);--foreground:var(--text);--card:var(--surface);--card-foreground:var(--text);
  --popover:var(--surface);--popover-foreground:var(--text);--primary:var(--text);--primary-foreground:var(--surface);
  --secondary:var(--hover);--secondary-foreground:var(--text);--muted:var(--sel);--muted-foreground:var(--text-2);
  --accent:var(--hover);--accent-foreground:var(--text);--input-background:var(--hover);--sidebar:var(--surface);
  --surface-3:var(--sel);--border-soft:var(--border);--accent-strong:var(--text);--accent-soft:var(--hover);
  font-family:var(--sans);color:var(--text);background:var(--bg);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
}
html.dark .app{
  --bg:#0a0a0a;--surface:#111111;--surface-2:#161616;--hover:#1c1c1c;--sel:#232323;--border:#262626;--border-2:#333333;
  --text:#ededed;--text-2:#b4b4b4;--text-3:#7c7c7c;
  --green:#3ecf8e;--green-bg:rgba(62,207,142,.12);--red:#ff6369;--red-bg:rgba(255,99,105,.12);
  --blue:#52a8ff;--blue-bg:rgba(82,168,255,.12);--amber:#f5b041;--amber-bg:rgba(245,176,65,.14);--navy:#7d9bff;
  --b-green:#087f5b;--b-red:#d62839;--b-amber:#f5b041;--b-blue:#17348c;--b-neutral:#4d4d4d;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px -8px rgba(0,0,0,.7);
  --shadow-lg:0 16px 48px -12px rgba(0,0,0,.8),0 0 0 1px #2a2a2a;
}
html .app svg.icon{stroke-width:1.6;}
/* ---- 2. top bar (shared by Monitor, Terminal, Backtest and Screener) ---- */
html .app .topbar{height:var(--h-top);gap:var(--s-6);padding:0 var(--s-8);border-bottom:1px solid var(--border);background:var(--surface);font-size:var(--t-body);line-height:normal;color:var(--text);}
html .app .topbar .brand{gap:10px;letter-spacing:.14em;font-size:var(--t-symbol);font-weight:400;line-height:normal;}
html .app .topbar .brand strong{font-weight:700;}
html .app .topbar .brand-mark{width:32px;height:32px;border-radius:var(--r-sm);background:var(--text);color:var(--surface);font-size:var(--t-symbol);font-weight:600;letter-spacing:0;}
html .app .topbar nav{margin-left:var(--s-4);}
html .app .topbar nav button{height:100%;padding:0 var(--s-6);border-radius:0;font-size:var(--t-title);font-weight:500;line-height:normal;color:var(--text-2);background:transparent;}
html .app .topbar nav button:hover{color:var(--text);background:transparent;}
html .app .topbar nav button.active,html .app .topbar nav button.nav-monitor.active{color:var(--text);font-weight:600;}
html .app .topbar nav button.nav-monitor:not(.active){font-weight:500;color:var(--text-2);}
html .app .topbar nav button.active:after{left:var(--s-6);right:var(--s-6);bottom:-1px;height:2px;background:var(--text);}
html .app .topbar .top-actions{gap:var(--s-6);}
html .app .topbar .top-actions .market-search-inactive{display:flex;align-items:center;gap:var(--s-4);height:36px;width:210px;padding:0 var(--s-6);border:1px solid transparent;border-radius:var(--r-sm);background:var(--hover);color:var(--text-3);font-size:var(--t-section);line-height:normal;}
html .app .topbar .market-search-placeholder{color:var(--text-3);}
html .app .topbar .market-search-inactive kbd{margin-left:auto;padding:1px 5px;border:1px solid var(--border);border-radius:var(--r-xs);background:transparent;color:var(--text-3);font:500 var(--t-ctl)/normal var(--sans);}
html .app .topbar .market-search-inactive:is(.active,:focus-visible){background:var(--surface);color:var(--text);box-shadow:0 3px 13px rgba(23,32,51,.15);}
html .app .topbar .market-search-ribbon{padding:var(--s-4) var(--s-5);border-radius:var(--r-sm);background:var(--text);color:var(--surface);font-weight:500;font-size:var(--t-body);box-shadow:0 5px 20px rgba(23,32,51,.07);}
html .app .topbar .market-search-ribbon:before{background:var(--text);}
html .app .topbar .market-search-ribbon-close{color:var(--surface);opacity:.7;}
html .app .topbar .market-search-ribbon-close:hover{background:color-mix(in srgb,var(--surface) 15%,transparent);color:var(--surface);opacity:1;}
html .app .topbar .top-actions>.icon-btn{width:var(--h-md);height:var(--h-md);padding:0;border:0;border-radius:var(--r-md);background:none;color:var(--text-2);box-shadow:none;}
html .app .topbar .top-actions>.icon-btn:hover:not(:disabled){background:var(--hover);color:var(--text);}
html .app .topbar .top-actions>.icon-btn.selected{background:var(--sel);color:var(--text);}
html .app .topbar .top-actions>.btn.ghost{height:var(--h-md);padding:0 var(--s-6);border:1px solid transparent;border-radius:var(--r-md);background:none;color:var(--text);font-size:var(--t-title);font-weight:500;box-shadow:none;}
html .app .topbar .top-actions>.btn.ghost:hover{background:var(--hover);}
html .app .topbar .avatar{width:30px;height:30px;margin-left:0;border:0;border-radius:50%;background:var(--sel);color:var(--text);font-size:var(--t-ctl);font-weight:600;line-height:normal;}
html .app .topbar .avatar:hover,html .app .topbar .avatar.open{background:var(--hover);color:var(--text);}
html .app .topbar .top-actions>.icon-btn,html .app .topbar .top-actions>.btn.ghost{min-height:0;font-size:var(--t-body);font-weight:400;}
html .app .topbar .top-actions>.btn.ghost{font-size:var(--t-title);font-weight:500;}
/* ---- 3. left panel (AI_revamp.html .nav) ---- */
html .app .monitor-layout .conversation-panel{background:var(--surface);border-right:1px solid var(--border);color:var(--text);font-size:var(--t-body);line-height:normal;}

/* =====================================================================================================================
   M317 (user 2026-10-31, phone screenshots A-E). Look only; the dot's colour comes from Edge.statusTone.
   ===================================================================================================================== */
/* A, D: one colour per run state on every status dot (list and session bar); none is grey. Yellow is the Design Spec's
   badge amber (AI_revamp.html .dot.paused); a conversation without a question is a blue ring */
html .app .conversation-panel .conversation-state.edge-tone-positive,html .app .workspace-tools .edge-tone-positive{background:var(--green);}
html .app .conversation-panel .conversation-state.edge-tone-negative,html .app .workspace-tools .edge-tone-negative{background:var(--red);}
html .app .conversation-panel .conversation-state.edge-tone-warning,html .app .workspace-tools .edge-tone-warning{background:var(--b-amber);}
html .app .conversation-panel .conversation-state.edge-tone-info,html .app .workspace-tools .edge-tone-info{background:var(--blue);}
html .app .conversation-panel .conversation-state.edge-tone-new,html .app .workspace-tools .edge-tone-new{background:transparent;box-shadow:inset 0 0 0 1.5px var(--blue);}
html .app .workspace-tools :is(.live-dot,.pulse){flex:none;width:8px;height:8px;border-radius:50%;}
/* B: the reasoning level reads as its label ("High"), in the message box too; the answer head keeps one 8 px rhythm:
   title to metadata, between wrapped metadata lines and to the evidence line, every metadata item one 20 px line */
html .app .monitor-layout .composer .edge-model-trigger .edge-model-level{text-transform:none;}
html .app .monitor-layout .result>.result-metadata{row-gap:var(--s-4);margin-top:var(--s-4);}
html .app .monitor-layout .result>.result-metadata>span{min-height:20px;line-height:20px;}
html .app .monitor-layout .result>.result-metadata .edge-run-model-level{color:var(--text-3);font-weight:400;white-space:pre;}
html .app .monitor-layout .result .result-metadata .edge-cost-badge{line-height:18px;padding-block:0;}
html .app .monitor-layout .result>.edge-evidence-line{margin-top:var(--s-4);min-height:20px;}
/* C: the suggestion folds and the Assumptions/Limitations/Methodology folds read as one list: the same 12 px between
   every folded title */
html .app .monitor-layout .result>.content-block.edge-next.edge-discs+.content-block.edge-discs{margin-top:var(--s-6);}
/* E: a folded list's bullets sit under the fold's triangle and its text under the fold's title, inside the card */
html .app .monitor-layout .result .edge-discs>details.edge-notes>ul.edge-list{padding-left:12px;list-style-position:outside;}
html .app .monitor-layout .result .edge-discs>details.edge-notes>ul.edge-list>li{padding-left:0;}
@media (max-width:720px){
  /* C: on a phone the action row wraps, so every button keeps the same gap (Branch is not pushed to the right) */
  html .app .monitor-layout .result-actions .edge-branch-action{margin-left:0;}
  /* D: one session row: Details, bookmark and share on the left, the run's state on the right; the words "Research
     session" are left out for the room */
  html .app .monitor-layout .workspace-tools{flex-wrap:nowrap;gap:8px;}
  html .app .monitor-layout .workspace-tools>div:last-child{order:1;flex:none;flex-wrap:nowrap;}
  html .app .monitor-layout .workspace-tools>div:first-child{order:2;flex:0 1 auto;min-width:0;margin-left:auto;flex-wrap:nowrap;gap:6px;}
  html .app .monitor-layout .workspace-tools .edge-session-label{display:none;}
  /* before the first question the row shows no state (no "Draft", user 2026-10-31) */
  html .app .monitor-layout .workspace-tools .live-dot.edge-tone-new{display:none;}
  html .app .monitor-layout .workspace-tools>div:first-child .pill{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
}
/* user 2026-10-31 ("response history hurufnya boleh dirapihkan lagi"): Response history and Pinned responses share one
   type: the title 12 px medium in two lines of 17 px, then a 4 px gap and the status line 10.5 px in the quiet colour;
   the mark sits on the title's first line */
html .app .monitor-layout .details-panel .edge-flow-accordion>summary{align-items:start;}
html .app .monitor-layout .details-panel .edge-flow-accordion>summary strong,html .app .monitor-layout .details-panel .edge-pin-title{font-size:var(--t-body);font-weight:500;line-height:17px;color:var(--text);letter-spacing:0;}
html .app .monitor-layout .details-panel .edge-flow-accordion>summary small{margin-top:var(--s-2);font-size:var(--t-meta);font-weight:400;line-height:14px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
html .app .monitor-layout .details-panel .edge-flow-accordion>summary>:is(.edge-okmark,.edge-history-dot){margin-top:-1px;}
html .app .monitor-layout .details-panel .edge-flow-accordion>summary>.edge-history-dot{margin:5px 6px 0;}
html .app .monitor-layout .details-panel .edge-history-dot.warning{background:var(--b-amber);}
html .app .monitor-layout .details-panel .edge-history-dot.positive{background:var(--green);}
html .app .monitor-layout .details-panel .edge-history-dot.new{background:transparent;box-shadow:inset 0 0 0 1.5px var(--blue);}
html .app .monitor-layout .details-panel .edge-flow-accordion>summary>.edge-disclosure-chevron{margin-top:2px;}
/* =====================================================================================================================
   EXEC-TABLE-CLAUDE (user 2026-10-31: "untuk table saat ini masih acak-acakan ... dirapikan pakai standar kamu aja ...
   untuk alignment dan lain sebagainya kita duplikat saja pakai contoh dari Claude"). An answer table reads like a
   Claude table: no frame and no grey header band; a semibold header in the cells' size over one stronger line; rows
   apart by a hairline; each title takes its column's alignment (numbers right, text left), so a title's edge is the
   numbers' edge; the sort arrow takes no width (beside the title, faint until hovered or sorted); the table's left
   and right edges are the answer text's. Sorting, folding, download and enlarge stay as they were.
   ===================================================================================================================== */
html .app .monitor-layout .result .edge-md-table-frame>.edge-md-table{border:0;border-radius:0;background:transparent;}
html .app .monitor-layout .result .edge-md-table .data-table,html .app .monitor-layout .result .edge-md-table .data-table td{background:transparent;}
html .app .monitor-layout .result .edge-md-table .data-table th,html.dark .app .monitor-layout .result .edge-md-table .data-table th:first-child{height:auto;background:var(--surface);border-bottom:1px solid var(--border-2);font-size:12.04px;font-weight:600;color:var(--text);vertical-align:middle;}
html .app .monitor-layout .result .edge-md-table .data-table th .edge-sort{min-height:0;padding:8px 12px;line-height:19.5px;text-align:left;}
html .app .monitor-layout .result .edge-md-table .data-table th.num .edge-sort{text-align:right;}
html .app .monitor-layout .result .edge-md-table .data-table :is(th,td):first-child,html .app .monitor-layout .result .edge-md-table .data-table th:first-child .edge-sort{padding-left:0;}
html .app .monitor-layout .result .edge-md-table .data-table :is(th,td):last-child,html .app .monitor-layout .result .edge-md-table .data-table th:last-child .edge-sort{padding-right:0;}
html .app .monitor-layout .result .edge-md-table .data-table th:first-child,html .app .monitor-layout .result .edge-md-table .data-table td:first-child{padding-left:0;}
html .app .monitor-layout .result .edge-md-table .data-table th .edge-sort-label{position:relative;display:inline-block;text-align:inherit;}
/* a long title wraps at 14 characters (EXEC-UI-1019B) and its column never squeezes it narrower; a phone scrolls sideways */
html .app .monitor-layout .result .edge-md-table .data-table th.edge-title-long .edge-sort-label{width:max-content;max-width:14ch;}
html .app .monitor-layout .result .edge-md-table .data-table th .edge-sort-icon{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:3px;opacity:.5;}
html .app .monitor-layout .result .edge-md-table .data-table th.num .edge-sort-icon{left:auto;right:100%;margin:0 3px 0 0;}
html .app .monitor-layout .result .edge-md-table .data-table :is(th.sorted,th:hover,th:focus-within) .edge-sort-icon{opacity:1;}
/* user 2026-10-31 ("Sembunyikan panah di judul panjang"): a wrapped number title's arrow would stand apart from its
   text, so it shows only on hover, focus or when that column is sorted */
html .app .monitor-layout .result .edge-md-table .data-table th.num.edge-title-long:not(.sorted):not(:hover):not(:focus-within) .edge-sort-icon{opacity:0;}
html .app .monitor-layout .result .edge-md-table .data-table td{border-bottom:1px solid var(--border);vertical-align:top;}
html .app .monitor-layout .result .edge-md-table .data-table tbody tr:last-child td{border-bottom:1px solid var(--border);}
html .app .monitor-layout .result .edge-md-table .data-table tbody tr:hover td,html.dark .app .monitor-layout .result .edge-md-table .data-table tbody tr:hover td{background:transparent;}
html.dark .app .monitor-layout .result .edge-md-table .data-table td:first-child{background:var(--surface);}
@media (max-width:720px){
  html .app .monitor-layout .result .edge-md-table .data-table td,html .app .monitor-layout .result .edge-md-table .data-table th .edge-sort{padding-block:6px;}
  /* the sticky first column (EXEC-UI-1015D) keeps the card's colour under the columns that scroll past it */
  html .app .monitor-layout .result .edge-md-table .data-table :is(th,td):first-child{background:var(--surface);}
}
/* TABLE-ALIGN-A (user 2026-10-31: "ambil kode atau logic bagaimana table sebelumnya di display"; chose the alignment of
   the table before MONITOR-REVAMP with the EXEC-TABLE-CLAUDE look): E13 again (user 2026-10-16, "Nama kolom rata kiri
   dan center, isi juga rata kiri") - every title and cell left-aligned and vertically centred, numbers included (still
   tabular figures, on one line); the sort arrow follows every title on its right (below: inside the title's width) */
html .app .monitor-layout .result .edge-md-table .data-table :is(th,td,.num){text-align:left;vertical-align:middle;}
html .app .monitor-layout .result .edge-md-table .data-table th:is(.num,:not(.num)) .edge-sort{text-align:left;}
/* user 2026-10-31 ("jarak antara kolom ke kolom tidak even sama seperti sebelumnya"; chose "Selebar isi, rata kiri"):
   as before MONITOR-REVAMP, a table is as wide as its content (each column its widest title or value plus the same
   padding), not stretched over the card, so every gap between columns is the same; a table wider than the card still
   wraps its text columns and scrolls sideways on a phone. "tambah border": one line above the titles, as strong as the
   one under them */
html .app .monitor-layout .result .edge-md-table .data-table{width:auto;}
html .app .monitor-layout .result .edge-md-table .data-table thead th{border-top:1px solid var(--border-2);}
/* the arrow sits after the title inside its width (it no longer reaches into the next column's gap), so a column is
   its widest title-with-arrow or value plus the same padding */
html .app .monitor-layout .result .edge-md-table .data-table th .edge-sort-label{display:inline-flex;align-items:center;vertical-align:middle;}
html .app .monitor-layout .result .edge-md-table .data-table th .edge-sort-icon{position:static;transform:none;flex:none;margin:0 0 0 3px;}
/* user 2026-10-31 (screenshot, "garis pembatas ... dihilangkan"): the conversation no longer ends in a hard edge above
   the message box; its last pixels fade into the page, inside the space below the last answer, so an answer read to
   its end is never faded */
html .app .monitor-layout .research-scroll{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 24px),transparent);}
@media (max-width:720px){html .app .monitor-layout .research-scroll{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 8px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 8px),transparent);}}
/* EXEC-MU-ACCOUNTS Phase 1: the account pages (AuthPage modes) keep the sign-in page's look */
.auth-note {margin:0;padding:9px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--muted-foreground);font-size:.875rem;line-height:1.5;}
.auth-countdown {margin:-6px 0 0;color:var(--muted-foreground);font-size:.8125rem;text-align:center;font-variant-numeric:tabular-nums;}
.auth-row-end {display:flex;justify-content:flex-end;margin-top:-8px;}

.auth-field>small {color:var(--muted-foreground);font-size:.75rem;text-align:center;}

.auth-qr {width:184px;height:184px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;shape-rendering:crispEdges;}
.auth-qr-wait {display:block;background:var(--secondary);}

.auth-codes p {margin:4px 0 8px;color:var(--muted-foreground);}
.auth-codes ol {margin:0 0 10px;padding-left:22px;columns:2;font-variant-numeric:tabular-nums;}
.auth-check {display:flex;align-items:center;gap:8px;}
.text-link:disabled {opacity:.5;cursor:default;text-decoration:none;}
@media (max-width:420px){.auth-pair{grid-template-columns:1fr;}}
