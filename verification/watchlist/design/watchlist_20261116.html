<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDGE — Watchlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   EDGE / Market Lab — Design Spec v1  (sumber: EDGE v6, screener.html)
   ---------------------------------------------------------------------
   Cara pakai
   1. Pasang file ini paling awal (sebelum CSS halaman) + font Inter:
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
      <link rel="stylesheet" href="edge-design-spec.css">
   2. Elemen polos (table, button, input, select, h1–h3, a) langsung
      ikut gaya EDGE lewat layer "edge-base".
   3. Komponen siap pakai: .card .btn .seg .tabs .pill .tog .inp .field
      .tbl .kpi .kv .dialog .note .eyebrow .empty .switch
   4. Mode gelap: <html class="dark"> atau <html data-theme="dark">.
   Urutan layer: edge-base < edge-components < edge-utilities, jadi CSS
   halaman (di luar layer) selalu menang tanpa perlu !important.
   ===================================================================== */

@layer edge-tokens, edge-base, edge-components, edge-utilities;

/* ---------------------------------------------------------------------
   1. TOKENS
   --------------------------------------------------------------------- */
@layer edge-tokens {
:root{
  /* Permukaan */
  --bg:#fafafa;            /* latar halaman */
  --surface:#ffffff;       /* kartu, tabel, input */
  --surface-2:#f7f7f7;     /* hover baris tabel, kbd */
  --hover:#f3f3f3;         /* hover tombol/menu */
  --sel:#efefef;           /* item terpilih (seg, tab, pill netral) */
  --border:#eaeaea;        /* semua garis 1px */
  --border-2:#dcdcdc;      /* garis saat hover */

  /* Teks */
  --text:#171717;          /* utama, angka penting */
  --text-2:#4d4d4d;        /* sekunder, label tombol */
  --text-3:#8f8f8f;        /* keterangan, header tabel */

  /* Semantik pasar (IDX: hijau naik, merah turun) */
  --green:#087f5b;  --green-bg:rgba(8,153,129,.10);   /* teks naik / pill positif */
  --red:#d62839;    --red-bg:rgba(242,54,69,.09);     /* teks turun / pill negatif */
  --up:#089981;     --down:#f23645;                  /* candle, bar, garis chart */
  --blue:#0070f3;   --blue-bg:rgba(0,112,243,.08);    /* fokus, link, nilai Custom */
  --amber:#b45309;  --amber-bg:rgba(245,166,35,.14);  /* peringatan */
  --violet:#7928ca; --navy:#17348c;                  /* aksen chart, broker lokal */

  /* Seri chart (urutan tetap) */
  --c1:#0070f3; --c2:#7928ca; --c3:#f5a623; --c4:#089981; --c5:#e5484d; --c6:#17348c;

  /* Tipografi */
  --sans:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  --fs-2xs:10.5px;  /* label kecil uppercase, badge */
  --fs-xs:11px;     /* pill, catatan kecil */
  --fs-sm:11.5px;   /* label field, note */
  --fs-12:12px;     /* tombol kecil, sel tabel padat */
  --fs-md:12.5px;   /* tabel, seg, menu */
  --fs-base:13px;   /* teks body default */
  --fs-lg:14px;     /* judul kartu */
  --fs-xl:15px;     /* judul dialog */
  --fs-2xl:18px;    /* angka KPI besar */
  --fs-3xl:22px;    /* judul halaman (h1) */
  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700;
  --lh-base:1.5; --lh-tight:1.35;
  --ls-caps:.05em;  /* letter-spacing teks uppercase */
  --ls-title:-.01em;

  /* Jarak (kelipatan 2/4) */
  --s-1:2px; --s-2:4px; --s-3:6px; --s-4:8px; --s-5:10px; --s-6:12px;
  --s-7:14px; --s-8:16px; --s-9:20px; --s-10:24px; --s-11:32px;

  /* Radius */
  --r-xs:4px;   /* kbd, input kecil */
  --r-sm:6px;   /* item menu, tombol di dalam seg, ikon kecil */
  --r-md:8px;   /* tombol, input, seg, search */
  --r-lg:10px;  /* popover, kartu kecil */
  --r-xl:12px;  /* kartu / panel */
  --r-2xl:14px; /* dialog */
  --r-pill:999px;

  /* Ukuran kontrol */
  --h-xs:22px;  /* seg kecil */
  --h-sm:28px;  /* tombol kecil */
  --h-md:32px;  /* tombol, input, select, tab */
  --h-th:36px;  /* header tabel */
  --h-row:44px; /* baris tabel normal (padat: 36px) */
  --h-top:52px; /* top bar */

  /* Bayangan & fokus */
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 20px -8px rgba(0,0,0,.22);          /* hover tombol/kartu */
  --shadow-lg:0 12px 40px -12px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.06);   /* popover, dialog */
  --ring:0 0 0 3px var(--blue-bg);

  /* Lapisan */
  --z-sticky:40; --z-pop:60; --z-modal:80; --z-toast:99;
  color-scheme:light;
}
:root.dark,:root[data-theme="dark"]{
  --bg:#0a0a0a; --surface:#111111; --surface-2:#161616; --hover:#1c1c1c; --sel:#232323;
  --border:#262626; --border-2:#333333;
  --text:#ededed; --text-2:#b4b4b4; --text-3:#7c7c7c;
  --green:#3ecf8e; --green-bg:rgba(62,207,142,.12); --red:#ff6369; --red-bg:rgba(255,99,105,.12);
  --blue:#52a8ff; --blue-bg:rgba(82,168,255,.12); --amber:#f5b041; --amber-bg:rgba(245,176,65,.14);
  --violet:#bf7af0; --navy:#7d9bff;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px -8px rgba(0,0,0,.7);
  --shadow-lg:0 16px 48px -12px rgba(0,0,0,.8),0 0 0 1px #2a2a2a;
  color-scheme:dark;
}
}

/* ---------------------------------------------------------------------
   2. BASE — elemen HTML polos langsung bergaya EDGE
   --------------------------------------------------------------------- */
@layer edge-base {
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:var(--fw-regular) var(--fs-base)/var(--lh-base) var(--sans);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1{margin:0;font-size:var(--fs-3xl);font-weight:var(--fw-semibold);letter-spacing:var(--ls-title);line-height:1.25}
h2{margin:0;font-size:var(--fs-xl);font-weight:var(--fw-semibold);line-height:1.3}
h3{margin:0;font-size:var(--fs-lg);font-weight:var(--fw-semibold);line-height:1.35}
p{margin:0}
small{font-size:var(--fs-sm);color:var(--text-3)}
a{color:var(--blue);font-weight:var(--fw-medium);text-decoration:none}
a:hover{text-decoration:underline}
hr{border:0;border-top:1px solid var(--border);margin:var(--s-6) 0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::selection{background:var(--blue-bg)}

/* tombol polos = tombol sekunder */
button{font:inherit;color:inherit;cursor:pointer;height:var(--h-md);padding:0 var(--s-6);border-radius:var(--r-md);
  border:1px solid var(--border);background:var(--surface);font-weight:var(--fw-medium);
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s-3);white-space:nowrap}
button:hover:not(:disabled){border-color:transparent;box-shadow:var(--shadow)}
button:disabled{cursor:not-allowed;opacity:.45}

/* input polos */
input:where([type="text"],[type="number"],[type="search"],[type="email"],[type="password"],[type="date"],:not([type])),select,textarea{
  font:inherit;color:var(--text);height:var(--h-md);min-width:0;border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--surface);padding:0 var(--s-5);font-size:var(--fs-base);outline:none}
textarea{height:auto;padding:var(--s-4) var(--s-5);resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:var(--ring)}
input[type="checkbox"],input[type="radio"],input[type="range"]{accent-color:var(--text)}
label{font-size:var(--fs-sm);color:var(--text-3);font-weight:var(--fw-medium)}

/* tabel polos */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-md);background:var(--surface)}
th{height:var(--h-th);padding:0 var(--s-5);text-align:right;font-weight:var(--fw-medium);color:var(--text-3);
  border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
td{height:var(--h-row);padding:0 var(--s-5);text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:hover td{background:var(--surface-2)}
caption{caption-side:top;text-align:left;padding:0 0 var(--s-4);font-weight:var(--fw-semibold)}
kbd{font:var(--fw-medium) var(--fs-2xs) var(--sans);border:1px solid var(--border);border-radius:var(--r-xs);padding:1px 5px;color:var(--text-3);background:var(--surface-2)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;background:var(--hover);border-radius:var(--r-xs);padding:1px 4px}
}

/* ---------------------------------------------------------------------
   3. KOMPONEN
   --------------------------------------------------------------------- */
@layer edge-components {
/* Kartu / panel: border 1px, radius 12, tanpa bayangan */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);min-width:0}
.card-h{display:flex;align-items:center;gap:var(--s-4);padding:var(--s-7) var(--s-8) var(--s-5)}
.card-h h3,.card-h strong{font-size:var(--fs-lg);font-weight:var(--fw-semibold)}
.card-b{padding:0 var(--s-8) var(--s-8)}
.card-f{display:flex;gap:var(--s-4);justify-content:flex-end;padding:var(--s-6) var(--s-8);border-top:1px solid var(--border)}

/* Teks pendukung */
.eyebrow{display:block;font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--text-3);text-transform:uppercase;letter-spacing:var(--ls-caps)}
.note{font-size:var(--fs-sm);color:var(--text-3);line-height:var(--lh-tight)}

/* Tombol */
.btn{height:var(--h-md);padding:0 var(--s-6);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text);
  font-weight:var(--fw-medium);font-size:var(--fs-base);display:inline-flex;align-items:center;justify-content:center;gap:var(--s-3);white-space:nowrap}
.btn:hover:not(:disabled){border-color:transparent;box-shadow:var(--shadow)}
.btn.primary{background:var(--text);color:var(--surface);border-color:var(--text)}
.btn.ghost{border-color:transparent;background:none;box-shadow:none}
.btn.ghost:hover:not(:disabled){background:var(--hover);box-shadow:none}
.btn.danger{color:var(--red)}
.btn.sm{height:var(--h-sm);padding:0 9px;font-size:var(--fs-12)}
.btn.block{width:100%}
.iconbtn{width:var(--h-md);height:var(--h-md);padding:0;border:0;background:none;border-radius:var(--r-md);display:inline-grid;place-items:center;color:var(--text-2);box-shadow:none}
.iconbtn.sm{width:26px;height:26px;border-radius:var(--r-sm)}
.iconbtn:hover:not(:disabled){background:var(--hover);color:var(--text);box-shadow:none}

/* Segmented control (pilihan 2–5) */
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--border);border-radius:var(--r-md);padding:2px;gap:2px;background:var(--surface)}
.seg button{height:26px;padding:0 var(--s-5);border:0;border-radius:var(--r-sm);background:none;box-shadow:none;font-size:var(--fs-md);font-weight:var(--fw-medium);color:var(--text-2)}
.seg button:hover{color:var(--text);box-shadow:none}
.seg button.on,.seg button[aria-pressed="true"]{background:var(--sel);color:var(--text)}
.seg.sm button{height:var(--h-xs);padding:0 var(--s-4);font-size:var(--fs-sm)}

/* Tabs (navigasi antar-view) */
.tabs{display:flex;flex-wrap:wrap;gap:2px}
.tabs button{height:var(--h-md);padding:0 var(--s-6);border:0;border-radius:7px;background:none;box-shadow:none;font-weight:var(--fw-medium);color:var(--text-2)}
.tabs button:hover{color:var(--text);background:var(--hover);box-shadow:none}
.tabs button.on,.tabs button[aria-selected="true"]{background:var(--sel);color:var(--text)}

/* Pill (status/angka) dan Tog (chip filter yang bisa diklik) */
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 var(--s-4);border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:var(--fw-semibold);background:var(--sel);color:var(--text-2);white-space:nowrap}
.pill.pos{background:var(--green-bg);color:var(--green)}
.pill.neg{background:var(--red-bg);color:var(--red)}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.pill.info{background:var(--blue-bg);color:var(--blue)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tog{height:26px;padding:0 var(--s-5);border-radius:var(--r-pill);border:1px solid var(--border);background:var(--surface);box-shadow:none;font-size:var(--fs-12);font-weight:var(--fw-medium);color:var(--text-2)}
.tog:hover:not(:disabled){border-color:var(--border-2);box-shadow:none;color:var(--text)}
.tog.on,.tog[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--surface)}

/* Field (label + input) */
.field{display:grid;gap:var(--s-2)}
.field>span,.field>label{font-size:var(--fs-sm);color:var(--text-3);font-weight:var(--fw-medium)}
.field small{font-size:var(--fs-2xs);color:var(--text-3)}
.inp,.sel{height:var(--h-md);width:100%;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);padding:0 var(--s-5);font-size:var(--fs-base);outline:none;min-width:0}
.inp.sm,.sel.sm{height:var(--h-sm);font-size:var(--fs-12);padding:0 var(--s-4)}
.inp:focus,.sel:focus{border-color:var(--blue);box-shadow:var(--ring)}
.inp.custom{border-color:var(--blue);color:var(--blue);font-weight:var(--fw-semibold)}  /* nilai ≠ default */

/* Tabel data */
.tbl-wrap{overflow:auto;border-radius:inherit}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-md)}
.tbl th{position:sticky;top:0;z-index:2;height:var(--h-th);padding:0 var(--s-5);background:var(--surface);font-weight:var(--fw-medium);color:var(--text-3);text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl th.sort{cursor:pointer;user-select:none}
.tbl th.sort:hover{color:var(--text)}
.tbl td{height:var(--h-row);padding:0 var(--s-5);text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl th.l,.tbl td.l,.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl.compact td{height:var(--h-th)}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tbody tr.sel td{background:var(--blue-bg)}
.tbl tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--text)}
.tbl .sym{font-weight:var(--fw-semibold);color:var(--text)}
.tbl .sub{display:block;font-size:var(--fs-xs);color:var(--text-3);max-width:200px;overflow:hidden;text-overflow:ellipsis}
.tbl td.miss{color:var(--text-3);background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 7px)}

/* KPI & baris label–nilai */
.kpi{border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s-4) var(--s-5)}
.kpi span{display:block;font-size:var(--fs-xs);color:var(--text-3)}
.kpi b{font-size:var(--fs-lg);font-weight:var(--fw-semibold)}
.kpi.lg b{font-size:var(--fs-2xl)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-4);padding:var(--s-3) 0;font-size:var(--fs-md);color:var(--text-2);border-bottom:1px solid var(--border)}
.kv:last-child{border-bottom:0}
.kv b{color:var(--text);font-weight:var(--fw-medium)}

/* Popover, dialog, toast */
.pop{position:absolute;z-index:var(--z-pop);min-width:220px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:var(--s-3)}
.menu-item{width:100%;height:auto;white-space:normal;line-height:var(--lh-tight);display:flex;align-items:center;gap:var(--s-4);padding:7px var(--s-4);border:0;border-radius:var(--r-sm);background:none;box-shadow:none;font-size:var(--fs-md);font-weight:var(--fw-regular);text-align:left;justify-content:flex-start}
.menu-item:hover{background:var(--hover);box-shadow:none}
.menu-title{font-size:var(--fs-2xs);font-weight:var(--fw-bold);color:var(--text-3);text-transform:uppercase;letter-spacing:var(--ls-caps);padding:var(--s-3) var(--s-4) var(--s-2)}
.backdrop{position:fixed;inset:0;z-index:var(--z-modal);background:rgba(0,0,0,.32);display:grid;place-items:center;padding:var(--s-9)}
.dialog{width:min(520px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-2xl);box-shadow:var(--shadow-lg)}
.dialog-head{padding:var(--s-8) 18px var(--s-6);border-bottom:1px solid var(--border)}
.dialog-head strong{display:block;font-size:var(--fs-xl);font-weight:var(--fw-semibold)}
.dialog-body{padding:var(--s-8) 18px;overflow:auto;display:grid;gap:var(--s-7)}
.dialog-foot{display:flex;justify-content:flex-end;gap:var(--s-4);padding:var(--s-6) 18px;border-top:1px solid var(--border)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:var(--z-toast);background:var(--text);color:var(--surface);border-radius:var(--r-pill);padding:var(--s-4) var(--s-7);font-size:var(--fs-md);box-shadow:var(--shadow-lg)}

/* Lain-lain */
.switch{position:relative;width:32px;height:18px;padding:0;border:0;border-radius:var(--r-pill);background:var(--border-2);box-shadow:none;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.15s}
.switch.on{background:var(--text)} .switch.on::after{left:16px}
.empty{padding:36px var(--s-9);text-align:center;color:var(--text-3)}
.empty strong{display:block;color:var(--text);font-size:var(--fs-lg);margin-bottom:var(--s-2)}
}

/* ---------------------------------------------------------------------
   4. UTILITAS
   --------------------------------------------------------------------- */
@layer edge-utilities {
.up{color:var(--green)} .down{color:var(--red)} .muted{color:var(--text-3)} .strong{color:var(--text);font-weight:var(--fw-semibold)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.custom-val{color:var(--blue);font-weight:var(--fw-semibold)}  /* parameter yang diubah dari default */
.row{display:flex;align-items:center;gap:var(--s-4)} .stack{display:grid;gap:var(--s-4)} .grow{flex:1;min-width:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
}

</style>
<style>
/* =====================================================================
   EDGE Watchlist — CSS halaman (di luar @layer → selalu menang atas spec)
   Hanya memakai token Design Spec v1 (type A). Tanpa warna hard-coded,
   sehingga <html class="dark"> ikut bekerja.
   ===================================================================== */
html,body{min-height:100%}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:14px;height:14px}
.page{max-width:1680px;margin:0 auto;padding:var(--s-10);min-height:100vh}

/* Header & bar */
.wlh{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s-6);margin-bottom:var(--s-8)}
.wlh p{margin-top:var(--s-2)}
.wlh .act{display:flex;gap:var(--s-4);flex:none}
.bar1{display:flex;align-items:center;gap:var(--s-7);margin-bottom:var(--s-8);border-bottom:1px solid var(--border)}
.bar1>.seg,.bar1>.meta,.bar1>.btn{margin-bottom:var(--s-3)}
/* Tab list: gaya underline (selected = garis 2px --text + badge gelap) */
.bar1 .tabs{gap:var(--s-7);align-self:stretch;align-items:stretch}
.bar1 .tabs button{position:relative;height:40px;padding:0 var(--s-1);border-radius:0;background:none;color:var(--text-2);gap:var(--s-4)}
.bar1 .tabs button:hover{background:none;color:var(--text)}
.bar1 .tabs button.on,.bar1 .tabs button[aria-selected="true"]{background:none;color:var(--text);font-weight:var(--fw-semibold)}
.bar1 .tabs button::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:transparent;transition:background .15s ease}
.bar1 .tabs button[aria-selected="true"]::after{background:var(--text)}
.bar1 .tabs button:focus-visible{outline-offset:-2px}
.cnt{display:inline-flex;align-items:center;height:20px;min-width:20px;padding:0 var(--s-3);justify-content:center;border-radius:var(--r-pill);background:var(--sel);color:var(--text-2);font-size:var(--fs-xs);font-weight:var(--fw-semibold)}
.bar1 .tabs button[aria-selected="true"] .cnt{background:var(--text);color:var(--surface)}
.bar1 .sp{flex:1}

const parseCodes=q=>[...new Set(q.toUpperCase().split(/[\s,;]+/).filter(Boolean))];
const isMulti=q=>/[,;]/.test(q)||parseCodes(q).length>1;
function adMatches(){const q=AD.q.trim().toUpperCase();if(!q)return [];
 if(isMulti(AD.q))return parseCodes(AD.q).filter(c=>U[c]).map(c=>U[c]);
 return UL.filter(u=>u.t.startsWith(q)||u.n.toUpperCase().includes(q)).sort((a,b)=>(b.t.startsWith(q)-a.t.startsWith(q))||a.t.localeCompare(b.t))}
function adState(t){const l=L(AD.target);if(AD.added.has(t)&&l.tickers.includes(t))return 'added';if(l.tickers.includes(t))return 'in';if(l.tickers.length>=MAX_PER_LIST)return 'full';return 'can'}
function renderAdd(){if(!AD)return;const bd=DLG.bd,l=L(AD.target),n=l.tickers.length;
 bd.querySelector('#adSub').textContent=`Ke list ${l.name} · ${n} dari ${MAX_PER_LIST} slot terpakai`;
 bd.querySelector('#adTgt').innerHTML=`${esc(l.name)} <span class="muted">${n}</span>${ic('chev')}`;
 const res=adMatches(),shown=res.slice(0,6),multi=isMulti(AD.q);
 let h='';
 if(!AD.q.trim())h=`<div class="eyebrow pad">Ketik kode atau nama saham · ${UL.length} saham tersedia di prototipe</div>`;
 else{
  h=`<div class="eyebrow pad">Hasil · ${res.length}</div>`;
  if(multi){const unk=parseCodes(AD.q).filter(c=>!U[c]),can=res.filter(u=>adState(u.t)==='can');
   h+=`<div class="ar multi"><div><b>${can.length} kode bisa ditambahkan</b><span class="sub">${unk.length?`Tidak dikenal: ${esc(unk.join(', '))}`:'Semua kode dikenali'}</span></div><div></div>${can.length?`<button class="btn sm primary" data-act="ad-many">${ic('plus')}Tambah ${can.length}</button>`:`<span class="pill">Tidak ada yang baru</span>`}</div>`}
  if(!res.length&&!multi)h+=`<div class="ar"><div><span class="muted">Tidak ada saham yang cocok dengan “${esc(AD.q)}”.</span></div><div></div><div></div></div>`;
  AD.hi=Math.min(AD.hi,Math.max(0,shown.length-1));
  h+=shown.map((u,i)=>{const sx=adState(u.t);return `<div class="ar ${i===AD.hi?'on':''}" data-row="${u.t}"><div><b>${u.t}</b><span class="sub">${esc(u.n)}${u.sec?` · ${u.sec}`:''}</span></div><div class="r"><span>${u.last||'<span class="na">Harga —</span>'}</span><span class="${clD(u.d1)}">${u.last?fD1(u.d1):''}</span></div>${sx==='added'?`<span class="pill pos">✓ Ditambahkan</span>`:sx==='in'?`<span class="pill">✓ Sudah di ${esc(l.name)}</span>`:sx==='full'?`<button class="btn sm" disabled>List penuh</button>`:`<button class="btn sm" data-act="ad-one" data-t="${u.t}">${ic('plus')}Tambah</button>`}</div>`}).join('');
  if(res.length>shown.length)h+=`<div class="note morex">+${res.length-shown.length} lainnya — perjelas pencarian</div>`}
 bd.querySelector('#adRes').innerHTML=h;
 bd.querySelector('#adRecent').innerHTML=RECENT.map(t=>{const sx=adState(t);return `<button class="tog ${sx!=='can'?'done':''}" data-act="ad-one" data-t="${t}" ${sx!=='can'?'disabled':''} title="${esc(U[t].n)}"><b>${t}</b>${sx==='can'?ic('plus'):'✓'}</button>`}).join('')}
function adAdd(t,quiet){const r=OPS.addTicker(AD.target,t);const l=L(AD.target);
 if(r.ok){AD.added.add(t);if(AD.target===st.active){FLASH=t;render()}if(!quiet)toast(`<b>${t}</b> ditambahkan ke ${esc(l.name)} · ${l.tickers.length} saham`)}
 else if(!quiet)toast(r.reason==='dup'?`${t} sudah ada di ${esc(l.name)} — tidak ditambahkan lagi`:r.reason==='full'?`List ${esc(l.name)} penuh (${MAX_PER_LIST} saham)`:esc(r.reason||'Gagal menambah'));
 renderAdd();return r.ok}
function adKey(e){if(!AD||e.target.id!=='adQ')return;const rows=[...DLG.bd.querySelectorAll('.ar[data-row]')];
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!rows.length)return;AD.hi=(AD.hi+(e.key==='ArrowDown'?1:-1)+rows.length)%rows.length;renderAdd()}

  <div class="sel2l">${k.map((x,i)=>{const it=INFO[x],v=indVal(x,ps);return `<div class="si2 ${i>=CARD_IND?'off':''}" data-k="${x}" draggable="true" tabindex="0" aria-label="${esc(it.n)}, urutan ${i+1}. Alt+panah untuk memindah."><svg class="ic ic-sm gr"><use href="#i-grip"/></svg><span class="no">${i+1}</span><div class="nm"><b>${esc(it.n)}</b><small>${it.p?esc(it.p)+' · ':''}${ps?`${ps.t} ${v.v}${v.p!=null?' · P'+v.p:''}`:'belum ada saham dengan data'}</small></div><span class="pill">${it.f.split(' ')[0]}</span><button class="iconbtn sm" data-act="ind-rm" data-k="${x}" aria-label="Hapus ${esc(it.n)}">${ic('x')}</button></div>${i===CARD_IND-1&&n>CARD_IND?`<div class="cut"><span>Kartu menampilkan ${CARD_IND} teratas · Tabel menampilkan semua</span></div>`:''}`}).join('')}</div>
  <div class="slotx">${free?`${ic('plus')}<span>${free} slot tersisa · tambahkan dari daftar di kanan</span>`:`<span>Slot penuh (${MAX_IND}/${MAX_IND}) · hapus satu untuk menambah</span>`}</div>
  <div class="pv"><div class="lbl2"><span>Pratinjau kartu · ${ps?ps.t:'—'}</span></div>${k.slice(0,CARD_IND).map(x=>{const v=indVal(x,ps);return `<div class="mrow"><span class="lab">${INFO[x].c}</span>${bar5(v.p)}<span class="v ${v.k||''}${v.na?' na':''}">${v.v}</span></div>`}).join('')||'<span class="note">Belum ada indikator dipilih.</span>'}</div>`;
 const q=IND.q.trim().toLowerCase();
 bd.querySelector('#indR').innerHTML=CAT.map(([f,a])=>{const items=a.filter(([kk,nn,pp])=>!q||nn.toLowerCase().includes(q)||pp.toLowerCase().includes(q));if(q&&!items.length)return '';const open=q||!IND.closed.has(f);
  return `<div class="fam2"><button class="fh" data-act="ind-fam" data-f="${f}" aria-expanded="${!!open}">${ic(open?'chev':'chevr')}<b>${f}</b><span class="muted">${a.length} tersedia</span></button>${open?items.map(([kk,nn,pp])=>{const on=k.includes(kk);return `<div class="fi ${on?'fon':''}"><span>${esc(nn)} <span class="muted">${esc(pp)}</span>${INFO[kk].has?'':'<span class="pill dim nad" title="Nilai belum tersedia di data prototipe">data —</span>'}</span>${on?`<span class="pill">✓ Dipilih</span>`:`<button class="iconbtn sm add" data-act="ind-add" data-k="${kk}" ${free?'':'disabled'} aria-label="Tambah ${esc(nn)}">${ic('plus')}</button>`}</div>`}).join(''):''}</div>`}).join('')||`<div class="note" style="padding:var(--s-6) 0">Tidak ada indikator cocok dengan “${esc(IND.q)}”.</div>`;
 bd.querySelector('#indNote').textContent=IND.note}
function indKey(e){if(!IND)return;const r=e.target.closest&&e.target.closest('.si2');if(r&&e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();const i=IND.keys.indexOf(r.dataset.k),j=i+(e.key==='ArrowUp'?-1:1);if(j<0||j>=IND.keys.length)return;const a=[...IND.keys];[a[i],a[j]]=[a[j],a[i]];IND.keys=a;IND.note='Urutan diubah · belum disimpan';renderInd();const el=DLG.bd.querySelector(`.si2[data-k="${a[j]}"]`);el&&el.focus()}}
function indSave(){if(!IND.keys.length){IND.note='Pilih minimal 1 indikator.';renderInd();return}const sc=IND.scope,keys=[...IND.keys],nm=L().name;const r=OPS.setInd(sc,keys);if(!r.ok)return;closeDialog();toast(`Indikator disimpan untuk ${sc==='all'?'semua list':'list '+esc(nm)} · ${keys.length} indikator`)}

/* ---------- 11. Event delegation (satu listener per jenis) ---------- */
document.addEventListener('click',e=>{
 if(MENU&&!e.target.closest('.wlmenu')&&!e.target.closest('[data-act="menu"]')&&!e.target.closest('[data-act="ad-target"]')&&!e.target.closest('[data-act="list-menu"]'))closeMenu();
 if(DLG&&e.target===DLG.bd){closeDialog();return}
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,t=b.dataset.t;
 switch(a){
  case 'list':TSORT=null;OPS.setActive(b.dataset.id);break;
  case 'view':OPS.setView(b.dataset.v);break;
  case 'tsort':{const k=b.dataset.k,first=k==='t'?1:-1;TSORT=!TSORT||TSORT.k!==k?{k,dir:first}:TSORT.dir===first?{k,dir:-first}:null;render();const h=PAGE.querySelector(`th[data-k="${k}"]`);h&&h.focus();break}
  case 'tsort-reset':TSORT=null;render();break;
  case 'open-add':openAdd();break;
  case 'open-new':openNew();break;
  case 'open-ind':openInd();break;
  case 'close':closeDialog();break;
  case 'detail':closeMenu();toast(`Halaman detail <b>${t}</b> belum terhubung di prototipe ini.`);break;
  case 'menu':{if(MENU&&MENU._for===b){closeMenu();break}const l=L();openMenu(b,[['detail',`Buka detail ${t} <span class="muted" style="margin-left:auto;font-size:var(--fs-xs);padding-left:var(--s-6)">belum terhubung</span>`,`data-t="${t}"`],['','-'],['remove',`Hapus dari ${esc(l.name)}`,`data-t="${t}" data-danger`]]);break}
  case 'list-menu':{if(MENU&&MENU._for===b){closeMenu();break}const l=L(),last=st.lists.length<=1;openMenu(b,[['del-list',last?`Hapus list ${esc(l.name)} <span class="muted" style="margin-left:auto;padding-left:var(--s-6);font-size:var(--fs-xs)">list terakhir</span>`:`Hapus list ${esc(l.name)}`,`data-id="${l.id}" ${last?'disabled':'data-danger'}`]]);break}
  case 'del-list':closeMenu();openDelList(b.dataset.id);break;
  case 'del-list-go':delListGo(b);break;
  case 'remove':{closeMenu();const lid=st.active,l=L(),el=PAGE.querySelector(`[data-t="${t}"]`);
   const doIt=()=>{const r=OPS.removeTicker(lid,t);if(r.ok)toast(`<b>${t}</b> dihapus dari ${esc(l.name)}`,()=>{const rr=OPS.restoreTicker(lid,t,r.idx);if(rr.ok){if(lid===st.active){FLASH=t;render()}toast(`<b>${t}</b> dikembalikan ke ${esc(l.name)}`)}})};
   if(el&&!reduceMotion()){el.classList.add('leaving');setTimeout(doIt,150)}else doIt();break}
  case 'undo':{const u=TOAST._undo;TOAST._undo=null;TOAST.classList.remove('show');u&&u();break}
  case 'reset-demo':if(confirm('Hapus semua perubahan di browser ini dan kembali ke data awal prototipe?')){try{localStorage.removeItem(KEY)}catch(_){}st=initial();persist();render();toast('Data prototipe dikembalikan ke kondisi awal')}break;
  /* add ticker */
  case 'ad-one':adAdd(t);break;
  case 'ad-many':adMany();break;
  case 'ad-target':{if(MENU&&MENU._for===b){closeMenu();break}openMenu(b,st.lists.map(l=>['ad-pick',`${esc(l.name)} <span class="muted" style="margin-left:auto">${l.tickers.length}</span>${l.id===AD.target?' ✓':''}`,`data-id="${l.id}"`]));break}
  case 'ad-pick':closeMenu();AD.target=b.dataset.id;AD.added.clear();renderAdd();DLG.bd.querySelector('#adQ').focus();break;
  /* new list */
  case 'nl-add':nlAdd(t);break;
  case 'nl-rm':NL.tickers=NL.tickers.filter(x=>x!==t);renderNew();DLG.bd.querySelector('#nlQ').focus();break;
  case 'nl-notify':NL.notify=!NL.notify;renderNew();break;
  case 'nl-custom':NL.custom=!NL.custom;renderNew();break;
  case 'nl-create':nlCreate();break;
  /* indikator */
  case 'ind-scope':IND.scope=b.dataset.v;renderInd();break;
  case 'ind-rm':IND.keys=IND.keys.filter(x=>x!==b.dataset.k);IND.note='Belum disimpan';renderInd();break;
  case 'ind-add':if(IND.keys.length<MAX_IND&&!IND.keys.includes(b.dataset.k)){IND.keys.push(b.dataset.k);IND.note=INFO[b.dataset.k].has?'Belum disimpan':'Ditambahkan · nilainya “—” (data belum tersedia) · belum disimpan';renderInd()}break;
  case 'ind-fam':{const f=b.dataset.f;IND.closed.has(f)?IND.closed.delete(f):IND.closed.add(f);renderInd();break}
  case 'ind-reset':IND.keys=[...DEF];IND.note='Default dipulihkan · belum disimpan';renderInd();break;
  case 'ind-save':indSave();break;
 }});
document.addEventListener('keydown',e=>{
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('th[data-act="tsort"]')&&!DLG){e.preventDefault();e.target.click();return}
 if(e.key==='Escape'){if(MENU){const f=MENU._for;closeMenu();f&&f.focus();e.preventDefault();return}if(DLG){closeDialog();e.preventDefault();return}}
 if(MENU&&(e.key==='ArrowDown'||e.key==='ArrowUp')){const it=[...MENU.querySelectorAll('.menu-item')];const i=it.indexOf(document.activeElement);it[(i+(e.key==='ArrowDown'?1:-1)+it.length)%it.length].focus();e.preventDefault();return}
 if(DLG){if(e.key==='Tab'){const f=[...DLG.bd.querySelectorAll('button:not([disabled]),input,select,[tabindex="0"]')].filter(x=>x.offsetParent);if(!f.length)return;const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}else DLG.onKey&&DLG.onKey(e)}});
window.addEventListener('resize',closeMenu);window.addEventListener('scroll',closeMenu,true);
/* sinkron antar-tab browser */
window.addEventListener('storage',e=>{if(e.key!==KEY)return;const r=load();st=r.st;if(!DLG)render()});

render();
if(LOADED==='invalid')toast('Data tersimpan tidak cocok dengan versi prototipe ini — memakai data awal.');

</script>
