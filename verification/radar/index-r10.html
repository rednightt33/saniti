<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDGE — Radar</title>
<style>
/* =====================================================================
   EDGE / Market Lab — Design Spec v1  (sumber: EDGE v6, screener.html)
   ---------------------------------------------------------------------
   Cara pakai
   1. Pasang file ini paling awal (sebelum CSS halaman) + font Inter:
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
      <link rel="stylesheet" href="edge-design-spec.css">
   2. Elemen polos (table, button, input, select, h1–h3, a) langsung
      ikut gaya EDGE lewat layer "edge-base".
   3. Komponen siap pakai: .card .btn .seg .tabs .pill .tog .inp .field
      .tbl .kpi .kv .dialog .note .eyebrow .empty .switch
   4. Mode gelap: <html class="dark"> atau <html data-theme="dark">.
   Urutan layer: edge-base < edge-components < edge-utilities, jadi CSS
   halaman (di luar layer) selalu menang tanpa perlu !important.
   ===================================================================== */

@layer edge-tokens, edge-base, edge-components, edge-utilities;

/* ---------------------------------------------------------------------
   1. TOKENS
   --------------------------------------------------------------------- */
@layer edge-tokens {
:root{
  /* Permukaan */
  --bg:#fafafa;            /* latar halaman */
  --surface:#ffffff;       /* kartu, tabel, input */
  --surface-2:#f7f7f7;     /* hover baris tabel, kbd */
  --hover:#f3f3f3;         /* hover tombol/menu */
  --sel:#efefef;           /* item terpilih (seg, tab, pill netral) */
  --border:#eaeaea;        /* semua garis 1px */
  --border-2:#dcdcdc;      /* garis saat hover */

  /* Teks */
  --text:#171717;          /* utama, angka penting */
  --text-2:#4d4d4d;        /* sekunder, label tombol */
  --text-3:#8f8f8f;        /* keterangan, header tabel */

  /* Semantik pasar (IDX: hijau naik, merah turun) */
  --green:#087f5b;  --green-bg:rgba(8,153,129,.10);   /* teks naik / pill positif */
  --red:#d62839;    --red-bg:rgba(242,54,69,.09);     /* teks turun / pill negatif */
  --up:#089981;     --down:#f23645;                  /* candle, bar, garis chart */
  --blue:#0070f3;   --blue-bg:rgba(0,112,243,.08);    /* fokus, link, nilai Custom */
  --amber:#b45309;  --amber-bg:rgba(245,166,35,.14);  /* peringatan */
  --violet:#7928ca; --navy:#17348c;                  /* aksen chart, broker lokal */

  /* Seri chart (urutan tetap) */
  --c1:#0070f3; --c2:#7928ca; --c3:#f5a623; --c4:#089981; --c5:#e5484d; --c6:#17348c;

  /* Tipografi */
  --sans:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  --fs-2xs:10.5px;  /* label kecil uppercase, badge */
  --fs-xs:11px;     /* pill, catatan kecil */
  --fs-sm:11.5px;   /* label field, note */
  --fs-12:12px;     /* tombol kecil, sel tabel padat */
  --fs-md:12.5px;   /* tabel, seg, menu */
  --fs-base:13px;   /* teks body default */
  --fs-lg:14px;     /* judul kartu */
  --fs-xl:15px;     /* judul dialog */
  --fs-2xl:18px;    /* angka KPI besar */
  --fs-3xl:22px;    /* judul halaman (h1) */
  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700;
  --lh-base:1.5; --lh-tight:1.35;
  --ls-caps:.05em;  /* letter-spacing teks uppercase */
  --ls-title:-.01em;

  /* Jarak (kelipatan 2/4) */
  --s-1:2px; --s-2:4px; --s-3:6px; --s-4:8px; --s-5:10px; --s-6:12px;
  --s-7:14px; --s-8:16px; --s-9:20px; --s-10:24px; --s-11:32px;

  /* Radius */
  --r-xs:4px;   /* kbd, input kecil */
  --r-sm:6px;   /* item menu, tombol di dalam seg, ikon kecil */
  --r-md:8px;   /* tombol, input, seg, search */
  --r-lg:10px;  /* popover, kartu kecil */
  --r-xl:12px;  /* kartu / panel */
  --r-2xl:14px; /* dialog */
  --r-pill:999px;

  /* Ukuran kontrol */
  --h-xs:22px;  /* seg kecil */
  --h-sm:28px;  /* tombol kecil */
  --h-md:32px;  /* tombol, input, select, tab */
  --h-th:36px;  /* header tabel */
  --h-row:44px; /* baris tabel normal (padat: 36px) */
  --h-top:52px; /* top bar */

  /* Bayangan & fokus */
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 20px -8px rgba(0,0,0,.22);          /* hover tombol/kartu */
  --shadow-lg:0 12px 40px -12px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.06);   /* popover, dialog */
  --ring:0 0 0 3px var(--blue-bg);

  /* Lapisan */
  --z-sticky:40; --z-pop:60; --z-modal:80; --z-toast:99;
  color-scheme:light;
}
:root.dark,:root[data-theme="dark"]{
  --bg:#0a0a0a; --surface:#111111; --surface-2:#161616; --hover:#1c1c1c; --sel:#232323;
  --border:#262626; --border-2:#333333;
  --text:#ededed; --text-2:#b4b4b4; --text-3:#7c7c7c;
  --green:#3ecf8e; --green-bg:rgba(62,207,142,.12); --red:#ff6369; --red-bg:rgba(255,99,105,.12);
  --blue:#52a8ff; --blue-bg:rgba(82,168,255,.12); --amber:#f5b041; --amber-bg:rgba(245,176,65,.14);
  --violet:#bf7af0; --navy:#7d9bff;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px -8px rgba(0,0,0,.7);
  --shadow-lg:0 16px 48px -12px rgba(0,0,0,.8),0 0 0 1px #2a2a2a;
  color-scheme:dark;
}
}

/* ---------------------------------------------------------------------
   2. BASE — elemen HTML polos langsung bergaya EDGE
   --------------------------------------------------------------------- */
@layer edge-base {
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:var(--fw-regular) var(--fs-base)/var(--lh-base) var(--sans);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1{margin:0;font-size:var(--fs-3xl);font-weight:var(--fw-semibold);letter-spacing:var(--ls-title);line-height:1.25}
h2{margin:0;font-size:var(--fs-xl);font-weight:var(--fw-semibold);line-height:1.3}
h3{margin:0;font-size:var(--fs-lg);font-weight:var(--fw-semibold);line-height:1.35}
p{margin:0}
small{font-size:var(--fs-sm);color:var(--text-3)}
a{color:var(--blue);font-weight:var(--fw-medium);text-decoration:none}
a:hover{text-decoration:underline}
hr{border:0;border-top:1px solid var(--border);margin:var(--s-6) 0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::selection{background:var(--blue-bg)}

/* tombol polos = tombol sekunder */
button{font:inherit;color:inherit;cursor:pointer;height:var(--h-md);padding:0 var(--s-6);border-radius:var(--r-md);
  border:1px solid var(--border);background:var(--surface);font-weight:var(--fw-medium);
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s-3);white-space:nowrap}
button:hover:not(:disabled){border-color:transparent;box-shadow:var(--shadow)}
button:disabled{cursor:not-allowed;opacity:.45}

/* input polos */
input:where([type="text"],[type="number"],[type="search"],[type="email"],[type="password"],[type="date"],:not([type])),select,textarea{
  font:inherit;color:var(--text);height:var(--h-md);min-width:0;border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--surface);padding:0 var(--s-5);font-size:var(--fs-base);outline:none}
textarea{height:auto;padding:var(--s-4) var(--s-5);resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--focus-border);box-shadow:var(--focus-shadow)}
input[type="checkbox"],input[type="radio"],input[type="range"]{accent-color:var(--text)}
label{font-size:var(--fs-sm);color:var(--text-3);font-weight:var(--fw-medium)}

/* tabel polos */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-md);background:var(--surface)}
th{height:var(--h-th);padding:0 var(--s-5);text-align:right;font-weight:var(--fw-medium);color:var(--text-3);
  border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
td{height:var(--h-row);padding:0 var(--s-5);text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:hover td{background:var(--surface-2)}
caption{caption-side:top;text-align:left;padding:0 0 var(--s-4);font-weight:var(--fw-semibold)}
kbd{font:var(--fw-medium) var(--fs-2xs) var(--sans);border:1px solid var(--border);border-radius:var(--r-xs);padding:1px 5px;color:var(--text-3);background:var(--surface-2)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;background:var(--hover);border-radius:var(--r-xs);padding:1px 4px}
}

/* ---------------------------------------------------------------------
   3. KOMPONEN
   --------------------------------------------------------------------- */
@layer edge-components {
/* Kartu / panel: border 1px, radius 12, tanpa bayangan */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);min-width:0}
.card-h{display:flex;align-items:center;gap:var(--s-4);padding:var(--s-7) var(--s-8) var(--s-5)}
.card-h h3,.card-h strong{font-size:var(--fs-lg);font-weight:var(--fw-semibold)}
.card-b{padding:0 var(--s-8) var(--s-8)}
.card-f{display:flex;gap:var(--s-4);justify-content:flex-end;padding:var(--s-6) var(--s-8);border-top:1px solid var(--border)}

/* Teks pendukung */
.eyebrow{display:block;font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--text-3);text-transform:uppercase;letter-spacing:var(--ls-caps)}
.note{font-size:var(--fs-sm);color:var(--text-3);line-height:var(--lh-tight)}

/* Tombol */
.btn{height:var(--h-md);padding:0 var(--s-6);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text);
  font-weight:var(--fw-medium);font-size:var(--fs-base);display:inline-flex;align-items:center;justify-content:center;gap:var(--s-3);white-space:nowrap}
.btn:hover:not(:disabled){border-color:transparent;box-shadow:var(--shadow)}
.btn.primary{background:var(--text);color:var(--surface);border-color:var(--text)}
.btn.ghost{border-color:transparent;background:none;box-shadow:none}
.btn.ghost:hover:not(:disabled){background:var(--hover);box-shadow:none}
.btn.danger{color:var(--red)}
.btn.sm{height:var(--h-sm);padding:0 9px;font-size:var(--fs-12)}
.btn.block{width:100%}
.iconbtn{width:var(--h-md);height:var(--h-md);padding:0;border:0;background:none;border-radius:var(--r-md);display:inline-grid;place-items:center;color:var(--text-2);box-shadow:none}
.iconbtn.sm{width:26px;height:26px;border-radius:var(--r-sm)}
.iconbtn:hover:not(:disabled){background:var(--hover);color:var(--text);box-shadow:none}

/* Segmented control (pilihan 2–5) */
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--border);border-radius:var(--r-md);padding:2px;gap:2px;background:var(--surface)}
.seg button{height:26px;padding:0 var(--s-5);border:0;border-radius:var(--r-sm);background:none;box-shadow:none;font-size:var(--fs-md);font-weight:var(--fw-medium);color:var(--text-2)}
.seg button:hover{color:var(--text);box-shadow:none}
.seg button.on,.seg button[aria-pressed="true"]{background:var(--sel);color:var(--text)}
.seg.sm button{height:var(--h-xs);padding:0 var(--s-4);font-size:var(--fs-sm)}

/* Tabs (navigasi antar-view) */
.tabs{display:flex;flex-wrap:wrap;gap:2px}
.tabs button{height:var(--h-md);padding:0 var(--s-6);border:0;border-radius:7px;background:none;box-shadow:none;font-weight:var(--fw-medium);color:var(--text-2)}
.tabs button:hover{color:var(--text);background:var(--hover);box-shadow:none}
.tabs button.on,.tabs button[aria-selected="true"]{background:var(--sel);color:var(--text)}

/* Pill (status/angka) dan Tog (chip filter yang bisa diklik) */
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 var(--s-4);border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:var(--fw-semibold);background:var(--sel);color:var(--text-2);white-space:nowrap}
.pill.pos{background:var(--green-bg);color:var(--green)}
.pill.neg{background:var(--red-bg);color:var(--red)}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.pill.info{background:var(--blue-bg);color:var(--blue)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tog{height:26px;padding:0 var(--s-5);border-radius:var(--r-pill);border:1px solid var(--border);background:var(--surface);box-shadow:none;font-size:var(--fs-12);font-weight:var(--fw-medium);color:var(--text-2)}
.tog:hover:not(:disabled){border-color:var(--border-2);box-shadow:none;color:var(--text)}
.tog.on,.tog[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--surface)}

/* Field (label + input) */
.field{display:grid;gap:var(--s-2)}
.field>span,.field>label{font-size:var(--fs-sm);color:var(--text-3);font-weight:var(--fw-medium)}
.field small{font-size:var(--fs-2xs);color:var(--text-3)}
.inp,.sel{height:var(--h-md);width:100%;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);padding:0 var(--s-5);font-size:var(--fs-base);outline:none;min-width:0}
.inp.sm,.sel.sm{height:var(--h-sm);font-size:var(--fs-12);padding:0 var(--s-4)}
.inp:focus,.sel:focus,.inp.is-focus,.sel.is-focus{border-color:var(--focus-border);box-shadow:var(--focus-shadow)}
.inp.custom{border-color:var(--blue);color:var(--blue);font-weight:var(--fw-semibold)}  /* nilai ≠ default */
.inp.custom:focus,.inp.custom.is-focus{border-color:var(--focus-border);box-shadow:var(--focus-shadow)}  /* saat fokus: border abu seperti input lain, teks tetap biru */

/* Tabel data */
.tbl-wrap{overflow:auto;border-radius:inherit}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-md)}
.tbl th{position:sticky;top:0;z-index:2;height:var(--h-th);padding:0 var(--s-5);background:var(--surface);font-weight:var(--fw-medium);color:var(--text-3);text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl th.sort{cursor:pointer;user-select:none}
.tbl th.sort:hover{color:var(--text)}
.tbl td{height:var(--h-row);padding:0 var(--s-5);text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl th.l,.tbl td.l,.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl.compact td{height:var(--h-th)}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tbody tr.sel td{background:var(--blue-bg)}
.tbl tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--text)}
.tbl .sym{font-weight:var(--fw-semibold);color:var(--text)}
.tbl .sub{display:block;font-size:var(--fs-xs);color:var(--text-3);max-width:200px;overflow:hidden;text-overflow:ellipsis}
.tbl td.miss{color:var(--text-3);background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 7px)}

/* KPI & baris label–nilai */
.kpi{border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s-4) var(--s-5)}
.kpi span{display:block;font-size:var(--fs-xs);color:var(--text-3)}
.kpi b{font-size:var(--fs-lg);font-weight:var(--fw-semibold)}
.kpi.lg b{font-size:var(--fs-2xl)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-4);padding:var(--s-3) 0;font-size:var(--fs-md);color:var(--text-2);border-bottom:1px solid var(--border)}
.kv:last-child{border-bottom:0}
.kv b{color:var(--text);font-weight:var(--fw-medium)}

/* Popover, dialog, toast */
.pop{position:absolute;z-index:var(--z-pop);min-width:220px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:var(--s-3)}
.menu-item{width:100%;height:auto;white-space:normal;line-height:var(--lh-tight);display:flex;align-items:center;gap:var(--s-4);padding:7px var(--s-4);border:0;border-radius:var(--r-sm);background:none;box-shadow:none;font-size:var(--fs-md);font-weight:var(--fw-regular);text-align:left;justify-content:flex-start}
.menu-item:hover{background:var(--hover);box-shadow:none}
.menu-title{font-size:var(--fs-2xs);font-weight:var(--fw-bold);color:var(--text-3);text-transform:uppercase;letter-spacing:var(--ls-caps);padding:var(--s-3) var(--s-4) var(--s-2)}
.backdrop{position:fixed;inset:0;z-index:var(--z-modal);background:rgba(0,0,0,.32);display:grid;place-items:center;padding:var(--s-9)}
.dialog{width:min(520px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-2xl);box-shadow:var(--shadow-lg)}
.dialog-head{padding:var(--s-8) 18px var(--s-6);border-bottom:1px solid var(--border)}
.dialog-head strong{display:block;font-size:var(--fs-xl);font-weight:var(--fw-semibold)}
.dialog-body{padding:var(--s-8) 18px;overflow:auto;display:grid;gap:var(--s-7)}
.dialog-foot{display:flex;justify-content:flex-end;gap:var(--s-4);padding:var(--s-6) 18px;border-top:1px solid var(--border)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:var(--z-toast);background:var(--text);color:var(--surface);border-radius:var(--r-pill);padding:var(--s-4) var(--s-7);font-size:var(--fs-md);box-shadow:var(--shadow-lg)}

/* Lain-lain */
.switch{position:relative;width:32px;height:18px;padding:0;border:0;border-radius:var(--r-pill);background:var(--border-2);box-shadow:none;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.15s}
.switch.on{background:var(--text)} .switch.on::after{left:16px}
.empty{padding:36px var(--s-9);text-align:center;color:var(--text-3)}
.empty strong{display:block;color:var(--text);font-size:var(--fs-lg);margin-bottom:var(--s-2)}
}

/* ---------------------------------------------------------------------
   4. UTILITAS
   --------------------------------------------------------------------- */
@layer edge-utilities {
.up{color:var(--green)} .down{color:var(--red)} .muted{color:var(--text-3)} .strong{color:var(--text);font-weight:var(--fw-semibold)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.custom-val{color:var(--blue);font-weight:var(--fw-semibold)}  /* parameter yang diubah dari default */
.row{display:flex;align-items:center;gap:var(--s-4)} .stack{display:grid;gap:var(--s-4)} .grow{flex:1;min-width:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
}

/* =====================================================================
   v1.1 — PERLUASAN: skala warna, tema aksen, palet chart, katalog button
   v1.2 — State fokus input: border abu (--focus-border) + bayangan (--focus-shadow)
   ---------------------------------------------------------------------
   Semua bersifat TAMBAHAN (opt-in). Tanpa atribut/kelas baru, tampilan
   halaman lama sama persis dengan v1.
   Pilihan global (pasang di <html>):
     data-accent="blue|green|violet|navy"   warna tombol .primary, .tog.on, .switch.on
     data-market="tv|cb"                    pasangan naik/turun: TradingView / ramah buta warna
     data-palette="cb|muted"                seri chart --c1…--c6 (boleh di elemen mana pun)
   Button = gaya × warna × ukuran, bebas dikombinasikan:
     <button class="btn solid tone-blue lg">
     gaya  : solid | soft | outline | ghost | link
     warna : tone-blue | tone-green | tone-red | tone-amber | tone-violet | tone-navy  (kosong = netral)
     ukuran: xs | sm | (default) | lg | xl      bentuk: round | icon
     state : loading | disabled | aria-busy
   ===================================================================== */

/* ---------------------------------------------------------------------
   5. TOKEN TAMBAHAN
   --------------------------------------------------------------------- */
@layer edge-tokens {
:root{
  /* Skala warna 50–900 (tetap di terang & gelap; dipakai untuk solid, ilustrasi, heatmap) */
  --gray-50:#fafafa; --gray-100:#f3f3f3; --gray-200:#eaeaea; --gray-300:#dcdcdc; --gray-400:#bdbdbd;
  --gray-500:#8f8f8f; --gray-600:#6b6b6b; --gray-700:#4d4d4d; --gray-800:#2e2e2e; --gray-900:#171717;

  --blue-50:#eef6ff; --blue-100:#d9eaff; --blue-200:#b8d8ff; --blue-300:#86bdff; --blue-400:#4a9bff;
  --blue-500:#0070f3; --blue-600:#005fd1; --blue-700:#004cab; --blue-800:#003b86; --blue-900:#002b63;

  --green-50:#e8f8f4; --green-100:#c6efe5; --green-200:#93e0cd; --green-300:#5ccbb0; --green-400:#26b194;
  --green-500:#089981; --green-600:#087f5b; --green-700:#076a4d; --green-800:#07523d; --green-900:#063d2e;

  --red-50:#fff0f1; --red-100:#ffdde0; --red-200:#ffbcc2; --red-300:#ff8e98; --red-400:#f85d6b;
  --red-500:#f23645; --red-600:#d62839; --red-700:#b01e2e; --red-800:#8a1724; --red-900:#65111b;

  --amber-50:#fff8eb; --amber-100:#ffecc7; --amber-200:#ffd98f; --amber-300:#fbc157; --amber-400:#f5a623;
  --amber-500:#d9890e; --amber-600:#b45309; --amber-700:#8f4108; --amber-800:#6e3207; --amber-900:#502406;

  --violet-50:#f6efff; --violet-100:#ebdcff; --violet-200:#d9bdfb; --violet-300:#c096f2; --violet-400:#a46be4;
  --violet-500:#8a43d6; --violet-600:#7928ca; --violet-700:#621fa6; --violet-800:#4c1a82; --violet-900:#38145f;

  --navy-50:#eef2fc; --navy-100:#dbe3f8; --navy-200:#b9c8f0; --navy-300:#8fa5e0; --navy-400:#5c7bd0;
  --navy-500:#2a4bb5; --navy-600:#17348c; --navy-700:#122b75; --navy-800:#0e215a; --navy-900:#0a1740;

  /* Alias semantik (ikut tema) */
  --success:var(--green); --danger:var(--red); --warning:var(--amber); --info:var(--blue);
  --violet-bg:rgba(121,40,202,.09); --navy-bg:rgba(23,52,140,.09);
  --up-bg:rgba(8,153,129,.18); --down-bg:rgba(242,54,69,.18);  /* volume bar, area chart */

  /* Aksen: warna tombol .primary & kontrol aktif. Default = hitam/putih (v1) */
  --accent:var(--text); --accent-fg:var(--surface); --accent-hover:color-mix(in srgb,var(--text) 82%,var(--surface));

  /* Animasi kontrol */
  --dur:.12s; --ease:cubic-bezier(.2,.6,.2,1);

  /* v1.2 — State fokus input/select/textarea: border abu tipis + bayangan lembut (menggantikan cincin biru).
     --fk = pengali bayangan (gelap = 3 supaya tetap terlihat di latar hitam) */
  --fk:1;
  --focus-border:color-mix(in srgb,var(--text) 38%,transparent);
  --focus-shadow:0 1px 2px rgba(0,0,0,calc(.06*var(--fk))),0 6px 14px -4px rgba(0,0,0,calc(.14*var(--fk)));
}
:root.dark,:root[data-theme="dark"]{
  --fk:3;
  --violet-bg:rgba(191,122,240,.13); --navy-bg:rgba(125,155,255,.13);
  --up-bg:rgba(8,153,129,.28); --down-bg:rgba(242,54,69,.28);
}

/* Aksen — pasang data-accent di <html> atau pembungkus mana pun */
[data-accent="blue"]  {--accent:var(--blue-600);  --accent-fg:#fff; --accent-hover:var(--blue-700)}
[data-accent="green"] {--accent:var(--green-600); --accent-fg:#fff; --accent-hover:var(--green-700)}
[data-accent="violet"]{--accent:var(--violet-600);--accent-fg:#fff; --accent-hover:var(--violet-700)}
[data-accent="navy"]  {--accent:var(--navy-600);  --accent-fg:#fff; --accent-hover:var(--navy-700)}

/* Seri chart alternatif — boleh di elemen mana pun */
[data-palette="cb"]   {--c1:#0072b2; --c2:#e69f00; --c3:#009e73; --c4:#cc79a7; --c5:#d55e00; --c6:#56b4e9}  /* Okabe–Ito, aman buta warna */
[data-palette="muted"]{--c1:#4c78a8; --c2:#f58518; --c3:#54a24b; --c4:#b279a2; --c5:#e45756; --c6:#72b7b2}  /* redup, cocok untuk banyak seri */

/* Pasangan naik/turun alternatif — pasang di <html> saja */
:root[data-market="tv"]{--up:#26a69a; --down:#ef5350; --green:#12857a; --green-bg:rgba(38,166,154,.12); --red:#d6403f; --red-bg:rgba(239,83,80,.10);
  --up-bg:rgba(38,166,154,.20); --down-bg:rgba(239,83,80,.20)}
:root.dark[data-market="tv"]{--green:#4dd0c4; --green-bg:rgba(77,208,196,.13); --red:#ff7a77; --red-bg:rgba(255,122,119,.13)}
:root[data-market="cb"]{--up:#0072b2; --down:#e69f00; --green:#0a63a0; --green-bg:rgba(0,114,178,.10); --red:#a85d00; --red-bg:rgba(230,159,0,.15);
  --up-bg:rgba(0,114,178,.20); --down-bg:rgba(230,159,0,.24)}
:root.dark[data-market="cb"]{--green:#56b4e9; --green-bg:rgba(86,180,233,.14); --red:#f0b030; --red-bg:rgba(240,176,48,.14)}
}

/* ---------------------------------------------------------------------
   6. BUTTON — katalog (menambah, tidak mengganti .btn v1)
   --------------------------------------------------------------------- */
@keyframes edge-spin{to{transform:rotate(360deg)}}

@layer edge-components {
/* .primary kini mengikuti --accent (default tetap hitam/putih) */
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
[data-accent] .btn.primary:hover:not(:disabled),[data-accent].btn.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
[data-accent] .tog.on,[data-accent] .tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
[data-accent] .switch.on{background:var(--accent)}

/* Variabel warna per tombol (netral = default) */
.btn{--bc:var(--text); --bc-hover:color-mix(in srgb,var(--text) 82%,var(--surface)); --bc-fg:var(--surface);
  --bc-ink:var(--text); --bc-line:var(--border-2);
  --bc-soft:color-mix(in srgb,var(--bc-ink) 8%,transparent); --bc-soft-2:color-mix(in srgb,var(--bc-ink) 15%,transparent);
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),color var(--dur) var(--ease)}
.btn.tone-blue  {--bc:var(--blue-600);  --bc-hover:var(--blue-700);  --bc-fg:#fff; --bc-ink:var(--blue);  --bc-line:color-mix(in srgb,var(--blue) 45%,transparent)}
.btn.tone-green {--bc:var(--green-600); --bc-hover:var(--green-700); --bc-fg:#fff; --bc-ink:var(--green); --bc-line:color-mix(in srgb,var(--green) 45%,transparent)}
.btn.tone-red   {--bc:var(--red-600);   --bc-hover:var(--red-700);   --bc-fg:#fff; --bc-ink:var(--red);   --bc-line:color-mix(in srgb,var(--red) 45%,transparent)}
.btn.tone-amber {--bc:var(--amber-600); --bc-hover:var(--amber-700); --bc-fg:#fff; --bc-ink:var(--amber); --bc-line:color-mix(in srgb,var(--amber) 45%,transparent)}
.btn.tone-violet{--bc:var(--violet-600);--bc-hover:var(--violet-700);--bc-fg:#fff; --bc-ink:var(--violet);--bc-line:color-mix(in srgb,var(--violet) 45%,transparent)}
.btn.tone-navy  {--bc:var(--navy-600);  --bc-hover:var(--navy-700);  --bc-fg:#fff; --bc-ink:var(--navy);  --bc-line:color-mix(in srgb,var(--navy) 45%,transparent)}

/* Gaya */
.btn.solid{background:var(--bc);color:var(--bc-fg);border-color:var(--bc)}
.btn.solid:is(:hover:not(:disabled),.is-hover){background:var(--bc-hover);border-color:var(--bc-hover);box-shadow:var(--shadow)}
.btn.soft{background:var(--bc-soft);color:var(--bc-ink);border-color:transparent}
.btn.soft:is(:hover:not(:disabled),.is-hover){background:var(--bc-soft-2);border-color:transparent;box-shadow:none}
.btn.outline{background:transparent;color:var(--bc-ink);border-color:var(--bc-line)}
.btn.outline:is(:hover:not(:disabled),.is-hover){background:var(--bc-soft);border-color:var(--bc-line);box-shadow:none}
.btn.ghost{color:var(--bc-ink)}
.btn.ghost:is(:hover:not(:disabled),.is-hover){background:var(--bc-soft);box-shadow:none}
.btn.link{height:auto;padding:0 1px;border:0;border-radius:var(--r-xs);background:none;box-shadow:none;color:var(--bc-ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--bc-ink) 35%,transparent)}
.btn.link:is(:hover:not(:disabled),.is-hover){border:0;box-shadow:none;text-decoration-color:currentColor}

/* State umum (kelas .is-* hanya untuk dokumentasi / uji visual) */
.btn:is(:active:not(:disabled),.is-active){transform:translateY(.5px);filter:brightness(.96)}
.btn.is-focus{outline:2px solid var(--blue);outline-offset:2px}
.btn.loading,.btn[aria-busy="true"]{pointer-events:none;opacity:.78}
.btn.loading::before,.btn[aria-busy="true"]::before{content:"";width:12px;height:12px;flex:none;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:edge-spin .7s linear infinite}

/* Ukuran & bentuk */
.btn.xs{height:24px;padding:0 7px;font-size:var(--fs-sm);border-radius:var(--r-sm);gap:var(--s-2)}
.btn.lg{height:40px;padding:0 var(--s-8);font-size:var(--fs-lg)}
.btn.xl{height:48px;padding:0 var(--s-10);font-size:var(--fs-xl);border-radius:var(--r-lg)}
.btn.round{border-radius:var(--r-pill)}
.btn.icon{width:var(--h-md);padding:0}
.btn.icon.xs{width:24px} .btn.icon.sm{width:var(--h-sm)} .btn.icon.lg{width:40px} .btn.icon.xl{width:48px}
.btn svg{width:1.15em;height:1.15em;flex:none}
.btn .kbd,.btn kbd{margin-left:var(--s-2);background:color-mix(in srgb,currentColor 10%,transparent);border-color:color-mix(in srgb,currentColor 18%,transparent);color:inherit;opacity:.8}

/* Transisi halus untuk perubahan state fokus input (v1.2) */
.inp,.sel{transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}

/* Grup tombol */
.btn-group{display:inline-flex;vertical-align:middle}
.btn-group>.btn{border-radius:0;position:relative}
.btn-group>.btn+.btn{margin-left:-1px}
.btn-group>.btn:first-child{border-radius:var(--r-md) 0 0 var(--r-md)}
.btn-group>.btn:last-child{border-radius:0 var(--r-md) var(--r-md) 0}
.btn-group>.btn:only-child{border-radius:var(--r-md)}
.btn-group>.btn:is(:hover,:focus-visible,.on){z-index:1}
.btn-group>.btn.on{background:var(--sel);border-color:var(--border-2)}
}

/* shell bersama (sidebar + top bar) — hanya memakai token EDGE spec */
html,body{width:1600px;height:var(--vh,1000px);overflow:hidden}
svg{display:block;flex:none}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic-sm{width:14px;height:14px}
.ic.filled{fill:currentColor}
.app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:minmax(0,1fr);height:var(--vh,1000px);overflow:hidden}
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:var(--s-7) var(--s-6)}
.brand{display:flex;align-items:center;gap:var(--s-5);padding:var(--s-2) var(--s-4) var(--s-8)}
.logo{width:26px;height:26px;border-radius:var(--r-sm);background:var(--text);color:var(--surface);display:grid;place-items:center;font-weight:var(--fw-bold);font-size:13px}
.brand b{font-size:var(--fs-lg);font-weight:var(--fw-bold);letter-spacing:.04em}
.nav .eyebrow{padding:var(--s-8) var(--s-5) var(--s-3)}
.nav .eyebrow:first-child{padding-top:var(--s-2)}
.nav a{display:flex;align-items:center;gap:var(--s-5);height:var(--h-md);padding:0 var(--s-5);border-radius:var(--r-md);color:var(--text-2);font-weight:var(--fw-medium);font-size:var(--fs-base)}
.nav a .ic{color:var(--text-3)}
.nav a:hover{background:var(--hover);color:var(--text);text-decoration:none}
.nav a.on{background:var(--sel);color:var(--text)}
.nav a.on .ic{color:var(--text)}
.nav .n{margin-left:auto;font-size:var(--fs-xs);color:var(--text-3);font-weight:var(--fw-medium)}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:var(--s-5);padding:var(--s-5) var(--s-4) 0;border-top:1px solid var(--border)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--sel);color:var(--text-2);display:grid;place-items:center;font-size:var(--fs-xs);font-weight:var(--fw-semibold)}
.side-foot b{display:block;font-weight:var(--fw-medium);line-height:1.3}
.side-foot small{display:block}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}

.page{flex:1;min-height:0;display:flex;flex-direction:column;padding:var(--s-9) var(--s-10)}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:var(--s-8)}
.head p{margin-top:var(--s-1)}
.head .actions{display:flex;align-items:center;gap:var(--s-4)}
.sp-fill{flex:1}

/* Radar + detail filter — hanya token spec */
.page{overflow:hidden}
.card-h .grow{flex:1}
.card-h .hint{color:var(--text-3);font-size:var(--fs-12);font-weight:var(--fw-regular)}
.lbl{font-size:var(--fs-12);color:var(--text-3);white-space:nowrap}
.bar-t{display:flex;align-items:center;gap:var(--s-7);padding:0 var(--s-7);height:52px;margin-bottom:var(--s-8);flex:none}
.bar-t .f{display:flex;align-items:center;gap:var(--s-4)}
.bar-t .sp{flex:1}
.bar-t .seg{flex-wrap:nowrap}.bar-t .seg button{white-space:nowrap}
.bar-t .btn .m{color:var(--text-3);font-weight:var(--fw-regular)}
.bar-t .srch{width:240px;display:flex;align-items:center;gap:var(--s-4);height:var(--h-sm);border:1px solid var(--border);border-radius:var(--r-md);padding:0 var(--s-4);color:var(--text-3);font-size:var(--fs-12)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s-8);margin-bottom:var(--s-8);flex:none}
.k{height:76px;padding:var(--s-5) var(--s-7);display:flex;flex-direction:column;justify-content:space-between}
.k .lb{font-size:var(--fs-xs);color:var(--text-3);font-weight:var(--fw-medium);line-height:18px}
.k .v{font-size:var(--fs-2xl);font-weight:var(--fw-semibold);line-height:22px}
.k .v small{font-size:var(--fs-md);font-weight:var(--fw-regular);color:var(--text-3);margin-left:var(--s-3)}
.k .s{font-size:var(--fs-12);line-height:16px;color:var(--text-3)}
.sym{font-weight:var(--fw-semibold)}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:var(--r-xs);font-size:var(--fs-2xs);font-weight:var(--fw-semibold);background:var(--sel);color:var(--text-2);white-space:nowrap}
.tag.new{background:var(--blue-bg);color:var(--blue)}
.tag.warn{background:var(--amber-bg);color:var(--amber)}

/* ---------- Radar ---------- */
.rg{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--s-8)}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:var(--s-8);min-height:0}
.fc{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.fc .card-h{padding-bottom:var(--s-2);gap:var(--s-4)}
.fc .card-h h3{font-size:var(--fs-base)}
.fc .ds{padding:0 var(--s-7);font-size:var(--fs-12);color:var(--text-3);line-height:16px;height:32px;overflow:hidden}
.fc .cnt{display:flex;align-items:flex-end;justify-content:space-between;padding:var(--s-4) var(--s-7) var(--s-3)}
.fc .cnt b{font-size:var(--fs-2xl);font-weight:var(--fw-semibold);line-height:22px}
.fc .cnt b small{font-size:var(--fs-12);font-weight:var(--fw-regular);color:var(--text-3);margin-left:var(--s-3)}
.fc .cnt svg{display:block}
.fc .rows{flex:1;min-height:0;border-top:1px solid var(--border)}
.fr{display:grid;grid-template-columns:52px minmax(0,1fr) 58px;gap:var(--s-4);align-items:center;height:30px;padding:0 var(--s-7);font-size:var(--fs-12);border-bottom:1px solid var(--border)}
.fr:last-child{border-bottom:0}
.fr .r{text-align:right}
.fr .t{display:flex;gap:var(--s-3);align-items:center;min-width:0}
.fc .ft{padding:var(--s-4) var(--s-7) var(--s-5);display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-12);color:var(--text-3);border-top:1px solid var(--border)}
.fc .ft a{color:var(--text);font-weight:var(--fw-medium);display:inline-flex;align-items:center;gap:var(--s-2)}
.ms{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.mr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s-2) var(--s-4);padding:var(--s-4) var(--s-8);border-top:1px solid var(--border)}
.mr .sym{font-size:var(--fs-md)}
.mr .n{font-size:var(--fs-12);color:var(--text-3)}
.mr .c{text-align:right;font-size:var(--fs-12);font-weight:var(--fw-medium)}
.mr .fs{grid-column:1/3;display:flex;gap:var(--s-2);flex-wrap:wrap}
.cust{padding:var(--s-5) var(--s-8);border-top:1px solid var(--border);margin-top:auto}
.cust .eyebrow{margin-bottom:var(--s-3)}
.cust .ci{display:flex;justify-content:space-between;font-size:var(--fs-12);padding:3px 0;color:var(--text-2)}
.cust .ci b{font-weight:var(--fw-medium);color:var(--text)}

/* ---------- Detail ---------- */
.rule{display:flex;align-items:center;flex-wrap:nowrap;gap:var(--s-4);padding:var(--s-5) var(--s-7);margin-bottom:var(--s-8);flex:none;overflow:hidden}
.rule>*{flex:none}.rule .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:var(--s-3);height:30px;padding:0 var(--s-4) 0 var(--s-3);border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);font-size:var(--fs-md);color:var(--text);white-space:nowrap}
.chip .bd{width:18px;height:18px;border-radius:var(--r-xs);background:var(--sel);color:var(--text-2);font-size:var(--fs-2xs);font-weight:var(--fw-bold);display:grid;place-items:center}
.chip .op{color:var(--text-3)}
.chip b{font-weight:var(--fw-semibold)}
.chip b.cu{color:var(--blue)}
.chip.plain{padding:0 var(--s-4)}
.top3{display:grid;grid-template-columns:minmax(0,1fr) var(--rail-w);gap:var(--s-8);margin-bottom:var(--s-8);flex:none}
.hist{padding:0 var(--s-7) var(--s-5);position:relative;flex:1;min-height:150px}
.hist>svg{position:absolute;left:var(--s-7);top:0;display:block}
.top3>.card:first-child{display:flex;flex-direction:column}
.hs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-5);padding:0 var(--s-8)}
.hs .v{font-size:var(--fs-xl);font-weight:var(--fw-semibold)}
.hs .l{font-size:var(--fs-xs);color:var(--text-3)}
.hnote{padding:var(--s-5) var(--s-8) var(--s-6);font-size:var(--fs-12);color:var(--text-3);display:flex;justify-content:space-between;align-items:center}
.dg{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--rail-w);gap:var(--s-8)}
.ct{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ct .tbl th,.ct .tbl td{font-size:var(--fs-12)}
.ct .tbl td{height:40px}
.ct .tbl th:first-child,.ct .tbl td:first-child{padding-left:var(--s-8)}
.ct .tbl th:last-child,.ct .tbl td:last-child{padding-right:var(--s-8)}
.ct .tk b{display:block;font-weight:var(--fw-semibold);font-size:var(--fs-md);line-height:15px}
.ct .tk small{color:var(--text-3);font-size:var(--fs-xs)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:16px;height:16px;border-radius:var(--r-xs);display:grid;place-items:center;font-style:normal;font-size:9.5px;font-weight:var(--fw-bold);background:var(--text);color:var(--surface)}
.dots i.off{background:var(--gray-100);color:var(--text-3)}
.pb{display:inline-flex;align-items:center;gap:var(--s-3);justify-content:flex-end}
.pb .tr{width:56px;height:5px;border-radius:3px;background:var(--gray-200);position:relative}
.pb .tr i{position:absolute;top:-2px;width:3px;height:9px;border-radius:1px;background:var(--gray-500)}
.pb.hi .tr i{background:var(--text)}
.pb.hi b{font-weight:var(--fw-semibold)}
.pv{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pv .sec{padding:0 var(--s-8) var(--s-6)}
.pv .sec+.sec{border-top:1px solid var(--border);padding-top:var(--s-6)}
.pv .eyebrow{margin-bottom:var(--s-4)}
.chk{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:var(--s-4);align-items:center;padding:4px 0;font-size:var(--fs-12)}
.chk .ok{color:var(--green)}
.chk span{color:var(--text-2)}
.chk b{font-weight:var(--fw-medium)}

/* prototype layer: makes the static mockup scroll and respond; reuses EDGE tokens */
html,body{width:auto;height:100%;overflow:hidden}

.bar-t .srch{position:relative}.bar-t .srch input{border:0;outline:none;background:none;font:inherit;font-size:var(--fs-12);color:var(--text);flex:1;min-width:0}

.menu{padding:var(--s-3)}

/* ---------- State layer: selaras Market Screener v21 ----------
   Satu bahasa state untuk semua komponen, diturunkan dari token (terang/gelap otomatis).
   Aturan lama yang bentrok (hover baris, tepi chip terbuka, dsb.) sudah dihapus, bukan ditimpa. */
:root{
  --focus-border:var(--text-3);--focus-shadow:none;               /* fokus input & search: garis abu 1px, tanpa bayangan */
  --shadow-sm:0 1px 2px rgba(0,0,0,.06),0 2px 8px -2px rgba(0,0,0,.10);
  --pick:color-mix(in srgb,var(--blue) 6%,var(--surface));        /* baris terpilih */
  --pick-hover:color-mix(in srgb,var(--blue) 9%,var(--surface));  /* baris terpilih + hover */
  --raise:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--border-2);    /* pilihan aktif di segmented */
}
:root.dark,:root[data-theme="dark"]{--shadow-sm:0 1px 2px rgba(0,0,0,.45),0 2px 8px -2px rgba(0,0,0,.55)}
/* Terpilih */
.seg{background:var(--surface-2)}
.seg button.on,.seg button[aria-pressed="true"],.seg button[aria-selected="true"],.seg button[aria-checked="true"]{background:var(--surface);color:var(--text);box-shadow:var(--raise)}
.tbl tbody tr.on td{background:var(--pick)}
.tbl tbody tr.on td:first-child{box-shadow:inset 3px 0 0 var(--text)}
/* Hover */
.tbl tbody tr.on:hover td{background:var(--pick-hover)}
.bar-t .srch:hover:not(:focus-within){border-color:var(--border-2)}
.uni:hover:not(:disabled){border-color:var(--border-2);box-shadow:none}
/* Pemicu menu yang sedang terbuka (berlaku untuk semua elemen dengan aria-haspopup) */
[aria-haspopup][aria-expanded="true"],[aria-haspopup][aria-expanded="true"]:hover:not(:disabled){background:var(--sel);border-color:transparent;box-shadow:var(--shadow-sm)}


/* scrollbars: thin, neutral, theme-aware */
*::-webkit-scrollbar{width:4px;height:4px}
*::-webkit-scrollbar-track,*::-webkit-scrollbar-corner{background:transparent}
*::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--text-3) 40%,transparent);border-radius:999px}
*::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--text-3) 65%,transparent)}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--text-3) 45%,transparent) transparent}}

/* layout: one width for the right-hand column everywhere (Radar, detail top row, detail candidates row) */
:root{--rail-w:380px;--ihsg:#1f3a68}
:root.dark,:root[data-theme="dark"]{--ihsg:#8fb0e6}
/* chart legend */
.chart-h{flex-wrap:wrap;row-gap:var(--s-2)}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-12);color:var(--text-3);margin-left:var(--s-4)}
.lg .sw{display:inline-block;flex:none}
.lg .sw.bar{width:8px;height:10px;border-radius:1px;background:var(--gray-300)}
.lg .sw.ln{width:14px;height:0;border-top:1.5px solid var(--ihsg)}
/* candidates: title row, then one toolbar row (search | universe | liquidity | sort) */
.ct .card-h>:not(.grow){flex:none;white-space:nowrap}
.ct{container-type:inline-size}
.ct-head{display:grid;grid-template-columns:1fr;grid-template-areas:"l" "r";align-items:center;gap:var(--s-5) var(--s-4);padding:var(--s-7) var(--s-8) var(--s-6)}
.ct-head .card-h{grid-area:l;padding:0}
.ct-head .srch{width:240px;display:flex;align-items:center;gap:var(--s-4);height:var(--h-sm);border:1px solid var(--border);border-radius:var(--r-md);padding:0 var(--s-4);color:var(--text-3);font-size:var(--fs-12);background:var(--surface);position:relative;min-width:0}
.ct-head .srch input{border:0;outline:none;background:none;font:inherit;font-size:var(--fs-12);color:var(--text);flex:1;min-width:0}
.ct-head .srch:hover:not(:focus-within){border-color:var(--border-2)}
.ct-head .srch:focus-within{border-color:var(--focus-border);box-shadow:var(--focus-shadow)}
.ct-r{grid-area:r;display:flex;align-items:center;justify-content:flex-end;gap:var(--s-4);flex-wrap:wrap}
.ct-r .uni{width:152px}
.ct-r .sortg{display:flex;align-items:center;gap:var(--s-4)}.ct-r .seg button{white-space:nowrap}
/* wide card: one row (title group | search + filters + sort). Narrower: title row, then toolbar row. */
@container (min-width:1220px){.ct-head{grid-template-columns:1fr auto;grid-template-areas:"l r"}}
/* preview: price chart hover */
.pvw{position:relative}
.ptip{position:absolute;top:0;pointer-events:none;z-index:2;display:flex;align-items:center;gap:var(--s-4);padding:5px 8px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-md);box-shadow:var(--shadow);font-size:var(--fs-12);white-space:nowrap}
.ptip[hidden]{display:none}.ptip .tp{font-variant-numeric:tabular-nums;font-weight:var(--fw-semibold)}
.pvh{cursor:crosshair}
.pv .acts{margin-top:0;padding-top:var(--s-6);border-top:1px solid var(--border)}

/* ===== R10 additions ===== */
/* EDGE shell rail (apps/edge-bff/static/index.html .side-nav, EXEC-NAV-LEFT): 56 px, 40 px buttons, 22 px icons at
   stroke 1.7; shown here only so the new Radar icon can be judged in place. In EDGE the rail belongs to the shell and
   the Radar page runs in its frame. */
.app{grid-template-columns:56px minmax(0,1fr)}
.side-nav{grid-column:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-right:1px solid var(--border);background:var(--surface);min-height:0}
.side-nav>button,.side-nav .side-actions>button{position:relative;display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:10px;background:none;color:var(--text-2);cursor:pointer;padding:0}
.side-nav .side-actions>button{width:36px;height:36px}
.side-nav>button:hover,.side-nav .side-actions>button:hover{background:var(--hover);color:var(--text)}
.side-nav>button.active{background:var(--sel);color:var(--text)}
.side-nav>button.active::before{content:"";position:absolute;left:-8px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--text)}
.side-nav button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.side-nav .brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--text);color:var(--surface);font-weight:700;margin-bottom:6px}
.side-nav .side-actions{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:auto;padding-top:10px;border-top:1px solid var(--border);width:36px}
.side-nav .side-actions>button.avatar{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font-weight:600;font-size:12px;margin-top:4px;cursor:pointer}
.side-nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-nav .side-actions svg{width:20px;height:20px}
.side-nav [data-tip]:hover::after,.side-nav [data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;z-index:200;left:calc(100% + 12px);top:50%;transform:translateY(-50%);padding:6px 10px;border-radius:6px;background:#111;color:#fff;font:500 12px/1.2 var(--sans);white-space:nowrap;pointer-events:none;box-shadow:0 4px 12px rgb(0 0 0 / .18)}
:root[data-theme="dark"] .side-nav [data-tip]:hover::after,:root[data-theme="dark"] .side-nav [data-tip]:focus-visible::after{background:#f4f4f5;color:#111}
.side-nav .new-dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.main{grid-column:2}
/* board: seven filters */
.kb{grid-template-columns:repeat(7,minmax(0,1fr))}
.bar-t .gh{font-size:var(--fs-xs);margin-left:calc(-1 * var(--s-3));white-space:nowrap}
.kc .kh small{min-height:2.7em}
/* detail */
.crumb{margin:0 0 var(--s-2)}.crumb .lk{display:inline-flex;align-items:center;gap:2px;color:var(--text-3)}
.note-read{display:flex;gap:var(--s-4);align-items:flex-start;padding:var(--s-5) var(--s-8);margin-bottom:var(--s-8);color:var(--text-2);font-size:var(--fs-md);line-height:var(--lh-tight)}
.note-read .ic{flex:none;margin-top:1px;color:var(--text-3)}.note-read b{color:var(--text);font-weight:var(--fw-semibold)}
.conds{display:flex;flex-wrap:wrap;gap:var(--s-3) var(--s-8);padding:0 var(--s-8) var(--s-5);font-size:var(--fs-xs);color:var(--text-2)}
.conds span{display:inline-flex;align-items:center;gap:var(--s-3)}
.conds i,.ck{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:3px;background:var(--text);color:var(--surface);font-style:normal;font-size:9.5px;font-weight:700}
.ck{margin-right:var(--s-3)}.ck.off{background:var(--sel);color:var(--text-3)}
.tbl tr.nm td{color:var(--text-3)}
.eyebrow2{display:block;font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--text-3);margin-bottom:var(--s-3)}
.flagnote{display:flex;gap:var(--s-4);margin:0 var(--s-8) var(--s-5);padding:var(--s-4) var(--s-5);border-radius:var(--r-md);background:var(--amber-bg);color:var(--amber);font-size:var(--fs-xs);line-height:var(--lh-tight)}
.flagnote .ic{flex:none}
/* phone: EDGE hides its rail below 720 px; the board scrolls sideways one filter at a time */
@media (max-width:720px){
 .app{grid-template-columns:minmax(0,1fr)}.side-nav{display:none}.main{grid-column:1}
 .page{padding:var(--s-8)}
 .head{flex-direction:column;align-items:flex-start;gap:var(--s-5)}.head .actions{flex-wrap:wrap}
 .bar-t{flex-wrap:wrap;gap:var(--s-4)}.bar-t .srch{width:100%}
 .kb{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:var(--s-5);min-height:0}
 .kb>.kc{flex:0 0 82%;scroll-snap-align:start;min-height:360px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.ct-r{flex-wrap:wrap;row-gap:var(--s-4)}
.ct-r .btn.uni{width:auto;min-width:0}
/* dark theme: the grays R9 defined only for light (column bodies, chart bars, price line) */
:root[data-theme="dark"]{--gray-50:#0f0f0f;--gray-100:#1a1a1a;--gray-300:#3a3a3a;--gray-500:#6f6f6f;--gray-900:#ededed}
@media (max-width:720px){
 .bar-t{height:auto;flex-wrap:wrap;padding:var(--s-5) var(--s-7)}
 .bar-t .btn.uni{width:100%}
 .bar-t .gh{margin-left:0}
 .bar-t .sp{display:none}
}
/* board card: tags left, the 20-session price line at the bottom right */
.ki .t2{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap;row-gap:var(--s-2)}
.ki .ksp{margin-left:auto;display:inline-flex;flex:none;opacity:.9}
/* selected option of every segmented control: ink fill, surface text (user 2026-11-14); in the dark theme the ink is
   light and the text dark, so the selected option stays the strongest mark in both themes */
.seg button.on,.seg button[aria-checked="true"]{background:var(--text);color:var(--surface)}
.seg button.on:hover{color:var(--surface)}
/* each column is as tall as its stocks (user 2026-11-14); a long column stops at the screen's height and scrolls inside */
.kb{align-items:start;min-height:0;flex:none}
.kb>.kc{min-height:0;max-height:calc(100vh - 210px)}
.kb>.kc .kl{flex:0 1 auto}
.kb>.kb-empty{position:static;transform:none;grid-column:1/-1;justify-self:center;margin-top:var(--s-4);box-shadow:none}
@media (max-width:720px){.kb>.kc{min-height:0;max-height:70vh}}
/* column count, option 8: one dot per stock (up to 10, then +N) beside the number; zero in grey */
.kc .kh .cnt8{display:inline-flex;align-items:center;gap:2px;font-style:normal;font-variant-numeric:tabular-nums}
.kc .kh .cnt8 i{width:5px;height:5px;border-radius:50%;background:var(--text)}
.kc .kh .cnt8 em{font-style:normal;font-size:10px;color:var(--text-3);margin-left:1px}
.kc .kh .cnt8 b{margin-left:6px;font-size:var(--fs-lg);font-weight:var(--fw-semibold);color:var(--text)}
.kc .kh .cnt8.z b{color:var(--text-3)}
</style>

/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const hsh=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return h};
const ic=(n,c='ic ic-sm')=>`<svg class="${c}"><use href="#i-${n}"/></svg>`;

const sg=(x,d=2)=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d)+'%';
const pt=(x,d=1)=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d)+' pt';

/* ================= data: illustrative, built from SCREENER_LIBRARY.md examples ================= */
/* Prices, names and 1D change: dev database, 9 Nov 2026. Filter values: library examples (3 Nov for S1-S3, S6, S7;
   9 Nov for S8). Day N, history and sparkline counts are made up. */

const ST={uni:'all',gate:'broad',lv:1,show:'all',q:'',dmode:'v1',last:'S1',detail:{sort:'own',prev:'1Y',q:'',day:0}};
const met=(f,v)=>f.conds(ST.lv).map(c=>!!c[1](v));
function evalRows(f,{withNear=false}={}){
  const out=[],near=[];
  for(const [t,v] of Object.entries(f.rows)){
    if(v.buy5<GATE[ST.gate].cut||!inUni(t,ST.uni))continue;
    const m=met(f,v),miss=m.filter(x=>!x).length;
    if(f.own){if(m[0]&&m[1])out.push({t,v,m});else if(withNear&&miss===1)near.push({t,v,m});continue}
    if(!miss)out.push({t,v,m});else if(withNear&&miss===1)near.push({t,v,m})}
  out.sort((a,b)=>f.sort(b.v)-f.sort(a.v));near.sort((a,b)=>f.sort(b.v)-f.sort(a.v));return {hits:out,near}}
const dayRaw=(f,t)=>{const r=rng(hsh(f.id+t))();return r<.38?1:1+Math.floor(r*9)};
/* S6Δ is built on S6, so a stock cannot have been in S6Δ longer than in S6 */
const dayOf=(f,t)=>f.id==='S6D'?Math.min(dayRaw(f,t),dayRaw(FILTERS[3],t)):dayRaw(f,t);
const hitSet=f=>new Set(evalRows(f).hits.map(h=>h.t));
function alsoIn(f,t){return FILTERS.filter(g=>g!==f&&hitSet(g).has(t))}
const visibleHits=f=>evalRows(f).hits.filter(h=>{const d=dayOf(f,h.t);
  if(ST.show==='new'&&d!==1)return false;if(ST.show==='multi'&&!alsoIn(f,h.t).length)return false;
  if(ST.q&&!(h.t+' '+STK[h.t][0]).toLowerCase().includes(ST.q))return false;return true});
const isDefault=()=>ST.uni==='all'&&ST.gate==='broad'&&ST.lv===1&&ST.show==='all'&&!ST.q;
/* daily counts: illustrative series ending at today's count */
function hist(f,len){const r=rng(hsh(f.id)*3+1),n=evalRows(f).hits.length;let v=Math.max(1,n*.7);const a=[];for(let i=0;i<len;i++){v=Math.max(0,v+(r()-.49)*1.8);a.push(Math.round(v))}a[len-1]=n;return a}
const exits=f=>{const r=rng(hsh(f.id)+99),pool=Object.keys(f.rows).filter(t=>!hitSet(f).has(t));const n=Math.min(pool.length,1+Math.floor(r()*2));return pool.slice(0,n).map(t=>({t,why:met(f,f.rows[t]).findIndex(x=>!x)}))};

  return `<svg class="ks" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t} price, last 20 sessions, ${up?'up':'down'}"><polyline fill="none" stroke="${up?'var(--up)':'var(--down)'}" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" points="${a.map((x,i)=>(i/19*(W-2)+1).toFixed(1)+','+(1+(hi-x)/((hi-lo)||1)*(H-2)).toFixed(1)).join(' ')}"/></svg>`}

  document.body.appendChild(m);btn.setAttribute('aria-expanded','true');const os=$$('.menu-item:not([disabled])',m);(os.find(b=>b.classList.contains('on'))||os[0])?.focus();
  m.addEventListener('click',e=>{const b=e.target.closest('.menu-item');if(!b||b.disabled)return;closeMenus();onPick(b.dataset.v);btn.focus()});
  m.addEventListener('keydown',e=>{const i=os.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();os[(i+1)%os.length].focus()}if(e.key==='ArrowUp'){e.preventDefault();os[(i-1+os.length)%os.length].focus()}if(e.key==='Escape'){closeMenus();btn.focus()}});m._btn=btn}

  g+=`<polyline fill="none" stroke="var(--text)" stroke-width="1.3" stroke-linejoin="round" points="${cc.map((x,k)=>xf(k).toFixed(1)+','+yf(x).toFixed(1)).join(' ')}"/><rect x="${PL}" y="${H+6}" width="${W-PL}" height="${BH}" rx="3" fill="var(--gray-50)"/>`;
  vis.forEach(e=>{const a=Math.max(e[0],I0);g+=`<rect x="${PL+(a-I0)*bw}" y="${H+9}" width="${Math.max(2,(e[1]-a+1)*bw)}" height="${BH-6}" fill="var(--text)"/>`});
  let lx=-99;for(let k=0;k<len;k++){const i=I0+k;if(k===0||DAYS[i].getUTCMonth()!==DAYS[i-1].getUTCMonth()){const x=PL+k*bw;if(x-lx>40){g+=`<text x="${x}" y="${H+BH+20}" font-size="10" fill="var(--text-3)">${MONS[DAYS[i].getUTCMonth()]}</text>`;lx=x}}}
  const recent=vis.slice(-3).reverse().map(e=>{const L2=e[1]-e[0]+1;return `<div class="kv2"><span>${fd(e[0])}${L2>1?' – '+fd(e[1]):''}</span><b>${e[1]===N-1?'<span class="tag new">Active · day '+L2+'</span>':L2+' day'+(L2>1?'s':'')}</b></div>`}).join('');
  pv.innerHTML=`<div class="card-h"><h3>${t}</h3><span class="hint">${esc(S[0])}</span><span class="grow"></span><b style="font-weight:var(--fw-semibold)">${px(S[1])}</b><span class="${cl(S[2])}" style="font-size:var(--fs-12)">${sg(S[2])}</span></div>
   ${sel.v.flag?`<div class="flagnote">${ic('info')}<span>${esc(sel.v.flag)}. Check for a block trade or corporate action before reading the flow.</span></div>`:''}
   <div class="sec"><div style="display:flex;align-items:center;gap:var(--s-4);margin-bottom:var(--s-4)"><span class="eyebrow2" style="margin:0">When ${fid(f)} found it</span><span style="flex:1"></span><div class="seg sm" role="radiogroup" aria-label="Range" data-pv>${['3M','6M','1Y'].map(r=>`<button role="radio" aria-checked="${ST.detail.prev===r}" class="${ST.detail.prev===r?'on':''}" data-v="${r}">${r}</button>`).join('')}</div></div>
    <svg width="${W}" height="${H+BH+24}" viewBox="0 0 ${W} ${H+BH+24}" role="img" aria-label="Price of ${t} with the days ${fid(f)} found it">${g}</svg>
    <div class="kv2" style="margin-top:var(--s-3)"><span><b style="color:var(--text)">${act}</b> days found · <b style="color:var(--text)">${vis.length}</b> runs in ${ST.detail.prev}</span></div><div style="margin-top:var(--s-3)">${recent}</div></div>
   <div class="acts"><button class="btn sm primary" data-act="term">Open ${t} in Terminal</button></div>`;
  $('[data-act=term]',pv).onclick=()=>toast(`${t} opens in the Terminal (not part of this prototype).`);
  $('[data-pv]',pv).onclick=e=>{const b=e.target.closest('button');if(!b)return;ST.detail.prev=b.dataset.v;preview(f,sel,C)}}

/* ================= shell rail, routing ================= */
function renderMissing(n){document.title='EDGE — '+n;view.innerHTML=`<div class="missing card"><h1>${esc(n)}</h1><p class="muted">This page is not part of this prototype. Only Radar and the filter detail page are included.</p><button class="btn primary" data-go="#/radar">Go to Radar</button></div>`;$('[data-go]',view).onclick=()=>go('#/radar')}
function go(h){if(location.hash===h)route();else location.hash=h}
function route(){closeMenus();const h=location.hash||'#/radar',[path,qs]=h.slice(1).split('?'),p=new URLSearchParams(qs||''),seg=path.split('/').filter(Boolean);
  if(seg[0]==='filter')renderDetail(seg[1],p.get('s'));else if(!seg.length||seg[0]==='radar')renderRadar();
  else renderMissing({monitor:'Monitor',terminal:'Terminal',backtest:'Backtest',screener:'Screener'}[seg[0]]||'Page');
  $$('.side-nav [data-nav]').forEach(b=>{const on=b.dataset.nav===(seg[0]==='filter'||!seg.length?'radar':seg[0]);b.classList.toggle('active',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});view.scrollTop=0}
addEventListener('hashchange',route);
$$('.side-nav [data-nav]').forEach(b=>b.onclick=()=>go('#/'+b.dataset.nav));
$('[data-act=theme]').onclick=e=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';e.currentTarget.dataset.tip=dark?'Light theme':'Dark theme';route()};
$$('[data-act=soon]').forEach(b=>b.onclick=()=>toast(`${b.getAttribute('aria-label')} is not part of this prototype.`));
route();
})();

</script>
