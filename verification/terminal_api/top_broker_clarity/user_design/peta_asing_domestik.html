<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peta foreign × domestik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* =====================================================================
   EDGE / Market Lab — Design Spec v1  (sumber: EDGE v6, screener.html)
   ---------------------------------------------------------------------
   Cara pakai
   1. Pasang file ini paling awal (sebelum CSS halaman) + font Inter:
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
      <link rel="stylesheet" href="edge-design-spec.css">
   2. Elemen polos (table, button, input, select, h1–h3, a) langsung
      ikut gaya EDGE lewat layer "edge-base".
   3. Komponen siap pakai: .card .btn .seg .tabs .pill .tog .inp .field
      .tbl .kpi .kv .dialog .note .eyebrow .empty .switch
   4. Mode gelap: <html class="dark"> atau <html data-theme="dark">.
   Urutan layer: edge-base < edge-components < edge-utilities, jadi CSS
   halaman (di luar layer) selalu menang tanpa perlu !important.
   ===================================================================== */

@layer edge-tokens, edge-base, edge-components, edge-utilities;

/* ---------------------------------------------------------------------
   1. TOKENS
   --------------------------------------------------------------------- */
@layer edge-tokens {
:root{
  /* Permukaan */
  --bg:#fafafa;            /* latar halaman */
  --surface:#ffffff;       /* kartu, tabel, input */
  --surface-2:#f7f7f7;     /* hover baris tabel, kbd */
  --hover:#f3f3f3;         /* hover tombol/menu */
  --sel:#efefef;           /* item terpilih (seg, tab, pill netral) */
  --border:#eaeaea;        /* semua garis 1px */
  --border-2:#dcdcdc;      /* garis saat hover */

  /* Teks */
  --text:#171717;          /* utama, angka penting */
  --text-2:#4d4d4d;        /* sekunder, label tombol */
  --text-3:#8f8f8f;        /* keterangan, header tabel */

  /* Semantik pasar (IDX: hijau naik, merah turun) */
  --green:#087f5b;  --green-bg:rgba(8,153,129,.10);   /* teks naik / pill positif */
  --red:#d62839;    --red-bg:rgba(242,54,69,.09);     /* teks turun / pill negatif */
  --up:#089981;     --down:#f23645;                  /* candle, bar, garis chart */
  --blue:#0070f3;   --blue-bg:rgba(0,112,243,.08);    /* fokus, link, nilai Custom */
  --amber:#b45309;  --amber-bg:rgba(245,166,35,.14);  /* peringatan */
  --violet:#7928ca; --navy:#17348c;                  /* aksen chart, broker lokal */

  /* Seri chart (urutan tetap) */
  --c1:#0070f3; --c2:#7928ca; --c3:#f5a623; --c4:#089981; --c5:#e5484d; --c6:#17348c;

  /* Tipografi */
  --sans:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  --fs-2xs:10.5px;  /* label kecil uppercase, badge */
  --fs-xs:11px;     /* pill, catatan kecil */
  --fs-sm:11.5px;   /* label field, note */
  --fs-12:12px;     /* tombol kecil, sel tabel padat */
  --fs-md:12.5px;   /* tabel, seg, menu */
  --fs-base:13px;   /* teks body default */
  --fs-lg:14px;     /* judul kartu */
  --fs-xl:15px;     /* judul dialog */
  --fs-2xl:18px;    /* angka KPI besar */
  --fs-3xl:22px;    /* judul halaman (h1) */
  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700;
  --lh-base:1.5; --lh-tight:1.35;
  --ls-caps:.05em;  /* letter-spacing teks uppercase */
  --ls-title:-.01em;

  /* Jarak (kelipatan 2/4) */
  --s-1:2px; --s-2:4px; --s-3:6px; --s-4:8px; --s-5:10px; --s-6:12px;
  --s-7:14px; --s-8:16px; --s-9:20px; --s-10:24px; --s-11:32px;

  /* Radius */
  --r-xs:4px;   /* kbd, input kecil */
  --r-sm:6px;   /* item menu, tombol di dalam seg, ikon kecil */
  --r-md:8px;   /* tombol, input, seg, search */
  --r-lg:10px;  /* popover, kartu kecil */
  --r-xl:12px;  /* kartu / panel */
  --r-2xl:14px; /* dialog */
  --r-pill:999px;

  /* Ukuran kontrol */
  --h-xs:22px;  /* seg kecil */
  --h-sm:28px;  /* tombol kecil */
  --h-md:32px;  /* tombol, input, select, tab */
  --h-th:36px;  /* header tabel */
  --h-row:44px; /* baris tabel normal (padat: 36px) */
  --h-top:52px; /* top bar */

  /* Bayangan & fokus */
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 20px -8px rgba(0,0,0,.22);          /* hover tombol/kartu */
  --shadow-lg:0 12px 40px -12px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.06);   /* popover, dialog */
  --ring:0 0 0 3px var(--blue-bg);

  /* Lapisan */
  --z-sticky:40; --z-pop:60; --z-modal:80; --z-toast:99;
  color-scheme:light;
}
:root.dark,:root[data-theme="dark"]{
  --bg:#0a0a0a; --surface:#111111; --surface-2:#161616; --hover:#1c1c1c; --sel:#232323;
  --border:#262626; --border-2:#333333;
  --text:#ededed; --text-2:#b4b4b4; --text-3:#7c7c7c;
  --green:#3ecf8e; --green-bg:rgba(62,207,142,.12); --red:#ff6369; --red-bg:rgba(255,99,105,.12);
  --blue:#52a8ff; --blue-bg:rgba(82,168,255,.12); --amber:#f5b041; --amber-bg:rgba(245,176,65,.14);
  --violet:#bf7af0; --navy:#7d9bff;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px -8px rgba(0,0,0,.7);
  --shadow-lg:0 16px 48px -12px rgba(0,0,0,.8),0 0 0 1px #2a2a2a;
  color-scheme:dark;
}
}

/* ---------------------------------------------------------------------
   2. BASE — elemen HTML polos langsung bergaya EDGE
   --------------------------------------------------------------------- */
@layer edge-base {
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:var(--fw-regular) var(--fs-base)/var(--lh-base) var(--sans);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1{margin:0;font-size:var(--fs-3xl);font-weight:var(--fw-semibold);letter-spacing:var(--ls-title);line-height:1.25}
h2{margin:0;font-size:var(--fs-xl);font-weight:var(--fw-semibold);line-height:1.3}
h3{margin:0;font-size:var(--fs-lg);font-weight:var(--fw-semibold);line-height:1.35}
p{margin:0}
small{font-size:var(--fs-sm);color:var(--text-3)}
a{color:var(--blue);font-weight:var(--fw-medium);text-decoration:none}
a:hover{text-decoration:underline}
hr{border:0;border-top:1px solid var(--border);margin:var(--s-6) 0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::selection{background:var(--blue-bg)}

/* tombol polos = tombol sekunder */
button{font:inherit;color:inherit;cursor:pointer;height:var(--h-md);padding:0 var(--s-6);border-radius:var(--r-md);
  border:1px solid var(--border);background:var(--surface);font-weight:var(--fw-medium);
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s-3);white-space:nowrap}
button:hover:not(:disabled){border-color:transparent;box-shadow:var(--shadow)}
button:disabled{cursor:not-allowed;opacity:.45}

/* input polos */
input:where([type="text"],[type="number"],[type="search"],[type="email"],[type="password"],[type="date"],:not([type])),select,textarea{
  font:inherit;color:var(--text);height:var(--h-md);min-width:0;border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--surface);padding:0 var(--s-5);font-size:var(--fs-base);outline:none}
textarea{height:auto;padding:var(--s-4) var(--s-5);resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:var(--ring)}
input[type="checkbox"],input[type="radio"],input[type="range"]{accent-color:var(--text)}
label{font-size:var(--fs-sm);color:var(--text-3);font-weight:var(--fw-medium)}

/* tabel polos */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-md);background:var(--surface)}
th{height:var(--h-th);padding:0 var(--s-5);text-align:right;font-weight:var(--fw-medium);color:var(--text-3);
  border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
td{height:var(--h-row);padding:0 var(--s-5);text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:hover td{background:var(--surface-2)}
caption{caption-side:top;text-align:left;padding:0 0 var(--s-4);font-weight:var(--fw-semibold)}
kbd{font:var(--fw-medium) var(--fs-2xs) var(--sans);border:1px solid var(--border);border-radius:var(--r-xs);padding:1px 5px;color:var(--text-3);background:var(--surface-2)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;background:var(--hover);border-radius:var(--r-xs);padding:1px 4px}
}

/* ---------------------------------------------------------------------
   3. KOMPONEN
   --------------------------------------------------------------------- */
@layer edge-components {
/* Kartu / panel: border 1px, radius 12, tanpa bayangan */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);min-width:0}
.card-h{display:flex;align-items:center;gap:var(--s-4);padding:var(--s-7) var(--s-8) var(--s-5)}
.card-h h3,.card-h strong{font-size:var(--fs-lg);font-weight:var(--fw-semibold)}
.card-b{padding:0 var(--s-8) var(--s-8)}
.card-f{display:flex;gap:var(--s-4);justify-content:flex-end;padding:var(--s-6) var(--s-8);border-top:1px solid var(--border)}

/* Teks pendukung */
.eyebrow{display:block;font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--text-3);text-transform:uppercase;letter-spacing:var(--ls-caps)}
.note{font-size:var(--fs-sm);color:var(--text-3);line-height:var(--lh-tight)}

/* Tombol */
.btn{height:var(--h-md);padding:0 var(--s-6);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text);
  font-weight:var(--fw-medium);font-size:var(--fs-base);display:inline-flex;align-items:center;justify-content:center;gap:var(--s-3);white-space:nowrap}
.btn:hover:not(:disabled){border-color:transparent;box-shadow:var(--shadow)}
.btn.primary{background:var(--text);color:var(--surface);border-color:var(--text)}
.btn.ghost{border-color:transparent;background:none;box-shadow:none}
.btn.ghost:hover:not(:disabled){background:var(--hover);box-shadow:none}
.btn.danger{color:var(--red)}
.btn.sm{height:var(--h-sm);padding:0 9px;font-size:var(--fs-12)}
.btn.block{width:100%}
.iconbtn{width:var(--h-md);height:var(--h-md);padding:0;border:0;background:none;border-radius:var(--r-md);display:inline-grid;place-items:center;color:var(--text-2);box-shadow:none}
.iconbtn.sm{width:26px;height:26px;border-radius:var(--r-sm)}
.iconbtn:hover:not(:disabled){background:var(--hover);color:var(--text);box-shadow:none}

/* Segmented control (pilihan 2–5) */
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--border);border-radius:var(--r-md);padding:2px;gap:2px;background:var(--surface)}
.seg button{height:26px;padding:0 var(--s-5);border:0;border-radius:var(--r-sm);background:none;box-shadow:none;font-size:var(--fs-md);font-weight:var(--fw-medium);color:var(--text-2)}
.seg button:hover{color:var(--text);box-shadow:none}
.seg button.on,.seg button[aria-pressed="true"]{background:var(--sel);color:var(--text)}
.seg.sm button{height:var(--h-xs);padding:0 var(--s-4);font-size:var(--fs-sm)}

/* Tabs (navigasi antar-view) */
.tabs{display:flex;flex-wrap:wrap;gap:2px}
.tabs button{height:var(--h-md);padding:0 var(--s-6);border:0;border-radius:7px;background:none;box-shadow:none;font-weight:var(--fw-medium);color:var(--text-2)}
.tabs button:hover{color:var(--text);background:var(--hover);box-shadow:none}
.tabs button.on,.tabs button[aria-selected="true"]{background:var(--sel);color:var(--text)}

/* Pill (status/angka) dan Tog (chip filter yang bisa diklik) */
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 var(--s-4);border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:var(--fw-semibold);background:var(--sel);color:var(--text-2);white-space:nowrap}
.pill.pos{background:var(--green-bg);color:var(--green)}
.pill.neg{background:var(--red-bg);color:var(--red)}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.pill.info{background:var(--blue-bg);color:var(--blue)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tog{height:26px;padding:0 var(--s-5);border-radius:var(--r-pill);border:1px solid var(--border);background:var(--surface);box-shadow:none;font-size:var(--fs-12);font-weight:var(--fw-medium);color:var(--text-2)}
.tog:hover:not(:disabled){border-color:var(--border-2);box-shadow:none;color:var(--text)}
.tog.on,.tog[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--surface)}

/* Field (label + input) */
.field{display:grid;gap:var(--s-2)}
.field>span,.field>label{font-size:var(--fs-sm);color:var(--text-3);font-weight:var(--fw-medium)}
.field small{font-size:var(--fs-2xs);color:var(--text-3)}
.inp,.sel{height:var(--h-md);width:100%;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);padding:0 var(--s-5);font-size:var(--fs-base);outline:none;min-width:0}
.inp.sm,.sel.sm{height:var(--h-sm);font-size:var(--fs-12);padding:0 var(--s-4)}
.inp:focus,.sel:focus{border-color:var(--blue);box-shadow:var(--ring)}
.inp.custom{border-color:var(--blue);color:var(--blue);font-weight:var(--fw-semibold)}  /* nilai ≠ default */

/* Tabel data */
.tbl-wrap{overflow:auto;border-radius:inherit}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-md)}
.tbl th{position:sticky;top:0;z-index:2;height:var(--h-th);padding:0 var(--s-5);background:var(--surface);font-weight:var(--fw-medium);color:var(--text-3);text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl th.sort{cursor:pointer;user-select:none}
.tbl th.sort:hover{color:var(--text)}
.tbl td{height:var(--h-row);padding:0 var(--s-5);text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl th.l,.tbl td.l,.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl.compact td{height:var(--h-th)}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tbody tr.sel td{background:var(--blue-bg)}
.tbl tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--text)}
.tbl .sym{font-weight:var(--fw-semibold);color:var(--text)}
.tbl .sub{display:block;font-size:var(--fs-xs);color:var(--text-3);max-width:200px;overflow:hidden;text-overflow:ellipsis}
.tbl td.miss{color:var(--text-3);background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 7px)}

/* KPI & baris label–nilai */
.kpi{border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s-4) var(--s-5)}
.kpi span{display:block;font-size:var(--fs-xs);color:var(--text-3)}
.kpi b{font-size:var(--fs-lg);font-weight:var(--fw-semibold)}
.kpi.lg b{font-size:var(--fs-2xl)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-4);padding:var(--s-3) 0;font-size:var(--fs-md);color:var(--text-2);border-bottom:1px solid var(--border)}
.kv:last-child{border-bottom:0}
.kv b{color:var(--text);font-weight:var(--fw-medium)}

/* Popover, dialog, toast */
.pop{position:absolute;z-index:var(--z-pop);min-width:220px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:var(--s-3)}
.menu-item{width:100%;height:auto;white-space:normal;line-height:var(--lh-tight);display:flex;align-items:center;gap:var(--s-4);padding:7px var(--s-4);border:0;border-radius:var(--r-sm);background:none;box-shadow:none;font-size:var(--fs-md);font-weight:var(--fw-regular);text-align:left;justify-content:flex-start}
.menu-item:hover{background:var(--hover);box-shadow:none}
.menu-title{font-size:var(--fs-2xs);font-weight:var(--fw-bold);color:var(--text-3);text-transform:uppercase;letter-spacing:var(--ls-caps);padding:var(--s-3) var(--s-4) var(--s-2)}
.backdrop{position:fixed;inset:0;z-index:var(--z-modal);background:rgba(0,0,0,.32);display:grid;place-items:center;padding:var(--s-9)}
.dialog{width:min(520px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-2xl);box-shadow:var(--shadow-lg)}
.dialog-head{padding:var(--s-8) 18px var(--s-6);border-bottom:1px solid var(--border)}
.dialog-head strong{display:block;font-size:var(--fs-xl);font-weight:var(--fw-semibold)}
.dialog-body{padding:var(--s-8) 18px;overflow:auto;display:grid;gap:var(--s-7)}
.dialog-foot{display:flex;justify-content:flex-end;gap:var(--s-4);padding:var(--s-6) 18px;border-top:1px solid var(--border)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:var(--z-toast);background:var(--text);color:var(--surface);border-radius:var(--r-pill);padding:var(--s-4) var(--s-7);font-size:var(--fs-md);box-shadow:var(--shadow-lg)}

/* Lain-lain */
.switch{position:relative;width:32px;height:18px;padding:0;border:0;border-radius:var(--r-pill);background:var(--border-2);box-shadow:none;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.15s}
.switch.on{background:var(--text)} .switch.on::after{left:16px}
.empty{padding:36px var(--s-9);text-align:center;color:var(--text-3)}
.empty strong{display:block;color:var(--text);font-size:var(--fs-lg);margin-bottom:var(--s-2)}
}

/* ---------------------------------------------------------------------
   4. UTILITAS
   --------------------------------------------------------------------- */
@layer edge-utilities {
.up{color:var(--green)} .down{color:var(--red)} .muted{color:var(--text-3)} .strong{color:var(--text);font-weight:var(--fw-semibold)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.custom-val{color:var(--blue);font-weight:var(--fw-semibold)}  /* parameter yang diubah dari default */
.row{display:flex;align-items:center;gap:var(--s-4)} .stack{display:grid;gap:var(--s-4)} .grow{flex:1;min-width:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
}

</style>
<style>
/* ---- halaman (di luar layer, menang atas spec) ---- */
:root{--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
header.top{position:sticky;top:0;z-index:var(--z-sticky);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--s-8)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-5) var(--s-9);min-height:var(--h-top)}
header.top h1{font-size:var(--fs-xl)}
.intro{margin:var(--s-9) 0 var(--s-3);display:grid;gap:var(--s-5)}
.box{padding:var(--s-6) var(--s-7)}
.box h2{font-size:var(--fs-base);margin:0 0 var(--s-3)}
.box p{margin:var(--s-2) 0;color:var(--text-2)}
.box p b{color:var(--text)}
.toc{display:flex;flex-wrap:wrap;gap:var(--s-3)}
.toc a{font-size:var(--fs-12);color:var(--text);border:1px solid var(--border);border-radius:var(--r-pill);padding:2px 9px;background:var(--surface);font-weight:var(--fw-medium)}
.toc a:hover{background:var(--hover);text-decoration:none}
.opt{display:grid;grid-template-columns:332px 1fr;gap:var(--s-9);align-items:start;margin:var(--s-9) 0;scroll-margin-top:70px}
@media (max-width:760px){.opt{grid-template-columns:1fr}}
.about h3{margin:2px 0 var(--s-3);font-size:var(--fs-xl)}
.about .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:var(--r-sm);background:var(--text);color:var(--surface);font-size:var(--fs-12);margin-right:var(--s-4);vertical-align:1px}
.about p{color:var(--text-2)}
.about ul{margin:var(--s-3) 0;padding-left:18px}.about li{margin:2px 0;color:var(--text-2)}
.about .pro b{color:var(--green)}.about .con b{color:var(--red)}
.about .ex{margin-top:var(--s-4);font-size:var(--fs-sm);color:var(--text-3)}

/* panel tiruan (panel kanan Terminal) */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s-5) var(--s-6) var(--s-6);width:332px;max-width:100%}
.head{display:flex;align-items:center;gap:var(--s-4);margin-bottom:var(--s-3)}
.head strong{font-size:var(--fs-base)}.head small{margin-left:auto;font-size:var(--fs-xs);white-space:nowrap}
.ctl{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;margin:0 0 var(--s-3)}
.ctl .r{margin-left:auto}
.rp-sel{height:26px;font-size:var(--fs-sm);padding:0 4px;border-radius:var(--r-sm)}
.seg button:disabled{opacity:.45}
.pill.big.pos{background:var(--up);color:#fff}.pill.big.neg{background:var(--down);color:#fff}
.pill.sq{border-radius:var(--r-xs);height:16px;padding:0 4px;font-size:9.5px;letter-spacing:.02em}
.sub{font-size:var(--fs-xs);color:var(--text-3)}
.line{display:flex;justify-content:space-between;align-items:center;gap:var(--s-4);font-size:var(--fs-sm);padding:2px 0}
.line>span:first-child{color:var(--text-3)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.hr{border-top:1px solid var(--border);margin:var(--s-4) 0}
.cut{border-top:1px dashed var(--border-2);margin:3px 0}

/* tarik tambang */
.tug{display:flex;height:18px;border-radius:var(--r-xs);overflow:hidden;margin:var(--s-3) 0 3px;gap:0}
.tug i{display:flex;align-items:center;font-style:normal;font-size:10px;color:#fff;padding:0 5px;white-space:nowrap;overflow:hidden;min-width:0}
.tug i.b{background:var(--up)}.tug i.s{background:var(--down);justify-content:flex-end}
.tug i.f{opacity:.45;color:var(--text)}
.tug.thin{height:10px;margin:2px 0}
.tug.thin i{font-size:0;padding:0}
.mid{width:2px;background:var(--surface);flex:0 0 2px}

/* tabel Top brokers */
.pa-head,.pa-row{display:grid;grid-template-columns:minmax(40px,auto) minmax(44px,auto) 1fr 1fr minmax(44px,auto) minmax(40px,auto);align-items:center;column-gap:6px}
.pa-head{padding:var(--s-3) 0 5px;font-size:var(--fs-xs);color:var(--text-3);border-bottom:1px solid var(--border);margin-bottom:3px;white-space:nowrap}
.pa-head .l{grid-column:1/4;display:flex;align-items:center;gap:6px}.pa-head .r{grid-column:4/7;display:flex;align-items:center;justify-content:flex-end;gap:6px}
.pa-head i{width:8px;height:8px;border-radius:2px}.pa-head i.up{background:var(--up)}.pa-head i.down{background:var(--down)}
.pa-row{height:22px;font-size:var(--fs-sm);border-radius:var(--r-xs)}
.pa-row .v{font-variant-numeric:tabular-nums;white-space:nowrap}.pa-row .v.up{text-align:right}
.pa-row .b{font-family:var(--mono);font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.pa-row .b.rt{justify-content:flex-end}
.trk{position:relative;height:8px;background:var(--hover);border-radius:2px;overflow:hidden}
.fill{position:absolute;top:0;bottom:0;display:flex}
.trk.buy .fill{right:0;flex-direction:row-reverse}.trk.sell .fill{left:0}
.fill i{display:block;height:100%}.trk.buy .fill i{background:var(--up)}.trk.sell .fill i{background:var(--down)}.fill i.f{opacity:.42}
.pa-row.inn{background:linear-gradient(90deg,rgba(8,153,129,.07),transparent 45%,transparent 55%,rgba(242,54,69,.07))}
.pa-row.dim{opacity:.38}
.leg{display:flex;flex-wrap:wrap;gap:var(--s-6);font-size:var(--fs-xs);color:var(--text-3);margin-top:var(--s-4);padding-top:7px;border-top:1px solid var(--border)}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg i{width:14px;height:7px;border-radius:2px;display:inline-block;background:linear-gradient(90deg,var(--up) 50%,var(--down) 50%)}.leg i.f{opacity:.42}

/* bagian opsi */
.lane{display:grid;grid-template-columns:58px 1fr 54px;gap:var(--s-3);align-items:center;font-size:var(--fs-sm);margin:3px 0}
.lane .nm{color:var(--text-2)}.lane .nv{text-align:right}
.div{position:relative;height:12px;background:var(--surface-2);border-radius:2px}
.div .z{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--text-3)}
.div .t{position:absolute;top:-1px;bottom:-1px;width:0;border-left:1px dashed var(--border-2)}
.div i{position:absolute;top:2px;bottom:2px;border-radius:2px}
.div i.p{background:var(--up)}.div i.n{background:var(--down)}.div i.f{opacity:.45}
.div.tot i{top:0;bottom:0}
.mx{display:grid;grid-template-columns:62px 1fr 1fr 1fr;font-size:var(--fs-sm);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;margin:var(--s-3) 0 var(--s-4)}
.mx>div{padding:5px 7px;border-bottom:1px solid var(--border);text-align:right}
.mx>div:nth-child(4n+1){text-align:left;color:var(--text-2)}
.mx>.h{font-size:var(--fs-2xs);color:var(--text-3);font-weight:var(--fw-semibold);text-transform:uppercase;letter-spacing:var(--ls-caps);background:var(--surface-2)}
.mx>.t{font-weight:var(--fw-semibold);border-bottom:0}
.mx>.w{background:var(--amber-bg);color:var(--amber)}
.quad{display:grid;grid-template-columns:auto 1fr 1fr;gap:3px;font-size:var(--fs-2xs);margin:var(--s-3) 0 var(--s-4);align-items:stretch}
.quad>span{color:var(--text-3);display:grid;place-items:center;padding:0 4px}
.quad>div{border:1px solid var(--border);border-radius:var(--r-xs);padding:5px 6px;color:var(--text-3);line-height:1.3;min-height:34px}
.quad>div.on{border-color:var(--text);color:var(--text);box-shadow:inset 0 0 0 1px var(--text);font-weight:var(--fw-semibold)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3);margin:var(--s-3) 0 var(--s-4)}
.kpi{padding:var(--s-3) var(--s-4)}
.kpi b{display:block;font-size:var(--fs-lg)}
.kpi em{font-style:normal;font-size:var(--fs-xs);color:var(--text-3)}
.story{font-size:var(--fs-md);line-height:1.5;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s-4) var(--s-5);margin:var(--s-3) 0 var(--s-4)}
.story b{color:var(--text);font-weight:var(--fw-semibold)}
.comp{display:grid;grid-template-columns:36px 1fr 86px;gap:var(--s-3);align-items:center;font-size:var(--fs-sm);margin:4px 0}
.bar100{display:flex;height:12px;border-radius:2px;overflow:hidden;background:var(--surface-2)}
.bar100 i{display:block;height:100%}
.off{grid-column:2/4;font-size:var(--fs-xs);color:var(--amber);margin:-2px 0 2px}
.approx{color:var(--amber);font-weight:var(--fw-semibold)}
.solo{padding:24px}
/* peta asing × domestik */
.qsec{margin:var(--s-5) 0 var(--s-3);padding-top:var(--s-5);border-top:1px solid var(--border)}
.qsec .qh{display:flex;align-items:center;gap:var(--s-3);margin-bottom:var(--s-3)}
.qsec .qh strong{font-size:var(--fs-12)}.qsec .qh small{margin-left:auto;font-size:var(--fs-2xs);color:var(--text-3);white-space:nowrap}
.qwrap{position:relative;padding:14px 0 0}
.qsvg{display:block;width:100%;height:auto;font-family:var(--sans)}
.qax{position:absolute;top:0;left:0;font-size:var(--fs-2xs);color:var(--text-3)}.qax b{font-weight:var(--fw-medium)}
.qxr{display:flex;justify-content:space-between;font-size:var(--fs-2xs);color:var(--text-3);margin-top:2px}

.qeq{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;text-align:center;gap:2px;font-size:var(--fs-sm);margin:var(--s-3) 0;border:1px solid var(--border);border-radius:var(--r-md);padding:5px 4px}
.qeq span{font-size:var(--fs-2xs);color:var(--text-3);display:block}
.qeq b{font-weight:var(--fw-semibold)}
.qeq i{font-style:normal;color:var(--text-3)}
.qkey{display:flex;flex-wrap:wrap;gap:var(--s-2) var(--s-5);font-size:var(--fs-2xs);color:var(--text-3);margin-top:var(--s-2)}
.qkey span{display:inline-flex;align-items:center;gap:4px}
.qkey i{display:inline-block;border-radius:50%;background:var(--text)}
.top3{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3);margin:var(--s-3) 0}
.top3 .card{padding:var(--s-3) var(--s-4);border-radius:var(--r-md)}
.top3 .card>div{display:flex;justify-content:space-between;font-size:var(--fs-sm);padding:1px 0}
.top3 .card>div b{font-family:var(--mono);font-size:11px}
.top3 .eyebrow{margin-bottom:2px;font-size:var(--fs-2xs)}

.pill.qnow{background:var(--blue);color:#fff}
.qat{font-size:9.5px;fill:var(--text-2);font-weight:600}
.qtk{font-size:8.5px;fill:var(--text-3)}
.qdef{font-size:var(--fs-xs);color:var(--text-3);margin:var(--s-2) 0 0;line-height:1.4}
.qtbl{margin:var(--s-3) 0 var(--s-4);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.qrow{display:grid;grid-template-columns:48px 1fr 1fr 1fr 22px;align-items:center;font-size:var(--fs-sm);padding:4px 8px;border-bottom:1px solid var(--border);text-align:right}
.qrow:last-child{border-bottom:0}.qrow>span:first-child{text-align:left;color:var(--text-2)}
.qrow.h{font-size:var(--fs-2xs);color:var(--text-3);font-weight:var(--fw-semibold);background:var(--surface-2)}
.qrow.on{background:var(--surface-2);font-weight:var(--fw-semibold)}.qrow.on>span:first-child{color:var(--text)}
.pill.dotp{height:14px;width:14px;padding:0;justify-content:center}
.foot{margin:var(--s-11) 0 40px;font-size:var(--fs-12)}

const TICKERS = Object.keys(DATA);
let T = TICKERS.includes('BBRI') ? 'BBRI' : TICKERS[0];
const fmt = (v, sign = true) => { const a = Math.abs(v), s = v < 0 ? '−' : sign && v > 0 ? '+' : '';
  const [d, u] = a >= 1e12 ? [a / 1e12, 'T'] : a >= 1e9 ? [a / 1e9, 'B'] : a >= 1e6 ? [a / 1e6, 'M'] : [a / 1e3, 'K'];
  return s + (Math.round(d * 10) / 10).toLocaleString('en-US') + u };
const pct = (v, dp = 2) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(dp) + '%';
const share = (p, t) => t ? p / t * 100 : 0;
const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : 'muted';
const D = st => DATA[T][st.d];

/* agregat domestik/asing untuk Top N, dihitung dari baris broker (berlaku untuk ticker mana pun) */
function A(st) {
  const x = D(st), n = +st.n, b = x.buy.slice(0, n), s = x.sell.slice(0, n), bd = x.bd[st.n];
  const sum = (a, k) => a.reduce((t, r) => t + r[k], 0);
  const buy = { t: sum(b, 'net'), d: sum(b, 'd'), f: sum(b, 'f') };
  const sell = { t: -sum(s, 'net'), d: -sum(s, 'd'), f: -sum(s, 'f') };     // positif = menjual
  const net = { t: buy.t - sell.t, d: buy.d - sell.d, f: buy.f - sell.f };
  const tb = bd.ratio ? Math.abs(bd.net / (bd.ratio / 100)) : 0;             // total nilai beli (penyebut vonis)
  return { x, n, b, s, bd, buy, sell, net, tb, ratio: bd.ratio, rd: tb ? net.d / tb * 100 : 0, rf: tb ? net.f / tb * 100 : 0,
    approx: [...b, ...s].some(r => !r.exact) };
}
const verdictOf = r => r >= 10 ? ['Big Acc', 'pos big'] : r >= 6 ? ['Acc', 'pos'] : r <= -10 ? ['Big Dist', 'neg big'] : r <= -6 ? ['Dist', 'neg'] : ['Neutral', ''];
const vpill = bd => { const big = /Big/.test(bd.v); return `<span class="pill ${bd.cls === 'acc' ? 'pos' : bd.cls === 'dist' ? 'neg' : ''}${big ? ' big' : ''}">${bd.v}</span>` };
const vpillR = r => { const [v, c] = verdictOf(r); return `<span class="pill ${c}">${v}</span>` };
const ax = a => a.approx ? ' <span class="approx" title="Sebagian bagian asing diperkirakan dari daftar 10 besar Foreign">≈</span>' : '';

/* kontrol */
const seg = (k, st, items, small) => `<div class="seg${small ? ' sm' : ''}" data-k="${k}">${items.map(([v, l, dis]) => `<button data-v="${v}" class="${String(st[k]) === String(v) ? 'on' : ''}"${dis ? ' disabled title="Tidak aktif di contoh"' : ''}>${l}</button>`).join('')}</div>`;
const period = st => seg('d', st, [['1', '1D'], ['5', '5D'], ['20', '20D'], ['c', 'Custom', 1]], 1);
const topN = st => seg('n', st, [['3', 'Top 3'], ['5', 'Top 5'], ['10', 'Top 10']], 1);
const board = '<select class="rp-sel" disabled title="Contoh memakai All boards"><option>All boards</option></select>';
const head = (st, extra = '') => `<div class="head"><strong>Top brokers</strong>${extra}<small>${D(st).range} · net</small></div>
  <div class="ctl">${period(st)}${board}</div>`;
const ctlN = (st, a, extra = '') => `<div class="ctl">${topN(st)}${vpill(a.bd)}<span class="sub num r">${pct(a.ratio)}</span>${extra}</div>`;

/* tarik tambang dasar (opsi 10) */
const tugBase = a => { const b = share(a.buy.t, a.buy.t + a.sell.t);

/* Peta dengan sumbu X dan Y berlabel (menggantikan quadSVG) */
function quadSVG(o) {
  const S = 236, L = o.lim, ML = 40, MT = 8, MR = 16, MB = 34, W = ML + S + MR, H = MT + S + MB;
  const P = v => (Math.max(-L, Math.min(L, v)) + L) / (2 * L) * S, X = P, Y = v => S - P(v), out = v => Math.abs(v) > L;
  const ticks = [-L, -L / 2, 0, L / 2, L], tl = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v) + '%';
  let g = `<svg class="qsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Peta kontribusi foreign (X) terhadap domestik (Y)">
    <defs><clipPath id="qc"><rect x="0" y="0" width="${S}" height="${S}" rx="6"/></clipPath></defs>`;
  /* sumbu Y */
  g += `<text class="qat" transform="translate(10 ${MT + S / 2}) rotate(-90)" text-anchor="middle">Y · Domestik (% total beli)</text>`;
  ticks.forEach(v => g += `<text class="qtk" x="${ML - 5}" y="${MT + Y(v) + 3}" text-anchor="end">${tl(v)}</text>`);
  /* sumbu X */
  ticks.forEach(v => g += `<text class="qtk" x="${ML + X(v)}" y="${MT + S + 12}" text-anchor="middle">${tl(v)}</text>`);
  g += `<text class="qat" x="${ML + S / 2}" y="${MT + S + 28}" text-anchor="middle">X · Foreign (% total beli)</text>`;
  g += `<g transform="translate(${ML} ${MT})"><g clip-path="url(#qc)"><rect x="0" y="0" width="${S}" height="${S}" fill="var(--surface)"/>`;
  g += `<rect x="${S / 2}" y="0" width="${S / 2}" height="${S / 2}" fill="var(--green-bg)"/><rect x="0" y="${S / 2}" width="${S / 2}" height="${S / 2}" fill="var(--red-bg)"/>`;
  ticks.filter(v => v && Math.abs(v) !== L).forEach(v => g += `<line x1="${X(v)}" y1="0" x2="${X(v)}" y2="${S}" stroke="var(--border)" stroke-dasharray="1 3"/><line x1="0" y1="${Y(v)}" x2="${S}" y2="${Y(v)}" stroke="var(--border)" stroke-dasharray="1 3"/>`);
  if (o.diag) [6, 10, -6, -10].forEach(c => g += `<line x1="${X(-L) - S}" y1="${Y(c + L) - S}" x2="${X(L) + S}" y2="${Y(c - L) + S}" stroke="${c > 0 ? 'var(--green)' : 'var(--red)'}" stroke-dasharray="${Math.abs(c) === 10 ? '' : '3 3'}" opacity=".5"/>`);
  g += `<line x1="${S / 2}" y1="0" x2="${S / 2}" y2="${S}" stroke="var(--text-3)" opacity=".6"/><line x1="0" y1="${S / 2}" x2="${S}" y2="${S / 2}" stroke="var(--text-3)" opacity=".6"/>`;
  const ql = (x, y, a, t) => `<text x="${x}" y="${y}" class="ql" text-anchor="${a}" paint-order="stroke" stroke="var(--surface)" stroke-width="3">${t}</text>`;
  g += ql(S - 6, 12, 'end', 'Searah akumulasi') + ql(6, 12, 'start', 'Dom. serap · foreign keluar') + ql(S - 6, S - 6, 'end', 'Foreign serap · dom. keluar') + ql(6, S - 6, 'start', 'Searah distribusi');
  const pts = o.pts, tp = pts.filter(p => !p.noTrail);
  if (o.trail && tp.length > 1) g += `<polyline points="${tp.map(p => `${X(p.x)},${Y(p.y)}`).join(' ')}" fill="none" stroke="var(--text-3)" stroke-width="1" opacity=".8"/>`;
  pts.forEach(p => { const cx = X(p.x), cy = Y(p.y), r = p.cur ? 6 : 4, hollow = out(p.x) || out(p.y);
    g += `<g><title>${p.tip || ''}</title>${p.cur ? `<circle cx="${cx}" cy="${cy}" r="11" fill="var(--text)" opacity=".12"/>` : ''}<circle cx="${cx}" cy="${cy}" r="${r}" fill="${hollow ? 'var(--surface)' : 'var(--text)'}" stroke="var(--text)" stroke-width="${hollow ? 1.2 : 0}"/></g>`;
    if (p.lab) g += `<text x="${cx + (cx > S - 40 ? -10 : 10)}" y="${cy + 3.5}" class="qp${p.cur ? ' cur' : ''}" text-anchor="${cx > S - 40 ? 'end' : 'start'}" paint-order="stroke" stroke="var(--surface)" stroke-width="3">${p.lab}</text>` });
  g += `</g><rect x="0" y="0" width="${S}" height="${S}" rx="6" fill="none" stroke="var(--border)"/></g></svg>`;
  return `<div class="qwrap">${g}</div>`;
}

/* Panel: hanya kuadran */
function renderQuad(st) {
  const P = ['20', '5', '1'].map(d => { const a = A({ d, n: st.n }); return { d, x: a.rf, y: a.rd, r: a.ratio, bd: a.bd } });
  const cur = P.find(p => p.d === st.d) || P[1], lim = niceLim(P.flatMap(p => [p.x, p.y, p.r]), 12);
  const pts = P.map(p => ({ x: p.x, y: p.y, lab: p.d + 'D', cur: p.d === cur.d, tip: `${p.d}D · X foreign ${pct(p.x, 1)} · Y domestik ${pct(p.y, 1)} · verdict ${pct(p.r, 1)}` }));
  const q = QN.pp(cur.x, cur.y), same = P.filter(p => QN.pp(p.x, p.y) === q).length;
  const q1 = QN.pp(P[2].x, P[2].y), q20 = QN.pp(P[0].x, P[0].y);
  const dom = Math.abs(cur.y) >= Math.abs(cur.x) ? ['Domestik', cur.y] : ['Foreign', cur.x];
  const row = p => `<div class="qrow${p.d === cur.d ? ' on' : ''}"><span>${p.d}D</span><span class="num ${cls(p.x)}">${pct(p.x, 1)}</span><span class="num ${cls(p.y)}">${pct(p.y, 1)}</span><span class="num ${cls(p.r)}">${pct(p.r, 1)}</span><span><span class="pill ${QN.cls[QN.pp(p.x, p.y)]} dotp" title="${QN.name[QN.pp(p.x, p.y)]}"><i class="dot"></i></span></span></div>`;
  return `<div class="head"><strong>Peta foreign × domestik</strong><small>${D(st).range}</small></div>
    <div class="ctl">${seg('d', st, [['1', '1D'], ['5', '5D'], ['20', '20D'], ['c', 'Custom', 1]], 1)}${seg('n', st, [['3', 'Top 3'], ['5', 'Top 5'], ['10', 'Top 10']], 1)}</div>
    <div class="ctl"><span class="pill qnow">${QN.name[q]}</span>${vpill(cur.bd)}</div>
    ${quadSVG({ lim, pts, trail: 1, diag: 1 })}
    <div class="qeq"><div><span>X · Foreign</span><b class="${cls(cur.x)}">${pct(cur.x, 1)}</b></div><i>+</i><div><span>Y · Domestik</span><b class="${cls(cur.y)}">${pct(cur.y, 1)}</b></div><i>=</i><div><span>Verdict ${cur.d}D</span><b class="${cls(cur.r)}">${pct(cur.r, 1)}</b></div></div>
    <div class="qtbl"><div class="qrow h"><span>Periode</span><span>X foreign</span><span>Y dom.</span><span>Verdict</span><span></span></div>${P.slice().reverse().map(row).join('')}</div>` }

 { name: 'Kartu Net Domestik dan Net Asing', what: 'Dua kartu KPI di atas: Net domestik Top N dan Net asing Top N (beli Top N − jual Top N), masing-masing dengan kontribusi rasionya. Tarik tambang opsi 10 tetap ada di bawahnya.',
   pro: ['Angka yang paling sering dicari trader ("asing net buy/sell berapa") tampil paling besar', 'Mudah dijadikan kolom di watchlist'], con: ['Tidak menunjukkan berapa yang datang dari sisi beli dan berapa dari sisi jual'],
   ex: 'BBCA 5D: Net asing −1.4T walaupun vonisnya Neutral.',
   render: st => { const a = A(st), k = (t, v, r) => `<div class="kpi"><span>${t}</span><b class="num ${cls(v)}">${fmt(v)}</b><em class="num">${pct(r, 1)} dari total beli</em></div>`;
     return `${head(st)}${ctlN(st, a)}<div class="kpis">${k('Net domestik Top ' + st.n, a.net.d, a.rd)}${k('Net asing Top ' + st.n, a.net.f, a.rf)}</div>
     ${tugBase(a)}<div class="sub" style="margin-bottom:6px">Net total ${fmt(a.net.t)} = domestik ${fmt(a.net.d)} + asing ${fmt(a.net.f)}${ax(a)}</div>${table(st)}` } },

 { name: 'Kalimat ringkas otomatis', what: 'Satu atau dua kalimat yang disusun otomatis dari angka yang sama: siapa yang membentuk akumulasi, apakah ada golongan yang berlawanan, dan di broker mana. Tarik tambang terbelah ada di bawahnya.',
   pro: ['Paling mudah dipahami pengguna baru', 'Kalimat yang sama bisa dipakai untuk AI chat atau notifikasi'], con: ['Lebih panjang untuk dibaca berulang kali', 'Aturan kalimat perlu dijaga agar tidak menyesatkan'],
   ex: 'Ganti ticker untuk melihat kalimat berubah: ASII 20D, BBCA 20D, MAPI 20D.',
   render: st => { const a = A(st), side = a.net.t >= 0 ? 'buy' : 'sell', o = a[side], word = side === 'buy' ? 'Akumulasi' : 'Distribusi';
     const pd = share(o.d, o.t), pf = share(o.f, o.t), lead = Math.abs(pd) >= Math.abs(pf) ? 'domestik' : 'asing';
     const rows = side === 'buy' ? a.b : a.s, sg = side === 'buy' ? 1 : -1;
     const opp = rows.flatMap(r => [['domestik', r.d], ['asing', r.f]].filter(([, v]) => v * sg < 0 && Math.abs(v) >= Math.abs(o.t) * .01).map(([k, v]) => `${r.b} (${k} ${fmt(v)})`));
     const mix = Math.min(Math.abs(pd), Math.abs(pf)) >= 30 ? `dari investor domestik (${fmt(o.d * sg, false)}, ${Math.round(pd)}%) dan asing (${fmt(o.f * sg, false)}, ${Math.round(pf)}%)`
       : `terutama dari investor <b>${lead}</b> (${fmt((lead === 'domestik' ? o.d : o.f) * sg, false)}, ${Math.round(lead === 'domestik' ? pd : pf)}%)`;
     return `${head(st)}${ctlN(st, a)}
     <div class="story"><b>${word} Top ${st.n} ${fmt(o.t, false)}</b> berasal ${mix}.
       ${opp.length ? `Arah berlawanan di: ${opp.join(', ')}.` : 'Tidak ada golongan yang berlawanan arah.'}
       Secara keseluruhan, Net domestik <b class="${cls(a.net.d)}">${fmt(a.net.d)}</b>, Net asing <b class="${cls(a.net.f)}">${fmt(a.net.f)}</b>.${a.approx ? ' <span class="approx">Sebagian bagian asing diperkirakan.</span>' : ''}</div>
     ${tugSplit(a)}${table(st)}` } },
];

OPTS[1].no = 2; OPTS.splice(0, OPTS.length, OPTS[1]);
OPTS[0].render = renderQuad;
const st = { d: '5', n: '3' };
function render() {
  const el = document.getElementById('panel');
  el.innerHTML = OPTS[0].render(st);
  el.querySelectorAll('[data-k]').forEach(g => g.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
    if (b.disabled) return; st[g.dataset.k] = b.dataset.v; render() }));
}
render();
</script>
</body></html>
