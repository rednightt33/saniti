<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foreign × Domestic map</title>
<style>
:root{--bg:#f4f4f5;--surface:#fff;--border:#eaeaea;--text:#171717;--text-2:#666;--text-3:#999;--sel:#f2f2f2;--up:#089981;--down:#f23645;
 --up-soft:#e3f5ef;--down-soft:#fde8ea;--fx:#0070f3;--fx-soft:#e6f0fe;--dm:#d97706;--dm-soft:#fef3e0;--sans:"Inter","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f10;--surface:#18181a;--border:#2a2a2d;--text:#ededed;--text-2:#a1a1a1;--text-3:#707070;--sel:#26262a;--up-soft:#0d2e27;--down-soft:#3a1519;--fx-soft:#0b2240;--dm-soft:#3a2a0b}}
:root[data-theme="dark"]{--bg:#0f0f10;--surface:#18181a;--border:#2a2a2d;--text:#ededed;--text-2:#a1a1a1;--text-3:#707070;--sel:#26262a;--up-soft:#0d2e27;--down-soft:#3a1519;--fx-soft:#0b2240;--dm-soft:#3a2a0b}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--text);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.scroll{overflow-x:auto;padding:4px 2px 10px}
.win{width:860px;max-width:100%;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,.12);overflow:hidden}
.wh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)}
.wh strong{font-size:14px;white-space:nowrap}
.wh small{color:var(--text-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh .ic{margin-left:auto;display:flex;gap:12px;color:var(--text-2);font-size:14px}
.wb{padding:12px 14px 14px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;padding:2px;gap:2px}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;height:24px;line-height:24px;padding:0 10px;border-radius:4px;font-size:12px;font-weight:500;color:var(--text-2)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--sel);color:var(--text)}
.seg button:focus-visible{outline:2px solid var(--fx);outline-offset:1px}
.sel{height:30px;line-height:28px;border:1px solid var(--border);border-radius:6px;padding:0 26px 0 10px;font-size:12px;position:relative;margin-left:auto}
.sel::after{content:'▾';position:absolute;right:9px;color:var(--text-2)}
.grid2{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.up{color:var(--up)}.down{color:var(--down)}.fx{color:var(--fx)}.dm{color:var(--dm)}
.tview{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.tview .lbl{font-size:11px;color:var(--text-3)}
.tbox{max-height:432px;overflow-y:auto}
table.t{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:5px 6px;border-top:1px solid var(--border);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--text-3);font-weight:500;font-size:11px;border-top:0;position:sticky;top:0;background:var(--surface)}
table.t tr.cur td{background:var(--sel);font-weight:600}
table.t tr.hl td{background:var(--sel)}
.tag{display:inline-block;padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:600}
.tag.fx{background:var(--fx-soft);color:var(--fx)}.tag.dm{background:var(--dm-soft);color:var(--dm)}
.cap{font-size:11px;color:var(--text-3);margin:6px 0 0}
svg text{font-family:var(--sans)}
</style>
</head>
<body>
<div class="scroll"><div class="win" id="win">
  <div class="wh"><strong>Foreign × Domestic map</strong><small id="sub"></small><span class="ic">📌 ↘ ✕</span></div>
  <div class="wb">
    <div class="ctl">
      <div class="seg" aria-label="Period"><button type="button">1D</button><button type="button" class="on">5D</button><button type="button">20D</button><button type="button">Custom</button></div>
      <div class="seg" aria-label="Top N"><button type="button" class="on">Top 3</button><button type="button">Top 5</button><button type="button">Top 10</button></div>
      <div class="seg" id="spanSeg" aria-label="Sessions"><button type="button" data-n="5">5</button><button type="button" data-n="10">10</button><button type="button" data-n="20" class="on">20 sessions</button></div>
      <div class="seg" id="viewSeg" aria-label="Table view"><button type="button" data-v="level" class="on">Level</button><button type="button" data-v="delta">Change (Δ)</button></div>
      <span class="sel">Regular</span>
    </div>
    <div class="grid2">
      <div id="mapBox"></div>
      <div>
        
        <div class="tbox" id="tbox"></div>
        <p class="cap" id="cap"></p>
      </div>
    </div>
  </div>
</div></div>

<script id="data" type="application/json">{"ticker":"BBRI","board":"Regular","n":3,"trail":[{"d":"2026-10-07","x":-5.53,"y":0.08,"r":-5.46,"q":1,"v":"Neutral","total":2073056444000},{"d":"2026-10-08","x":-13.85,"y":6.88,"r":-6.97,"q":1,"v":"Dist","total":2119766322000},{"d":"2026-10-09","x":-12.86,"y":5.25,"r":-7.61,"q":1,"v":"Dist","total":2075299317000},{"d":"2026-10-12","x":-6.07,"y":5.01,"r":-1.06,"q":1,"v":"Neutral","total":2059816395000},{"d":"2026-10-13","x":-7.18,"y":3.33,"r":-3.85,"q":1,"v":"Neutral","total":1934929127000},{"d":"2026-10-14","x":-15.78,"y":9.12,"r":-6.66,"q":1,"v":"Dist","total":1995459101000},{"d":"2026-10-15","x":-3.47,"y":0.87,"r":-2.6,"q":1,"v":"Neutral","total":1863041713000},{"d":"2026-10-16","x":-24.25,"y":8.02,"r":-16.23,"q":1,"v":"Big Dist","total":4618555266000},{"d":"2026-10-19","x":-31.25,"y":11.66,"r":-19.59,"q":1,"v":"Big Dist","total":7603741932000},{"d":"2026-10-20","x":-28.53,"y":11.08,"r":-17.46,"q":1,"v":"Big Dist","total":9165762117000},{"d":"2026-10-21","x":-26.89,"y":11.42,"r":-15.47,"q":1,"v":"Big Dist","total":10201656639000},{"d":"2026-10-22","x":-24.36,"y":12.06,"r":-12.3,"q":1,"v":"Big Dist","total":11381583091000},{"d":"2026-10-23","x":-21.71,"y":17.13,"r":-4.59,"q":1,"v":"Neutral","total":9188248332000},{"d":"2026-10-26","x":-14.01,"y":24.09,"r":10.08,"q":1,"v":"Big Acc","total":6529681653000},{"d":"2026-10-27","x":-9.3,"y":24.61,"r":15.3,"q":1,"v":"Big Acc","total":5884642051000},{"d":"2026-10-28","x":-10.13,"y":23.32,"r":13.18,"q":1,"v":"Big Acc","total":5427613960000},{"d":"2026-10-29","x":-9.62,"y":17.17,"r":7.56,"q":1,"v":"Acc","total":4556231087000},{"d":"2026-10-30","x":-9.21,"y":7.38,"r":-1.83,"q":1,"v":"Neutral","total":4440260926000},{"d":"2026-11-02","x":-7.43,"y":4.75,"r":-2.68,"q":1,"v":"Neutral","total":4214059890000},{"d":"2026-11-03","x":-15.6,"y":9.23,"r":-6.37,"q":1,"v":"Dist","total":3842621514000}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent), T_ALL = D.trail;
const pc = (v, d = 1) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d) + '%';
const pt = (v, d = 1) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d) + ' pt';
const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : '';
const day = d => new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', { day:'2-digit', month:'short', timeZone:'UTC' });
const lim = 35;
// Verdict = Foreign + Domestic, so each session's change in Verdict = change in Foreign + change in Domestic
const driver = s => Math.abs(s.dx) >= Math.abs(s.dy) ? 'fx' : 'dm';
const tag = s => `<span class="tag ${driver(s)}">${driver(s) === 'fx' ? 'Foreign' : 'Domestic'}</span>`;

const state = { n: 20, view: 'level', hover: -1 };

function map(T) {
  const S = 270, P = 38, sx = v => P + (v + lim) / (2 * lim) * S, sy = v => P + (lim - v) / (2 * lim) * S;
  let g = `<svg viewBox="0 0 ${S + P * 2} ${S + P * 2}" width="100%" role="img" aria-label="Foreign by Domestic map with rolling 5D trail">`;
  g += `<rect x="${P + S / 2}" y="${P}" width="${S / 2}" height="${S / 2}" fill="var(--up-soft)" opacity=".7"/><rect x="${P}" y="${P + S / 2}" width="${S / 2}" height="${S / 2}" fill="var(--down-soft)" opacity=".7"/><rect x="${P}" y="${P}" width="${S}" height="${S}" rx="6" fill="none" stroke="var(--border)"/>`;
  g += `<line x1="${P + S / 2}" y1="${P}" x2="${P + S / 2}" y2="${P + S}" stroke="var(--text-3)" stroke-width=".8"/><line x1="${P}" y1="${P + S / 2}" x2="${P + S}" y2="${P + S / 2}" stroke="var(--text-3)" stroke-width=".8"/>`;
  [['Domestic absorbs', P + 6, P + 14, 'start'], ['Both accumulate', P + S - 6, P + 14, 'end'], ['Both distribute', P + 6, P + S - 6, 'start'], ['Foreign absorbs', P + S - 6, P + S - 6, 'end']]
    .forEach(([t, x, y, a]) => g += `<text x="${x}" y="${y}" font-size="10" fill="var(--text-3)" text-anchor="${a}">${t}</text>`);
  [-lim, 0, lim].forEach(v => g += `<text x="${sx(v)}" y="${P + S + 14}" font-size="9.5" text-anchor="middle" fill="var(--text-3)">${pc(v, 0)}</text><text x="${P - 4}" y="${sy(v) + 3}" font-size="9.5" text-anchor="end" fill="var(--text-3)">${pc(v, 0)}</text>`);
  g += `<text x="${P + S / 2}" y="${P + S + 30}" font-size="10" text-anchor="middle" fill="var(--text-2)">Foreign (% of total buy)</text><text x="10" y="${P + S / 2}" font-size="10" text-anchor="middle" fill="var(--text-2)" transform="rotate(-90 10 ${P + S / 2})">Domestic</text>`;
  g += `<polyline fill="none" stroke="var(--text-3)" stroke-width="1" points="${T.map(p => sx(p.x).toFixed(1) + ',' + sy(p.y).toFixed(1)).join(' ')}"/>`;
  const last = T.length - 1;
  T.forEach((p, i) => {
    const o = (.25 + .75 * i / Math.max(last, 1)).toFixed(2), r = i === last ? 7 : (i === state.hover ? 6 : 3.5);
    g += `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="${r}" fill="var(--text)" opacity="${i === state.hover ? 1 : o}"/>`;
  });
  const f = T[0], l = T[last];
  g += `<text x="${(sx(f.x) + 7).toFixed(1)}" y="${(sy(f.y) + 3.5).toFixed(1)}" font-size="11" font-weight="500" fill="var(--text)">${day(f.d)}</text>`;
  g += `<text x="${(sx(l.x) + 10).toFixed(1)}" y="${(sy(l.y) + 3.5).toFixed(1)}" font-size="11" font-weight="700" fill="var(--text)">now</text>`;
  if (state.hover > 0 && state.hover < last) { const h = T[state.hover]; g += `<text x="${(sx(h.x) + 9).toFixed(1)}" y="${(sy(h.y) - 6).toFixed(1)}" font-size="10.5" font-weight="600" fill="var(--text)">${day(h.d)}</text>`; }
  return g + '</svg>';
}

function levelTable(T) {
  const rows = T.map((p, i) => ({ p, i })).reverse();
  return `<table class="t"><tr><th>5D to</th><th class="fx">Foreign</th><th class="dm">Domestic</th><th>Verdict</th></tr>${rows.map(({ p, i }) =>
    `<tr data-i="${i}"><td>${day(p.d)}</td><td class="${cls(p.x)}">${pc(p.x)}</td><td class="${cls(p.y)}">${pc(p.y)}</td><td class="${cls(p.r)}">${pc(p.r)}</td></tr>`).join('')}</table>`;
}
function deltaTable(T) {
  const S = T.slice(1).map((p, i) => ({ i: i + 1, d: p.d, r: p.r, dr: p.r - T[i].r, dx: p.x - T[i].x, dy: p.y - T[i].y })).reverse();
  return `<table class="t"><tr><th>5D to</th><th>Verdict</th><th>Δ Verdict</th><th class="fx">Δ Foreign</th><th class="dm">Δ Domestic</th><th>Driver</th></tr>${S.map((s, k) =>
    `<tr data-i="${s.i}" class="${k === 0 ? 'cur' : ''}"><td>${day(s.d)}</td><td class="${cls(s.r)}">${pc(s.r)}</td><td class="${cls(s.dr)}">${pt(s.dr)}</td><td class="${cls(s.dx)}">${pt(s.dx)}</td><td class="${cls(s.dy)}">${pt(s.dy)}</td><td>${tag(s)}</td></tr>`).join('')}</table>`;
}

function render() {
  const T = T_ALL.slice(-state.n);
  document.getElementById('sub').textContent = `${D.ticker} · ${day(T[0].d)} – ${day(T.at(-1).d)} · rolling 5D · Top ${D.n} · ${D.board}`;
  document.getElementById('mapBox').innerHTML = map(T);
  document.getElementById('tbox').innerHTML = state.view === 'level' ? levelTable(T) : deltaTable(T);
  document.getElementById('cap').textContent = state.view === 'level'
    ? `${T.length} sessions; the list scrolls. Newest first.`
    : `${T.length - 1} changes; the list scrolls. Δ = change from the session before, in percentage points. Δ Verdict = Δ Foreign + Δ Domestic.`;
  document.querySelectorAll('#spanSeg button').forEach(b => b.classList.toggle('on', +b.dataset.n === state.n));
  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === state.view));
  document.querySelectorAll('#tbox tr[data-i]').forEach(tr => {
    const i = +tr.dataset.i;
    tr.addEventListener('mouseenter', () => { state.hover = i; softMap(); tr.classList.add('hl'); });
    tr.addEventListener('mouseleave', () => { state.hover = -1; softMap(); tr.classList.remove('hl'); });
  });
}
function softMap() { document.getElementById('mapBox').innerHTML = map(T_ALL.slice(-state.n)); }

document.getElementById('spanSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.n = +b.dataset.n; state.hover = -1; render(); } });
document.getElementById('viewSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.view = b.dataset.v; render(); } });
render();
</script>
</body>
</html>
